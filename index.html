const SHORT_RAW = `
6|D R K|Indra, sage Upamanyu, sage Parasara, King Uparichara Vasu|An old brahmana came to King Uparichara Vasu and ate everything the kitchens could cook, then asked for a pot of appam. As the king handed it over, the guest showed Himself as the Lord. He still rests with His right hand on that pot, and appam is offered every evening. Nammazhwar sang his last temple decad here before leaving for Paramapadam, so devotees pray here for a peaceful end.|The Lord reclining facing west, hand on the appam pot;The evening appam offering;The raised temple on the south bank of the Kollidam|Reach from Thanjavur via Thirukkattupalli or from Trichy via Kallanai. Anbil (5) is on the opposite bank; ask locally about the crossing.
7|D|Brahma, Shiva|Shiva plucked off one of Brahma's five heads, and the skull stuck fast to his palm. He wandered as a beggar until, at this place, he bathed and worshipped Vishnu and the skull fell away. The Lord is therefore "He who removed Hara's curse". A Shiva temple, Brahma Sira Kandeeswarar, stands just across the road.|Hara Sapa Vimochana Perumal standing, facing east;Kapala Moksha Pushkarini;The neighbouring Shiva temple of the same story|On the Thanjavur to Thiruvaiyaru road, 10 km from Thanjavur. A short stop.
8|D R|Kaveri, sage Nandaka, King Ambarisha|When Hiranyaksha carried the earth away, the devas gathered (koodal) here to call on the Lord, who entered the ground at this spot as Varaha and came up at Srimushnam. Hence He is Vaiyam Katha Perumal, protector of the world. The river Kaveri bathed here to cleanse herself of the sins left in her by pilgrims.|Jagathrakshakan standing with the discus ready to throw;The spot behind the sanctum said to be where the Lord entered the earth;The jackfruit tree with a natural conch mark|Between Thiruvaiyaru and Kumbakonam on the north bank road. Often open only in the morning; call ahead.
9|E R|Gajendra, Hanuman (Anjaneya), sage Parasara|King Indradyumna, cursed to be born an elephant, was seized by a crocodile while gathering lotuses for worship and cried "Adimoolame!" The Lord came on Garuda and freed him. Hanuman also worshipped here, which gives the name Kapi-sthalam, place of the monkey. It is one of the five Krishnaranya kshetrams.|Gajendra Varadan reclining, facing east;Gajendra Pushkarini and Kapila Theertham;The Gajendra moksha festival on Aadi full moon|3 km from Papanasam, between Kumbakonam and Thanjavur.
10|E B|Sri Rama, Jatayu, Thirumangai Azhwar|Rama performed the funeral rites for Jatayu, who had died fighting Ravana. Because Sita was absent, Bhumi Devi stood beside Him for the rite. Tired, He lay down here, and He is seen reclining as Rama with bow in hand. Thirumangai Azhwar at first walked past thinking it another deity, and turned back to sing ten verses.|Valvil Raman reclining, a rare form;Jatayu Theertham;The Lord as utsavar with four arms|Near Swamimalai, 10 km from Kumbakonam. Pair with Adanur (11), a kilometre away.
11|D B|Kamadhenu, Sage Bhrigu, Thirumangai Azhwar|Kamadhenu, the celestial cow (Aa), did penance here, so the village is Aa-than-ur. The Lord reclines with a grain measure under His head and a stylus and palm leaf in His hand, as the One who measures out everyone's due. Tradition says He came as a merchant's accountant to pay the workers who were building the walls of Srirangam for Thirumangai Azhwar.|The measure (marakkal), stylus and leaf;Two pillars near the sanctum that pilgrims embrace, praying for liberation|1 km from Pullabhoothangudi (10). Small temple, short hours.
14|R B|Sage Medhavi, Brahma, Thirumangai Azhwar|Sage Medhavi found Lakshmi as a child under a vanjula tree and raised Her as Vanjulavalli. The Lord came with four companions as guests and married Her, promising that She would always take the lead here. So Thayar stands a step ahead in the sanctum, leaves first in procession and is offered food first. Thirumangai Azhwar received his initiation from this Lord and gave Him 110 verses.|Srinivasa with Vanjulavalli Thayar standing forward of Him;The Kal Garuda: a stone Garuda carried out in Margazhi and Panguni, said to grow heavier as he is taken from the shrine, needing 4, then 8, 16, 32 and 64 bearers;The raised "mada koil" built by Kochengat Chola|10 km south of Kumbakonam. Combine with Oppiliappan (13) and Thirucherai (15).
15|D R|Kaveri, sage Markandeya, Indra|Before the deluge Brahma kept the Vedas and seeds of creation in a pot made of the clay (saram) of this place, the only clay that held. The river Kaveri did penance here to be honoured like Ganga, and the Lord appeared to her as a child and granted that She would be worshipped beside Him. Everything here is named Sara, the essence.|Saranathan with five consorts: Sri, Bhu, Nila, Saranayaki and Mahalakshmi;Kaveri Amman shown as a mother with the child Lord, by the Sara Pushkarini;Thai Poosam car festival|15 km from Kumbakonam on the Tiruvarur road.
16|D R L|Varuna, sage Romasa, Lakshmi|Lakshmi did penance here and the Lord came from the Milk Ocean to marry Her; the devas who came for the wedding stayed on as bees to keep seeing it. A beehive by the Thayar shrine is still honoured. The Lord is Bhaktavatsala, "Patharavi", He who rushes to His devotees. Seven sacred features in one place give it the name Saptamrita kshetram.|Bhaktavatsala Perumal standing, with a large Garuda;The beehive near Abhishekavalli Thayar's shrine;Darshana Pushkarini|8 km from Tiruvarur towards Kumbakonam.
18|R B|Sage Bhrigu, Brahma, sage Vasishtha, Thirumangai Azhwar|Vasishtha made a Krishna of butter and worshipped it. Krishna came as a child and ate the image; the sage chased Him, and the rishis meditating under a magizha tree here bound Him with their devotion. Hence Kannan-gudi, where Krishna stayed. Four local sayings recall Thirumangai Azhwar: the tamarind that does not sleep, the well that does not spring, the magizha that does not dry, and the lawsuit that does not end.|Lokanathan and the utsavar Damodara Narayanan;Garuda with folded hands, as in Vaikuntha;The tank and magizha tree of the sayings|Between Tiruvarur and Nagapattinam near Sikkal.
19|D K B|Adisesha (Naga-raja), Dhruva, Thirumangai Azhwar, King Salisuka Chola|Adisesha did penance here and was granted the place as his bed, so the town is Nagai, Naga-pattinam. The boy Dhruva also meditated here and was so struck by the Lord's beauty that he forgot to ask his boon. The Lord is Soundararajan, king of beauty. The temple shows Him standing, sitting and reclining.|Neelamegha Perumal standing, with Soundararajan the utsavar;A rare bronze Narasimha with eight arms;Sara Pushkarini|In Nagapattinam town. Pair with Thirukannapuram (17) and Thirukannangudi (18).
21|D K|Nandi, King Sibi|Nandi was cursed by the gatekeepers of Vaikuntha for entering without leave and suffered a burning body. Shiva sent him here to do penance, and Vishnu relieved him; the place took Nandi's name. King Sibi, who gave his own flesh to save a dove, is said to have been tested here. The Lord faces west, and the kshetram is called the Jagannatha of the south.|Jagannatha seated, facing west, with sword and bow;Nandi carved in the sanctum wall;Shenbagavalli Thayar, worshipped for reunion of couples|10 km south of Kumbakonam near Patteeswaram; known locally as Nathan Koil.
22|D R|Sukra, Brahma, Indra, sage Parasara, Mayan|When Vamana asked Bali for three paces, Sukracharya took the form of a bee and blocked the spout of the water vessel; Vamana cleared it with a blade of grass and Sukra lost an eye. He did penance here and regained his sight, so the place is the "silver" (Velli, Venus) town. Mayan, architect of the asuras, was shown the Lord as Rama with the bow; Garuda took the conch and discus to hold for Him.|Kola Valvil Raman reclining, the image coloured as painted stucco;Garuda with four arms holding conch and discus, found nowhere else;A lamp kept burning as Sukra's light|Between Kumbakonam and Anaikkarai near Thirupanandal. Worship here is said to equal all 108.
23|D R K|Kaveri, Agastya, Dharma-deva, King Uparichara Vasu, Markandeya|Uparichara Vasu's flying chariot sank (azhundu) to the ground here when he gave a biased verdict, which names the town. Krishna stands as the cowherd Amaruviappan, "He who delights in the cows", with a cow and calf beside Him; Brahma had hidden His herd and He made another. Prahlada and Garuda also stand in the sanctum. The poet Kambar was born here.|Devadirajan, about 13 feet tall, with cow and calf, Prahlada and Kaveri at His sides;Images of Kambar and his wife in the temple;Darshana Pushkarini|Between Mayiladuthurai and Kumbakonam, 3 km off the main road at Komal Road.
24|R D|Sage Vyaghrapada, Vyasa|Vyaghrapada, the tiger-footed sage devoted to Nataraja, asked Shiva for liberation and was sent to Vishnu here. Because the old sage's sight was weak, the Lord who lies vast at Srirangam appeared in a small reclining form he could take in. The place is "little Puliyur", and the Lord is Arulmakadal, ocean of grace. Adisesha has a shrine as protector from Garuda.|The Lord in bala sayanam, a very small reclining form facing south;Shrine of Adisesha (Anantazhwar);Vyaghrapada and Patanjali by the sanctum|2 km from Kollumangudi on the Mayiladuthurai to Tiruvarur road.
25|D|Chandra, the devas|Chandra, cursed for his offence against Brihaspati, bathed in the tank here and was restored; the Lord wears the moon on His head like Shiva and is called Nanmadiya Perumal, Lord of the full moon. The name recalls the conch (sangu) trade of this old port near Poompuhar.|Nanmadiya Perumal standing, facing east;Chandra Pushkarini;The quiet village setting by the sea road|Near Akkur between Mayiladuthurai and Sirkazhi; short hours, so call the priest.
26|D K|Chandra, King Ambarisha|Chandra (Indu) was freed of his curse here, giving the name Indalur. King Ambarisha completed his hundredth Ekadasi fast here, and the Lord, pleased, stayed as Parimala Ranganatha, the fragrant one who restored the Vedas. Thirumangai Azhwar arrived to find the doors closed and scolded the Lord: "Keep Your beauty to Yourself then!"|Parimala Ranganatha in green stone, reclining, with Kaveri at His head and Ganga at His feet;Chandra and Surya worshipping in the sanctum;Indu Pushkarini|In Mayiladuthurai town. One of the Pancharanga kshetrams; the Aippasi Tula bath in the Kaveri ends here.
27|D R|Indra, Varuna, Vishvaksena, sage Mitra|After defeating Narakasura, Krishna brought the parijata from Indra's garden for Satyabhama, and chose this grove because it resembled the one in heaven. He stands here as Rajagopala with Rukmini and Satyabhama. Among the Nangur eleven this one is linked with Dvaraka.|Gopalakrishnan with Rukmini and Satyabhama in one sanctum;There is no separate Thayar shrine|One of the eleven around Thirunangur, 8 km from Sirkazhi. See the planning note under the Thirunangur group.
28|R B|Sage Romasa, Thirumangai Azhwar|Sage Romasa longed to see the Trivikrama form, and the Lord showed it here with the left foot raised: Thadalan, "He of the striding foot". Outside this town the child-saint Sambandar met Thirumangai Azhwar, heard his verses and gave him his own spear in admiration; the Azhwar's image holds it still.|Trivikrama with left foot raised and right hand in the giving pose;The utsavar Thadalan;The spear in the hand of Thirumangai Azhwar's image|In Sirkazhi town, a short way from the great Shiva temple.
29|D R|Sage Uttanka, the devas|When Shiva danced in grief after Sati's death, eleven Rudras sprang up, and the devas begged Vishnu to calm him. Vishnu came to Nangur in eleven forms, one for each Rudra; these are the eleven temples. Here He is Krishna the pot dancer, Kudamadu Koothan, linked with Govardhana.|The Lord seated, with a pot of butter;Amritaghatavalli Thayar;Garuda sevai meeting point at Manimada Koil in Thai|In Thirunangur village.
30|R|Sage Upamanyu, sage Vyaghrapada|The child Upamanyu, left at the temple by his father Vyaghrapada, cried from hunger, and the Lord and Thayar gave him the Milk Ocean to drink. The Lord is Purushottama, linked among the eleven with Ayodhya.|Purushottaman standing, facing east;Thirupparkadal Theertham|In Thirunangur, walking distance from Manimada Koil (32).
31|R E|Sri Rama, sage Dridhanetra, Rudra|After the war Rama stayed at the hermitage of sage Dridhanetra, had a golden cow made, and gave it away; with that gold this temple was built, hence "the temple made of pure gold". Linked with Kanchi's Perarulalan (some say Uraiyur).|Perarulalan standing with Sri and Bhu;Hema (golden) Pushkarini|In Thirunangur.
32|D|Indra, the eleven Rudras, Chandra|The Lord came from Badarikashrama as Narayana, the unfailing lamp (Nanda Vilakku), to end Shiva's dance of grief. This temple is the gathering place of the Nangur eleven: on the day after Thai new moon all eleven Perumals arrive on golden Garudas and Thirumangai Azhwar, on his swan, sings to each.|Narayana seated;The Garuda Sevai mandapam;Indra Pushkarini|The centre of the Thirunangur circuit; start here.
33|R K|Sage Uttanka, King Uparichara Vasu, King Svetaketu|King Svetaketu and his queen, after long penance, were told by Narada to worship here and were shown Vaikuntha itself. The Lord sits as He does in the eternal abode, with Sri, Bhu and Nila. Linked among the eleven with Paramapadam.|Vaikuntanathan seated on Adisesha;Lakshmi Pushkarini|In Thirunangur.
34|D R B|Prajapati, sage Purnamaharishi, Thirumangai Azhwar|Two temples five kilometres apart. At Thiruvali, Narasimha was calmed when Lakshmi sat on His right lap and embraced Him (ali). At Thirunagari is the main temple of Thirumangai Azhwar, who was born nearby and ruled this country. Between them at Vedarajapuram the Lord and Thayar came as a wedding couple; the Azhwar tried to rob them and received the mantra in his ear.|Lakshmi Narasimha at Thiruvali, small and intense;Vedarajan and the large shrine of Thirumangai Azhwar with Kumudavalli at Thirunagari;The Vedupari (robbery) festival in Panguni|Between Sirkazhi and Poompuhar. Visit both; the festival night is unforgettable.
35|R D|Sage Vasishtha, the devas|When Lakshmi rose from the Milk Ocean and chose Vishnu, the devas came in a crowd (thogai) to witness the wedding. The Lord is Deivanayaka, Lord of the gods; the utsavar is Madhava. Linked among the eleven with Thiruvidanthai.|Deivanayakan standing, facing west;Kadalmagal Nachiyar, daughter of the ocean|At Keezhachalai, on the bank of the Manniyar, 1 km from Thirunangur.
36|D|Adisesha, Shiva|The only one of the eleven where the Lord reclines, and the only Divya Desam called an ambalam (hall), a word usually kept for Shiva's Chidambaram. He is Senganmal, "the Lord with reddened eyes", resting after rescuing the earth. Linked with Srirangam.|The Lord reclining on Adisesha, facing east, with four arms;Surya Pushkarini|In Thirunangur; locally Palli Konda Perumal Koil.
37|D|Chandra, Garuda|Chandra, wasting from Daksha's curse, was restored here. The Lord is Varadaraja, giver of boons, linked with Kanchipuram.|Varadarajan standing, facing east;Chandra Pushkarini|Just outside Thirunangur towards Thiruvellakkulam.
38|K B|King Svetan, sage Maruthuva, Kumudavalli|Prince Svetan, fated to die young, bathed in the tank and prayed here and was granted long life. Kumudavalli, a celestial maiden, was found by this tank and raised by a physician; she agreed to marry the chieftain Neelan only if he fed a thousand Vaishnavas daily, and so made him Thirumangai Azhwar. The Lord is Srinivasa, called Annan, elder brother of the Lord of Tirumala; vows made to Tirumala may be fulfilled here.|Srinivasa (Annan Perumal) standing;Sveta Pushkarini, the "white tank";Shrine of Kumudavalli Nachiyar|Annan Koil, 2 km from Thirunangur on the Sirkazhi road.
39|E D|Arjuna, Varuna, the eleven Rudras|Arjuna, on pilgrimage and thirsty, struck the ground with his sword at sage Agastya's word and water sprang up; Krishna appeared and taught him. The place is Partha's school (palli). The utsavar is Parthasarathy; linked with Kurukshetra.|Thamaraiyal Kelvan standing, facing west;Parthasarathy with a dagger;Shrine of Arjuna|2 km from Thirunangur, the farthest of the eleven.
40|R D|Shiva, sages Patanjali and Vyaghrapada, the three thousand Dikshitars|In the great temple of Nataraja the Lord reclines a few steps from the dancing hall, and from one spot both can be seen. Tradition says He was the judge of the dance contest between Shiva and Kali. Kulasekhara Azhwar sees Chitrakuta of the Ramayana here and tells the whole epic in eleven verses. The shrine was removed in the 12th century and restored later; the utsavar was taken to Tirupati by Ramanuja and became Govindaraja there.|Govindaraja reclining, facing east, with Brahma on the navel lotus;The spot from which Nataraja and Govindaraja are both visible;Pundarikavalli Thayar's shrine|Inside the Nataraja temple, Chidambaram.
41|D R B|Garuda, Adisesha, Brahma, Shiva, Indra, sage Markandeya, Vedanta Desika|The Lord, thirsty, asked for water: Garuda brought the river Gadilam from the hills and Adisesha (Ahindra) struck the ground with his tail to make a well, so the town is Ahindra-puram. On the hillock Oushadagiri, said to be a piece of the Sanjivani hill, Vedanta Desika meditated on the Garuda mantra and received the grace of Hayagriva. He lived here some forty years.|Devanathan standing, said to carry marks of Brahma, Vishnu and Shiva;The Hayagriva shrine on Oushadagiri, the oldest known;The well of Adisesha (Sesha Theertham) and the house of Vedanta Desika|5 km west of Cuddalore on the Gadilam.
44|E D|Gajendra, Brahma|When demons came to destroy Brahma's sacrifice, the Lord appeared with eight arms and eight weapons. Local tradition also places Gajendra's rescue at the tank here. It is the only Divya Desam where the Lord has eight arms, and it has a "gate of heaven" like Srirangam.|Adikesava with eight arms: discus, sword, lotus, arrow on the right; conch, bow, shield, mace on the left;Gajendra Pushkarini|In Vishnu Kanchi, 1 km from Varadaraja (43).
45|D B|Brahma, Saraswati, Vedanta Desika|Saraswati, angry at being left out of Brahma's sacrifice, sent darkness to stop it; the Lord came as a lamp (vilakku oli) and dispelled it. Vedanta Desika was born in the lane beside the temple, Thoopul, in 1268, and his shrine and his own Hayagriva image are here.|Deepaprakasa standing, facing west;Shrine of Vedanta Desika with his Lakshmi Hayagriva;Saraswati Theertham|In Kanchipuram near Ashtabuyagaram (44).
46|R|Sage Bhrigu, Prahlada|Narasimha came out of the Hastisaila cave to drive off the demons troubling Brahma's sacrifice, chased them to this spot and chose to stay, seated in yoga. Vel-irukkai, "the place He wished to stay".|Azhagiya Singar (Mukunda Nayaka) seated in yoga;Kanaka Saras tank|In Kanchipuram, a few minutes from Thoopul (45).
47|R|Akrura|Now a shrine inside the Ulagalantha Perumal temple. Thirumangai Azhwar names it in one breath with Karagam and Karvanam: "You are in Neeragam...". The Lord is Jagadisvara, of the nature of water, which sustains all.|The small shrine of Jagadisvara in the outer corridor of Ulagalantha Perumal (50)|Four Divya Desams are covered in one visit to the Ulagalantha temple: 47, 50, 52, 53.
48|E K R|King Janamejaya, sage Harita, Dhritarashtra (in the story)|Krishna went to Hastinapura as the Pandavas' envoy. Duryodhana set a false seat over a pit of wrestlers; Krishna sat, the seat gave way, and He rose in His universal form. Janamejaya, hearing the Mahabharata, prayed here to see that form. The seated Lord is about 25 feet tall. Padagam is from "padu agam", the great abode.|Pandava Thoothar, among the largest seated images of Krishna;Inscriptions of Kulottunga Chola;Matsya Theertham|In Kanchipuram near the Ekambareswarar temple. Linked with the star Rohini.
49|D L|Shiva, Parvati|Parvati did penance under the mango tree of Ekambareswarar. When Shiva tested her with fire, she called on her brother Vishnu, who cooled the flames with the rays of the moon; hence "the piece of the cool moon". A Divya Desam inside a Shiva temple, and Shaiva priests perform the worship.|The shrine in the inner corridor of Ekambareswarar temple;The ancient mango tree nearby|Inside the Ekambareswarar temple, Kanchipuram.
50|K D|Mahabali, Adisesha|Trivikrama here is about 35 feet tall, left leg raised parallel to the ground, two fingers of one hand and one of the other showing the paces taken and the pace still owed. Mahabali, under the Lord's foot, could not see the whole form and begged for one he could; the Lord showed Himself as Adisesha in a small shrine, Uragam.|The towering Ulagalantha Perumal;The Uragathan (serpent) shrine, worshipped for relief from naga dosha;The other three Divya Desam shrines in the same compound|In the centre of Kanchipuram near the Kamakshi temple.
52|R|Sage Garga|A shrine in the Ulagalantha compound. Sage Garga did penance and gained knowledge, and the place was Garga-agam, later Karagam. The Lord is Karunakara, source of compassion, like the rain cloud (kar) that gives without asking.|Karunakara Perumal seated on Adisesha, facing north|Inside the Ulagalantha Perumal temple (50).
53|L|Parvati (Gauri)|A shrine in the Ulagalantha compound. The Lord is Kalvar, dark as the rain-bearing sky (kar vanam), named in the same verse of Thirumangai Azhwar as Neeragam and Karagam.|Kalvar standing, facing north, with Kamalavalli Thayar|Inside the Ulagalantha Perumal temple (50).
54|L R|Parvati (Kamakshi), Lakshmi, sage Asvatthanarayana|A small niche shrine inside the Kamakshi Amman temple, beside the sanctum. Lakshmi and Parvati were talking privately and the Lord listened in from hiding; Parvati called Him "kalvan", thief. One of the smallest of all Divya Desams.|Adi Varaha (Kalvar) in a niche to the right of Kamakshi's sanctum;Images of the Lord in standing, sitting and reclining forms on the tank side|Inside the Kamakshi Amman temple, Kanchipuram. Ask the temple staff to point it out.
55|D R|Brahma, the Ashvini devas, Parvati|The Lord takes a colour for each age: white in Krita, coral red in Treta, green in Dvapara, dark in Kali. Here He stayed in the coral hue after defeating demons sent against Brahma's sacrifice. Opposite stands Pachai Vannar, the emerald Lord, and pilgrims see the two together.|Pavalavannar with coral complexion;Pachai Vannar temple across the road (not itself a Divya Desam)|Near Kanchipuram railway station.
56|K|The Pallava king Parameswara Varman (Nandivarman II)|Built by Nandivarman II Pallavamalla in the 8th century, a little after the Kailasanatha temple, and named for him: Parameswara's Vishnu-house. Three sanctums rise one above another: the Lord seated at ground level, reclining above (opened on Ekadasi), and standing at the top. Panels around the cloister carve the history of the Pallava kings.|The three-tier vimanam;Lion pillars and the sculpted history gallery;Vaikuntanathan seated, facing west|In Kanchipuram; maintained by the Archaeological Survey of India. A favourite of art historians.
57|E|Jatayu|Jatayu (pul, the bird) fell here fighting Ravana, and Rama cremated him in a pit (kuzhi). The Lord sits holding Jatayu, turned slightly as if from the heat of the pyre; Sri Devi and Bhu Devi have exchanged sides. Childless women tie soaked gram here overnight as a prayer. Ramanuja studied Vedanta in this village under Yadavaprakasa.|Vijayaraghava seated with Jatayu on His lap;Jatayu Theertham and the shrine of Jatayu opposite;The stone horse vahana with moving parts|At Baluchetti Chatram on the Chennai to Vellore highway, 11 km west of Kanchipuram.
58|D L|Varuna, the ocean king (Samudra-raja), Lakshmi|Lakshmi (Thiru) came away from the Milk Ocean and stood (nindra) here; Her father the ocean king pleaded "you are the mother who bore me", which became Her name, Ennai Petra Thayar. The Lord followed and stayed as Bhaktavatsala. Thirumangai Azhwar passed without singing; Thayar sent the Lord after him, and he gave a verse at Mamallapuram and another at Thirukannamangai.|Bhaktavatsala standing, facing east;Ennai Petra Thayar's shrine;Varuna Pushkarini|On the Chennai to Tiruvallur suburban line, 30 km from Chennai.
59|R|Sage Salihotra|Salihotra, after a year's fast, cooked a little rice and waited for a guest. An old brahmana came, ate it all, and asked "evvul?", where shall I sleep. Shown the hut, He lay down facing south and revealed Himself; His right hand still rests on the sage's head. He is Vaidya Veeraraghava, the physician: devotees dissolve salt and jaggery in the tank for healing, and new moon days draw great crowds.|Veeraraghava reclining on Adisesha, about 15 feet long, hand blessing Salihotra;Hrit-tapa-nasini tank, "remover of the heart's burning";Kanakavalli Thayar|In Tiruvallur town, 45 km west of Chennai. Administered by the Ahobila Mutt.
61|R B|Sages Bhrigu and Markandeya, Valmiki, Thondaiman|Thirumangai Azhwar found the hill ringed by flood water and waited six months on the opposite hill for it to subside; hence Neer-malai, the water hill. Valmiki, after worshipping the three forms on the hill, longed to see Rama, and the Lord appeared at the foot as Neervanna. So the four postures are all here.|At the foot: Neervannan standing, and Rama with Valmiki;On the hill (about 200 steps): Ranganatha reclining, Santa Narasimha seated, Trivikrama striding;The tank with four theerthams|5 km from Pallavaram near Chennai airport. Climb early; the hill shrine closes by late morning.
62|R L|Sage Kalava, Markandeya, Bali|Sage Kalava had 360 daughters and prayed for a husband for them. The Lord came as a young brahmana and married one each day through the year; on the last day He gathered them into one, Akhilavalli, and seated Her on His left as Varaha. Since every day is a wedding day He is Nitya Kalyana Perumal, and the unmarried come with two garlands to pray.|Lakshmi Varaha, about nine feet tall, left foot on Adisesha, Bhumi Devi on His thigh;The natural beauty spot (drishti pottu) on the utsavar's chin;Komalavalli Thayar's shrine|On the East Coast Road, 40 km south of Chennai, near Kovalam.
63|R B|Sage Pundarika, Bhoothath Azhwar|Sage Pundarika gathered a thousand-petalled lotus to offer in the Milk Ocean and began baling out the sea with his hands to get there. The Lord came as an old man, sent him for food, and meanwhile lay down on the bare ground wearing the lotus. He lies without Adisesha, His right hand to His chest, inviting devotees closer. Bhoothath Azhwar was born here in a flower.|Sthalasayana Perumal lying on the ground;The birthplace shrine of Bhoothath Azhwar;The older shore-temple image of the reclining Lord, by the sea|In the middle of Mamallapuram, near the bus stand. Combine with Thiruvidanthai (62).
64|R E|The seven sages, Vishvamitra, Hanuman, Prahlada|The seven sages asked to see the Narasimha form in peace, and He showed it after they had meditated just one kadigai (24 minutes); Vishvamitra became a brahmarishi here in that time. Hanuman, sent to protect the sages with the conch and discus, sits in yoga on the smaller hill facing the Lord. People come for relief from illness of the mind, especially in Karthigai.|Yoga Narasimha on the big hill (about 1,300 steps) with Amritavalli Thayar;Yoga Anjaneya with four arms on the small hill (about 400 steps);Bhaktavatsala, the utsavar, in the town temple below|Sholinghur, 25 km from Arakkonam. Start at dawn, carry water, guard your belongings from monkeys. A ropeway serves the big hill; check that it is running.
65|L E R|Lakshmi, Gajendra, the nine yogis (Navayogis)|Nine yogis each installed an image here; eight sank into the earth, and the ninth, Nava Mukunda, was stopped at the knees. Lakshmi and Gajendra both offered lotuses from the same lake; when Gajendra found none left he complained, and the Lord seated Lakshmi beside Him to share the elephant's worship. The river bank is revered like Kasi for ancestral rites, and the Mamankam festival was held here.|Nava Mukunda standing, visible only above the knees;A separate shrine of Malarmangai Nachiyar, unusual in Kerala;The Bharathapuzha ghat with Brahma and Shiva temples on the far bank|Tirunavaya, 8 km from Tirur station in Malappuram district.
66|K E|King Ambarisha, the Pandavas|Four images of Vishnu, said to have been installed by Yudhishthira, Bhima, Arjuna and the twins, stand in one temple together with a Shiva shrine. King Ambarisha attained liberation here. Kulasekhara Azhwar's ten verses pile image on image of helplessness: the child clinging to the mother who pushes it away, the patient loving the surgeon who cuts.|The four Vishnu shrines and Shiva (Anjumoorthy temple);The Bharathapuzha flowing beside|Thirumittakode, 10 km from Pattambi in Palakkad district.
67|K R|Mahabali, sage Kapila|Here Vamana received three paces from Mahabali and sent him to the lower world, granting him a yearly return to see his people: the festival of Onam. The ten-day festival begins here with the flag raising on Atham, and the Onam feast is served to all. A Shiva temple said to have been worshipped by Mahabali stands alongside.|Vamana (Thrikkakara Appan) standing;Mahabali's Shiva shrine;The round sanctum in Kerala style|Thrikkakara, in Kochi near Edappally. Onam (August to September) is the time.
68|E R|Lakshmana, Bharata, sage Harita|Sage Harita received the sacred words (thiru mozhi) of the Lord here, which names the place. Bharata, on his way to bring Rama back, was first suspected by Lakshmana; they were reconciled and worshipped together here. In Kerala's Nalambalam pilgrimage of the month of Karkidakam it is the temple of Lakshmana.|Thirumoozhikkalathan standing with four arms;The traditional Kerala koothambalam (theatre hall)|Moozhikkulam, between Aluva and Mala, 10 km from Kochi airport.
69|B R|Ghantakarna, a brahmana lady (Sankaramangalathamma), Vishvakarma|A pious lady who kept the Ekadasi fast was troubled by the demon Tholakasura; the Lord came as a brahmachari, slew him with the discus, and showed Lakshmi on His chest, so He is Sri Vallabha. The Sudarsana He set down is worshipped behind the sanctum. Kathakali is performed almost nightly as an offering.|Sri Vallabha about eight feet tall; face and feet cannot be seen together;The 50-foot granite flagstaff with Garuda;The Sudarsana shrine facing west|In Thiruvalla town. Traditional rules on dress apply.
70|E K|Sahadeva, King Rukmangada|Consecrated by Sahadeva, youngest of the Pandavas, for a self-manifest image. King Rukmangada's Ekadasi vow is also placed here. The name is "the place of the kadigai", where a moment's worship suffices. The round sanctum has a Narasimha shrine on the west side.|Arputha Narayanan standing, facing east;Narasimha on the rear side of the same sanctum;Murals on the sanctum wall and a curious stone figure on a pillar by the gate|Thrikkodithanam, 2 km from Changanassery.
71|E D|Yudhishthira, the devas (Imayavar), Shiva|Yudhishthira, grieving that he had misled Drona with the words "Asvatthama is dead", did penance here and renovated the temple. The devas had worshipped here before him, so the Lord is Imayavar-appan, father of the gods.|Imayavarappan standing, facing west;Sanku Theertham|Thrichittattu, 1 km from Chengannur town.
72|E R|Bhima, the seven sages|Consecrated by Bhima; a great mace kept here is called his. In Nammazhwar's decad a friend tells the girl's mother: she is already marked as belonging to Mayapiran of Puliyur, do not think of another match.|Mayapiran standing, facing east;The heavy stone mace said to be Bhima's|Thripuliyur, 4 km west of Chengannur.
73|E D|Arjuna, Brahma|Arjuna built this temple in atonement for killing Karna when he was unarmed; the image is said to have come down the Pampa on a raft of six bamboos (aaru mula). The jewels of Ayyappa rest here on the way to Sabarimala, and the snake boats escort the Onam offering by river. The metal mirror of Aranmula is made nowhere else.|Parthasarathy standing, facing east;The eighteen steps to the eastern tower and fifty-seven down to the Pampa;The Vallasadya feast for the boat crews (July to October)|Aranmula, 10 km from Chengannur on the Pampa.
74|E R|Nakula, sage Narada, sage Markandeya|Consecrated by Nakula. Narada received knowledge here and composed his teaching. In Nammazhwar's decad the girl in love sends bees, herons and swans as messengers to the Lord of this town.|Pambanai Appan standing, facing west;The Gopalakrishna shrine, whose image was found in the temple tank|Thiruvanvandoor, 6 km north of Chengannur.
77|R D B|Udayanangai, Kari, the seven sages, Garuda, King Kulasekhara|The seven sages asked to see the Lord in a gentle form, and He sits here with Lakshmi on His chest: Thiru-vazh-marban. So Thayar has no separate shrine. Udayanangai of this village married Kari of Kurugur; childless, they prayed here and received Nammazhwar. The image is of katusarkara (herbal mortar) and is not bathed.|Thiruvazhmarban seated, about nine feet tall, with the seven sages around;The home of Udayanangai nearby;Lakshmi Theertham|Thiruppathisaram, 5 km from Nagercoil.
78|D R B|Shiva, Brahma, Nampaduvan, Thirumangai Azhwar, Ramanuja|Varaha came here with Bhumi and reduced His vast form to a small one: Kurun-gudi, the short dwelling. Five Nambis are worshipped: standing, sitting, reclining, the Nambi of the Milk Ocean nearby and the Nambi on the hill. The Lord told Kari and Udayanangai that He Himself would be born as their son, Nammazhwar. The low-born singer Nampaduvan kept his word to a demon on Kaisika Ekadasi and freed him by giving the fruit of one song.|The three Nambis in the main temple;The flagstaff set aside so that Nampaduvan could see the Lord from outside;Malai Mel Nambi on the hill, 8 km by forest road;Thiruvarasu, memorial of Thirumangai Azhwar|45 km south of Tirunelveli. Kaisika Ekadasi (Karthigai) drama is performed through the night.
79|D R L|Brahma, Indra, sages Bhrigu and Markandeya, Bhumi Devi, Urvasi and Tilottama|A self-manifest kshetram: the Lord sits under the hood of Adisesha with Sri and Bhu, attended by Urvasi and Tilottama with fans, as in Vaikuntha. He is anointed with oil every day, and the oil, kept in an open well, is taken as medicine for skin ailments. Lakshmi grew up here as Srivaramangai. It is the seat of the Vanamamalai Jeeyars, a Tenkalai mutt founded in the 15th century.|Thothadrinathan seated in royal ease;The oil well (ennai kinaru);The Vanamamalai Mutt beside the temple|Nanguneri, 30 km south of Tirunelveli on the Nagercoil highway.
80|D B|Brahma, Indra, the thief Kaladushaka|A demon stole the Vedas from Brahma; Brahma did penance on the Tamraparni and the Lord restored them, standing here as Vaikuntanatha. A thief, Kaladushaka, gave half of all he stole to this Lord; when the king's men came, the Lord took the thief's form and taught the king: hence the utsavar's name Kallapiran, Lord of the thief. Twice a year the rising sun lights the Lord from feet upward.|Vaikuntanatha standing under Adisesha, without consorts beside Him;The exquisite utsavar Kallapiran;The large hall with Nayak-period sculpture|30 km east of Tirunelveli. First of the Nava Tirupati (Surya); begin the circuit here at opening time.
81|D R|Agni, sage Romasa, the brahmana Vedavit|The brahmana Vedavit performed long penance here chanting the asana mantra, and the Lord appeared seated in victory: Vijayasana. Sage Romasa taught that whoever dies here attains liberation.|Vijayasana Perumal seated under the hood of Adisesha;Agni Theertham|Natham, 2 km east of Srivaikuntam (Chandra).
82|D R|Varuna, Nirruti, Dharma-raja, Indra|Bhumi Devi, feeling neglected while the Lord walked here with Lakshmi, withdrew to the lower world; He brought Her back and reconciled them, and is Bhumipalan. Indra was freed here of the sin of killing a sage in deer form. From the Lord's navel a lotus stalk rises to Brahma on the wall.|The Lord reclining about 12 feet long;His feet, seen through a window on the north wall of the corridor;Brahma on the lotus stalk|Thirupulingudi, 3 km from Srivaikuntam (Budha).
83|D R|Indra, Vayu, Varuna, sage Suprabha, the Ashvini devas|Sage Suprabha, preparing a sacrifice, dug up a bright balance (tulai) and bow (vil), which turned into a couple freed from Kubera's curse. Two temples stand a hundred metres apart in the forest by the river: Devapiran standing, and Aravindalochana, the lotus-eyed, seated, who asked to receive the sage's lotuses daily. Nammazhwar sings as a mother whose daughter only looks towards this town.|Srinivasa (Devapiran) in the south temple;Aravindalochana seated in the north temple|Irattai Tirupati (Rahu and Ketu), on the north bank; remote and quiet, with short hours. Go before noon.
84|B R|Brihaspati, the brahmana Vedasara and his daughter Kamalavati|Kamalavati, daughter of Vedasara, would marry none but the Lord, and He took her to His chest. Later a demon carried off Vedasara's wife Kumudavalli; the Lord fought him and danced on his head: Maya-koothan, the wondrous dancer.|Srinivasa standing, with Kamalavati on His chest;The utsavar Mayakkoothan with Garuda beside Him|Perungulam, 10 km from Srivaikuntam (Sani).
85|D B|Kubera, Madhurakavi Azhwar|Kubera, cursed by Parvati, lost his nine treasures; they took refuge with the Lord here, who guards them lying on a grain measure, looking into His left palm as if to see where they are. Kubera recovered a part by worship. Madhurakavi Azhwar was born in this village.|Vaithamanidhi Perumal reclining with the measure as pillow;The shrine of Madhurakavi Azhwar;Kubera Theertham|Thirukkolur, 3 km from Azhwar Thirunagari (Sevvai, Mars).
86|D L|Brahma, Shiva (Ishana), Varuna, Sukra, Bhumi Devi|Bhumi Devi, doing penance on the river bank, found two fish-shaped earrings in the water and offered them to the Lord, who is Makara Nedun-kuzhai Kathan, "He of the long fish earrings". Varuna regained his weapon here, so prayers for rain are made. Garuda's shrine is set to one side: the Lord wished to watch the children playing and hear the Vedas chanted.|The Lord seated, facing east, with the earrings;Garuda placed off-centre;Sukra Pushkarini|Thenthirupperai, 5 km from Azhwar Thirunagari (Sukra, Venus).
89|L K|Sri Devi, Bhu Devi, Nila Devi, Sibi, Aniruddha and Usha|Sri Devi, to settle a dispute among the three consorts, did penance on this hill, and the Lord came and stayed (thangal) with Her. The wedding of Aniruddha, grandson of Krishna, with Usha is placed here. The rock-cut sanctums date from the Pandya period, and a Murugan temple shares the hill.|Nindra Narayana standing, with four consorts including Jambavati;Senkamala Thayar standing, unusual for a Thayar;The rock-cut caves|Thiruthangal, 3 km from Sivakasi. Combine with Srivilliputhur (88).
90|B K R|Periyazhwar, sage Bhrigu, King Vallabhadeva Pandya|In this city Periyazhwar proved before the Pandya king that Narayana is supreme; as he was taken in procession on an elephant the Lord appeared in the sky on Garuda, and the Azhwar, fearing the evil eye, sang Thiruppallandu. The temple, mentioned in Sangam poetry, has an eight-part vimanam whose shadow is said not to fall on the ground.|Koodal Azhagar seated on the ground floor, the standing Surya Narayana above, the reclining Lord at the top;The painted corridors;A shrine for the nine planets, rare in a Vishnu temple|In central Madurai, 1 km west of the Meenakshi temple.
92|D R|Brahma, Indra, sage Pulastya, the devas|At the churning of the ocean the devas appealed here, and the Lord took the form of Mohini to give them the nectar: Mohana-kshetram. He is Kalamegha, the rain cloud that gives without being asked, and Nammazhwar calls Him the companion who guides the soul on the road after death. The Sudarsana here, with sixteen arms and Narasimha on the reverse, is among the most revered.|Kalameghan standing;The Sudarsana and Yoga Narasimha shrine;The Lord reclining with only Sri and Bhu at His feet, in a side shrine|12 km north-east of Madurai near Othakadai. Pair with Azhagar Koil (91).
94|E R K|Sri Rama, Samudra-raja (the Ocean), sages Pullar and Kanva, King Dasaratha|Rama lay on a bed of darbha grass for three days asking the Ocean for a way to Lanka, and Vibhishana took refuge with Him on this shore. The older Lord here is Adi Jagannatha, whom Dasaratha worshipped for a child; couples install serpent stones under the tree and pray for children. Thirumangai Azhwar's twenty-one verses are in the voice of a girl pining by the sea.|Adi Jagannatha seated with Sri and Bhu;Darbha Sayana Rama reclining with sword, in a separate sanctum;Pattabhi Rama; the Sethu shore 4 km away|10 km from Ramanathapuram on the way to Rameswaram.
95|D R|Adisesha, Chandra, sage Satya, Garuda|A rock-cut cave of the 8th or 9th century in the side of a granite hill topped by a later fort. Two sanctums: Sathyamurthi standing, and beside it a reclining Lord about thirty feet long, cut from the living rock, larger than at Srirangam. Demons came to steal Bhumi Devi; Adisesha, not wishing to wake the Lord, spat venom to drive them off, and the flames are carved on the wall. A Shiva cave temple adjoins.|The great reclining Thirumeyyar with devas and sages carved around;Sathyamurthi standing, about seven feet;The Satya Pushkarini, octagonal|Thirumayam, 20 km south of Pudukkottai on the Karaikudi road. Pair with Thirukoshtiyur (93).
96|E D|Bharata, the devas, the sages|Ayodhya, first of the seven cities that grant liberation, where the Lord was born as Rama. The Azhwars sing the city, not a shrine: Kulasekhara as Dasaratha lamenting, Periyazhwar as one telling Sita the tokens of Rama. South Indian pilgrims have traditionally honoured the Ammaji Mandir, with Rama and Ranganatha worshipped in the Sri Vaishnava way, as the Divya Desam shrine.|The Ram Janmabhoomi temple;Ammaji Mandir near the Sarayu;Sarayu ghats, Kanak Bhavan and Hanuman Garhi|Ayodhya has its own airport and station. October to March is best; Rama Navami is very crowded.
97|R D|Indra, Sudharma, the sages headed by Saunaka, Suta, Vedavyasa|The sages asked Brahma for a place free of Kali to perform sacrifice; he released a wheel (nemi) and it came to rest in this forest. Here Suta spoke the Bhagavatam and the Mahabharata to the sages. Sri Vaishnavas hold that the Lord is present as the forest itself, so there is no single ancient image; shrines kept by southern mathas serve as the Divya Desam sannidhi.|Chakra Tirtha, the round tank where the wheel fell;Vyasa Gaddi and the seat of Suta;The southern-style Devaraja (Balaji) sannidhi|Neemsar, 90 km north-west of Lucknow. A day trip, or stay a night for the parikrama.
98|L|Parvati|The first place Thirumangai Azhwar sings in the Periya Thirumozhi, a land of lions, elephants and snow-fed streams where he urges the mind to go while the body can. Its site is debated: most pilgrims honour Joshimath, where Narasimha and Vasudeva are worshipped and Badrinath's worship is kept in winter; some place it at Nandaprayag or farther in the high Himalaya.|Narasimha temple, Joshimath, with the old Vasudeva temple beside it;The mulberry tree and cave of Adi Shankara|Joshimath, 45 km before Badrinath. Check road conditions; the town has had land subsidence since 2023.
99|E R|Sri Rama, Bharadvaja, Brahma|Where the Alaknanda and Bhagirathi join to become the Ganga. Rama is said to have done penance here after the war. The temple of Raghunathji, a tall standing image in stone, sits above the confluence. Periyazhwar's eleven verses praise the Ganga, purifying because it flows from the Lord's foot.|Raghunathji standing, about six feet, in a temple of Himalayan stone;The confluence ghat and the two rivers' different colours;The stone seat called Rama's throne|Devaprayag, 70 km from Rishikesh on the Badrinath road. A half-hour stop with steep steps.
100|R D|Nara and Narayana, Narada, Brahma, Uddhava|The Lord as Narayana taught the eight-syllable mantra here to Nara, being both teacher and student. The image of black salagrama stone, seated in padmasana, was recovered from the Narada Kund by Adi Shankara. Lakshmi sheltered Him from the snow as a badari tree. The priest, the Rawal, is by custom a Nambudiri from Kerala. Nityananda Prabhu came here on His pilgrimage.|Badri Narayana with Nara-Narayana, Kubera, Narada and Uddhava in the sanctum;Tapta Kund, the hot spring for bathing first;Brahma Kapal for ancestral rites; Mana village and Vyasa's cave 3 km on|Open roughly May to November; dates are announced each year. Altitude 3,100 m. Register for the Char Dham yatra and keep buffer days for weather.
101|D R|Brahma, Rudra, the river Gandaki|The Gandaki did penance to have the Lord born in her, and He stays in her bed as the salagrama stones found only here. The temple of Mukti Narayana, at about 3,700 m, is revered by Hindus and Buddhists alike. Behind it 108 spouts pour ice-cold water under which pilgrims run, and nearby a natural flame burns over water.|The gilded image of Mukti Narayana with Sri and Bhu;The 108 water spouts and two bathing kunds;Jwala Mai, the natural gas flame;Kagbeni on the Gandaki, for salagramas and rites|Fly Pokhara to Jomsom, then jeep. March to May and September to November. Indian citizens need identity papers and a local permit; go slowly for the altitude.
102|D E|Vasudeva and Devaki, Brahma, Indra|The city of Krishna's birth in Kamsa's prison. The Azhwars name Mathura together with Govardhana and Vrindavana: Andal begs to be taken "to Mathura, to the gate of Nandagopa, to the Yamuna bank, to Govardhana". No single old shrine survives; Sri Vaishnava pilgrims worship at the Janmasthan, Dvarakadhish and the Sri Rangji temple in Vrindavana, built in southern style in 1851.|Sri Krishna Janmasthan;Vishram Ghat on the Yamuna;Sri Rangji Mandir, Vrindavana, with Andal and Ranganatha;Govardhana hill|October to March. Gaudiya devotees will know the dhama far beyond this note.
103|B|Nanda and Yasoda, the gopas and gopis|Ayarpadi, the cowherd village across the Yamuna where Krishna was carried on the night of His birth. Periyazhwar's verses relive each stage of His infancy here, and Andal turns Srivilliputhur into this village. Pilgrims visit old Gokul and Mahavan; the image of Navamohana Krishna is honoured as the Divya Desam Lord.|Nanda Bhavan (Chaurasi Khamba), Mahavan;Brahmanda Ghat, where He showed the universe in His mouth;Raman Reti|15 km from Mathura. Combine with Mathura (102).
104|E B|Draupadi, Rukmini, the Pandavas, Sudama, Mirabai|Krishna as king, ruling from the city He built in the sea. The present temple, Jagat Mandir, rises five storeys on seventy-two pillars by the Gomati. Rukmini's temple stands apart outside the town, by Durvasa's curse. Many Sri Vaishnavas also count Bet Dwarka, and some name Dakor or Mul Dwarka; the Azhwars sing simply of "Dvarapati".|Dvarakadhish, four-armed, in black stone;Rukmini Devi temple, 2 km out;Gomati ghat and Bet Dwarka by the Sudarshan Setu bridge|October to March. Janmashtami is the great festival.
105|B D|Prahlada, Garuda, the Chenchu people|Garuda did penance to see the Narasimha form, and the Lord appeared in nine forms across these hills; from Garuda the hill is Garudadri. Here He burst from the pillar, the Ugra Stambha cliff, and here He wooed Chenchu Lakshmi of the forest people. Thirumangai Azhwar says only the gods can reach it. The first Jeeyar of the Ahobila Mutt was initiated here in 1398 by the Lord Himself, tradition says.|Lower Ahobilam: Prahlada Varada with Lakshmi;Upper Ahobilam, 8 km up: Ahobila (Ugra) Narasimha in a cave;The other seven: Jwala, Malola, Kroda, Karanja, Bhargava, Yogananda, Chatravata and Pavana, some by forest trek;Ugra Stambha, a hard climb|Near Allagadda, Nandyal district. Two days with a local guide; November to February. Jwala and Pavana need fitness or a jeep.
107|D R|Brahma, the devas, Markandeya|The Milk Ocean, where the Lord rests on Adisesha in yoga-nidra with Lakshmi at His feet, and where the devas come to ask Him to descend. It is the vyuha form, the source of the avataras. Not reached in this body; some temples, such as Prasanna Venkatesa at Thirupparkadal near Kaveripakkam, are visited in its memory.|In every temple with a reclining Lord, this is the form you are seeing|No journey needed: remember the Lord at the time of rest each night.
`;

/* v4 pasurams.
   VERSES2: Tamil text exactly as quoted in each temple's Tamil Wikipedia article (sandhi as given there);
   transliteration generated letter by letter in the app; English renderings are study drafts by Claude.
   SING: where the Azhwars sing each temple, from T. R. S. Iyengar's mangalasasanam table
   (trsiyengar.com) and the commentary tradition. Some single-verse references need checking. */
const VERSES2 = [
 {ns:[2,90], by:'Thirumangai Azhwar', ref:'Periya Thirumozhi 9.2.5',
  ta:'கோழியும் கூடலும் கோயில் கொண்ட\nகோவலரே ஒப்பர் குன்றமன்ன\nபாழியும் தோளும் ஓர் நான்குடையர்\nபண்டு இவர் தம்மையும் கண்டறியோம்\nவாழியரோ இவர் வண்ணமென்னில்\nமாகடல் போன்று உளர் கையில் வெய்ய\nஆழி ஒன்று ஏந்தி ஓர் சங்கு பற்றி\nஅச்சோ ஒருவர் அழகியவா.',
  en:'He has made Kozhi (Uraiyur) and Koodal (Madurai) His temples, and He looks like one of the cowherds. He has four shoulders, broad and strong as hills. We have never seen Him before. Long may He live! If you ask His colour, He is like the great ocean. In His hand He holds a fierce discus, and He carries a conch. Ah, how beautiful this One is!',
  note:'From the Thirunagai decad, sung as a girl struck by the Lord\'s beauty. The refrain "acho oruvar azhagiyavaa" closes every verse.'},
 {ns:[3,89], by:'Thirumangai Azhwar', ref:'Periya Thirumozhi 5.6.2',
  ta:'பேரானை குறுங்குடியெம்\nபெருமானை திருத்தண்கால்\nஊரானை கரம்பனூர் உத்தமனை முத்திலங்கு\nகாரார்திண் கடலேழு மலையேழிவ்வுலகேழுண்டும்\nஆராதென்றிருந்தானை கண்டது தென்னரங்கத்தே',
  en:'He of Per; our Lord of Kurungudi; He whose town is Thiruthangal; the Supreme One of Karambanur; He who swallowed the seven strong dark seas where pearls shine, the seven mountains and these seven worlds, and still sat as if not satisfied: Him I saw in southern Arangam.',
  note:'A single verse that names five Divya Desams and finds them all in Srirangam.'},
 {ns:[5,59], by:'Thirumazhisai Azhwar', ref:'Nanmugan Thiruvandadi 36',
  ta:'நாகத் தணைக்குடந்தை வெஃகா திருவெவ்வுள்,\nநாகத் தணையரங்கம் பேரன்பில், - நாகத்\nதணைப்பாற் கடல்கிடக்கு மாதி நெடுமால்,\nஅணைப்பார் கருத்தனா வான்',
  en:'The first and tall Lord, who lies on the serpent bed at Kudanthai, Vekka and Thiruvevvul, on the serpent bed at Arangam, Per and Anbil, and on the serpent bed in the Milk Ocean, becomes the very object of the minds of those who hold Him close.',
  note:'Eight reclining Lords in one verse. Anbil is named only here, which is why it is a Divya Desam.'},
 {ns:[7], by:'Thirumangai Azhwar', ref:'Thirukkurunthandakam 19',
  ta:'பிண்டியார் மண்டை ஏந்தி\nபிறர் மனை திரிதந்து உண்ணும்\nஉண்டியான் சாபம் தீர்த்த\nஒருவன் ஊர் உலகம் எட்டும்\nகண்டியூர் அரங்கம் மெய்யம்\nகச்சி பேர் மல்லை என்று\nமண்டினார் உய்யல் அல்லால்\nமற்றை யார்க்கு உய்யல் ஆமே.',
  en:'The towns of the One who ended the curse of him who wandered to others\' houses with a skull for a begging bowl, eating what he was given, are Kandiyur, praised by the whole world, Arangam, Meyyam, Kachi, Per and Mallai. Those who throng to them are saved. Can anyone else be saved?',
  note:'The skull is Brahma\'s, stuck to Shiva\'s hand; the Lord of Kandiyur released it.'},
 {ns:[9], by:'Thirumazhisai Azhwar', ref:'Nanmugan Thiruvandadi 50',
  ta:'கூற்றமும் சாரா கொடுவினையும் சாரா\nதீ மாற்றமும் சாரா வகை அறிந்தேன்\nஆற்றங்கரைக் கிடக்கும் கண்ணன் கடல் கிடக்கும்\nமாயன் உரைக் கிடக்கும் உள்ளத்து எனக்கு.',
  en:'Death will not come near, cruel karma will not come near, evil words will not come near: I have learned the way. For in my heart lies the word of Kannan, who lies on the river bank, the wondrous One who lies in the ocean.',
  note:'"The Kannan who lies on the river bank" is understood as the Lord of Kapisthalam on the Kaveri.'},
 {ns:[15], by:'Thirumangai Azhwar', ref:'Periya Thirumozhi 7.4 (Thirucherai decad)',
  ta:'பைவிரியும் வரியரவில் படுகடலுள் துயிலமர்ந்த பண்பா என்றும்\nமைவிரியும் மணிவரைபோல் மாயவனே என்றென்றும்\nவண்டார் நீலம் செய்விரியும் தண்சேறை யெம்பெருமான் திருவடியைச் சிந்தித்தேற்கு\nஎன் ஐயறிவும் கொண்டானுக் காளானார்க் காளாமென் அன்பு தானே.',
  en:'Ever saying "O gracious One, who rests on the striped serpent with spreading hoods in the deep sea", ever saying "O wondrous One, like a sapphire hill spreading darkness", I meditate on the feet of our Lord of cool Cherai, where blue lilies full of bees open in the fields. And so my love now serves those who serve Him who has taken all five of my senses.',
  note:'Love of God ripening into love for His servants: a theme dear to both Sri Vaishnavas and Gaudiyas.'},
 {ns:[20,63], by:'Thirumangai Azhwar', ref:'Periya Thirumozhi 2.5.3',
  ta:'உடம்பு உருவில் மூன்று ஒன்றாய், மூர்த்தி வேறு ஆய்\nஉலகு உய்ய நின்றானை; அன்று பேய்ச்சி\nவிடம் பருகு வித்தகனை; கன்று மேய்த்து\nவிளையாட வல்லானை; வரைமீ கானில்\nதடம் பருகு கரு முகிலைத் தஞ்சைக் கோயில்\nதவ நெறிக்கு ஓர் பெரு நெறியை; வையம் காக்கும்\nகடும் பரிமேல் கற்கியை நான் கண்டுகொண்டேன்\nகடி பொழில் சூழ் கடல்மல்லைத் தலசயனத்தே',
  en:'He who stood for the world\'s salvation, the three in one body and yet distinct in form; the clever One who long ago drank the poison of the demoness; He who loved to play herding calves; the dark cloud that drinks the pools in the forests on the hilltops; the great path for those who walk the way of penance at the Thanjai temple; Kalki on the fierce horse who will protect the earth: Him I have found at Thalasayanam in Kadalmallai, ringed by fragrant groves.',
  note:'The Lord of Thanjai Mamani Koil named within a hymn to Mamallapuram.'},
 {ns:[45,78], by:'Thirumangai Azhwar', ref:'Thirunedunthandakam 14',
  ta:'முளைக்கதிரைக் குறுங்குடியுள் முகிலை மூவா\nமூவுலகும் கடந்தப்பால் முதலாய் நின்ற\nஅளப்பரிய ஆரமுதை அரங்கம் மேய\nஅந்தணனை அந்தணர்தம் சிந்தையானை\nவிளக்கொளியை மரகதத்தைத் திருத்தண்காவில்\nவெஃகாவில் திருமாலைப் பாடக் கேட்டு\nவளர்த்தனால் பயன்பெற்றேன் வருக என்று\nமடக்கிளியைக் கைகூப்பி வணங்கினாளே!',
  en:'Her parrot sang of the rising sun, the rain cloud in Kurungudi, the measureless nectar who stands as the First beyond the three unageing worlds, the pure One who dwells in Arangam and lives in the minds of the pure, the Light and the Emerald at Thiruthanka, and Thirumal at Vekka. Hearing it she said, "I have had the reward for raising you. Come!" and bowed to the young parrot with folded hands.',
  note:'The mother describes her daughter (the Azhwar in a bride\'s mood). "Vilakkoli" names the Lord of Thiruthanka.'},
 {ns:[47,49,50,52,53,54,6], by:'Thirumangai Azhwar', ref:'Thirunedunthandakam 8',
  ta:'நீரகத்தாய் நெடுவரையினுச்சி மேலாய்\nநிலாத்திங்கள் துண்டத்தாய் நிறைந்த கச்சி\nஊரகத்தாய் ஒண்துரை நீர் வெஃகாவுள்ளாய்\nஉள்ளுவா ருள்ளத்தாய் உலகமேத்தும்\nகாரகத்தாய் கார்வானத்துள்ளாய் கள்வா\nகாமருபூங் காவிரியின் தென்பால் மன்னு\nபேரகத்தாய் பேராதென் நெஞ்சினுள்ளாய்\nபெருமானுன் திருவடியே பேணினேனே',
  en:'O You in Neeragam! O You on the summit of the tall hill! O You in Nilathingal Thundam! O You in Ooragam in crowded Kachi! O You in Vekka with its bright bathing ghats! O You in the hearts of those who think of You! O You in Karagam, praised by the world! O You in Karvanam! O Thief (of Kalvanur)! O You who dwell in Peragam on the south bank of the lovely flowering Kaveri! O You who never leave my heart! Lord, Your sacred feet alone have I cherished.',

function tamilTr(s){
  const V={'அ':'a','ஆ':'ā','இ':'i','ஈ':'ī','உ':'u','ஊ':'ū','எ':'e','ஏ':'ē','ஐ':'ai','ஒ':'o','ஓ':'ō','ஔ':'au'};
  const S={'ா':'ā','ி':'i','ீ':'ī','ு':'u','ூ':'ū','ெ':'e','ே':'ē','ை':'ai','ொ':'o','ோ':'ō','ௌ':'au'};
  const C={'க':'k','ங':'ṅ','ச':'c','ஞ':'ñ','ட':'ṭ','ண':'ṇ','த':'t','ந':'n','ப':'p','ம':'m','ய':'y','ர':'r','ல':'l','வ':'v','ழ':'ḻ','ள':'ḷ','ற':'ṟ','ன':'ṉ','ஜ':'j','ஷ':'ṣ','ஸ':'s','ஹ':'h','ஃ':'ḵ'};
  const toks=[]; const ch=[...s];
  for(let i=0;i<ch.length;i++){ const c=ch[i];
    if(V[c]) toks.push({t:'v',s:V[c]});
    else if(C[c]){ const nx=ch[i+1]; if(nx==='்'){ toks.push({t:'c',s:C[c],k:c}); i++; } else if(S[nx]){ toks.push({t:'c',s:C[c],k:c}); toks.push({t:'v',s:S[nx]}); i++; } else { toks.push({t:'c',s:C[c],k:c}); toks.push({t:'v',s:'a'}); } }
    else toks.push({t:'o',s:c}); }
  const voice={'k':'g','c':'s','ṭ':'ḍ','t':'d','p':'b'}, nasalVoice={'k':'g','c':'j','ṭ':'ḍ','t':'d','p':'b'};
  for(let i=0;i<toks.length;i++){ const x=toks[i]; if(x.t!=='c'||!voice[x.s]) continue;
    const p=toks[i-1], n=toks[i+1]; const dbl=(p&&p.t==='c'&&p.s===x.s)||(n&&n.t==='c'&&n.s===x.s);
    if(dbl) continue;
    if(p&&p.t==='c'&&['ṅ','ñ','ṇ','n','m','ṉ'].includes(p.s)) x.s=nasalVoice[x.s];
    else if(p&&p.t==='v'&&n&&n.t==='v') x.s=voice[x.s];
    else if((!p||p.t==='o')&&x.s==='c') x.s='s'; }
  return toks.map(x=>x.s).join('');
}

"tr": "perumbuRakkadalai adalERRinaip peNNai ANai eNNil munivarkkaruL\ntharum thavaththai muththin thiraL kOvaiyaip paththar Aviyai niththilaththoththinai\narumbinai alarai adiyEn manaththAsaiyai amudham podhi insuvaik\nkarumbinaik kaniyaich chenRu nAdik kaNNamangaiyuL kaNdu koNdEnE",
"en": "The great ocean, the mighty bull, female and male, the penance that gives grace to countless sages, a string of pearl clusters, the very life of His devotees, the like of pure pearls, the bud and the full flower, the longing of my heart, sugarcane full of sweet nectar, the ripe fruit: I went seeking Him and found Him at Kannamangai.",

"ta": "அன்னமும் கேழலும் மீனு மாய\nஆதியை நாகை யழகியாரை\nகன்னிநன் மாமதிள் மங்கை வேந்தன்\nகாமரு சீர்க்கலி கன்றி குன்றா\nஇன்னிசை யால்சொன்ன செஞ்சொல் மாலை\nஏழு மிரண்டுமொ ரொன்றும்வல்லார்,\nமன்னவ ராயுல காண்டு மீண்டும்\nவானவ ராய்மகிழ் வெய்துவரே.",
"tr": "annamum kEzhalum mInumAya Adhiyai nAgai azhagiyArai\nkanni nanmAmadhiL mangai vEndhan kAmarusIrk kalikanRi kunRA\ninnisaiyAl sonna senjol mAlai Ezhum iraNdum OronRum vallAr\nmannavarAy ulagANdu mINdum vAnavarAy magizhveydhuvarE",
"en": "Kalikanri, king of Mangai with its fine great walls, of lasting glory, sang these ten verses of good words in sweet music on the Primal One who became the swan, the boar and the fish, the Beautiful One of Nagai. Those who master them will rule the world as kings and then rejoice as gods.",
"note": "The closing verse (phala-sruti) of the Thirunagai decad, the only verse in it that names the temple. The decad opens with the verse shown on Uraiyur and Srirangam.",

"tr": "nummaith thozhudhOm nundham paNi seydhirukkum nummadiyOm\nimmaikku inbam peRROm endhAy! indhaLUrIrE!\nemmaik kadidhAk karumam aruLi AvA! enRirangi\nnammai orugAl kAtti nadandhAl nAngaL uyyOmE?",

"tr": "thirumadandhai maNmadandhai irupAlum thigazhath\nthIvinaigaL pOy agala adiyavargatku enRum\naruL nadandhu ivvEzhulagaththavar paNiya vAnOr\namarndhu Eththa irundha idam perum pugazh vEdhiyar vAzh\ntharum idangaL malargaL migu kaidhaigaL sengazhunIr\nthAmaraigaL thadangaL thoRum idangaL thoRum thigazha\naruvidangaL pozhil thazhuvi ezhil thigazhum nAngUr\narimEya viNNagaram vaNangu mada nenjE!",

"by": "Thirumangai Azhwar",
"ref": "Periya Thirumozhi 8.9.4",
"ndp": 1731,
"ta": "மிக்கானை மறையாய் விரிந்த விளக்கை என்னுள்\nபுக்கானைப் புகழ்சேர் பொலிகின்ற பொன்மலையை\nதக்கானைக் கடிகைத் தடங்குன்றின் மிசையிருந்த\nஅக்காரக் கனியை அடைந்துய்ந்து போனேனே.",
"tr": "mikkAnai maRaiyAy virindha viLakkai ennuL\npukkAnaip pugazh sEr poliginRa pon malaiyai\nthakkAnaik kadigaith thadangunRin misai irundha\nakkArakkaniyai adaindhu uyndhu pOnEnE",
"en": "I reached Him and was saved: the Exalted One, the lamp spread out as the Vedas, who entered within me, the glorious shining mountain of gold, the Worthy One, the Sugar-sweet Fruit seated on the great hill of Kadigai.",
"note": "'Akkarakkani', the sugar-sweet fruit, is the name of the Lord at Sholinghur.",
"v": "Project Madurai, cross-checked with koyil.org (match)",
"kl": "https://divyaprabandham.koyil.org/index.php/2026/07/periya-thirumozhi-8-9-4/",
"sl": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0006_02.html",
"src": ""
},
{
"ns": [
65
],
"by": "Nammazhwar",
"ref": "Thiruvaimozhi 9.8.1",
"ndp": 3750,
"ta": "அறுக்கும் வினையா யின ஆகத்தவனை,\nநிறுத்தம் மனத்தொன் றியசிந் தையினார்க்கு,\nவெறித்தண் மலர்சோ லைகள்சுழ் திருநாவாய்,\nகுறுக்கும் வகையுண்டு கொலொகொடி யேற்கே?",
"tr": "aRukkum vinaiyAyina Agaththu avanai\nniRuththum manaththonRiya sindhaiyinArkku\nveRith thaN malarch chOlaigaL sUzh thirunAvAy\nkuRukkum vagai uNdukolO? kodiyERkE",
"en": "Is there any way for me, wretched as I am, to reach Thirunavay, ringed by cool groves of fragrant flowers, the place of the Lord whom those of single mind hold firm within, and who cuts away their deeds?",
"note": "",
"v": "Project Madurai, cross-checked with koyil.org (minor differences)",
"kl": "https://divyaprabandham.koyil.org/index.php/2019/08/thiruvaimozhi-9-8-1-arukkum-vinai/",
"sl": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0008_02.html",

},
{
"ns": [
66
],
"by": "Kulasekara Azhwar",
"ref": "Perumal Thirumozhi 5.1",
"ndp": 688,
"ta": "தருதுயரம் தடாயேலுன் சரணல்லால் சரணில்லை\nவிரைகுழுவு மலர்ப்பொழில்சூழ் விற்றுவக்கோட் டம்மானே\nஅரிசினத்தா லீன்றதாய் அகற்றிடினும் மற்றவள்தன்\nஅருள்நினைந்தே யழும்குழவி அதுவேபோன் றிருந்தேனே",
"tr": "tharu thuyaram thadAyEl un charaNallAl SaraN illai\nvirai kuzhuvum malarppozhil sUzh viththuvakkOttammAnE\narisinaththAl InRa thAy agaRRidinum maRRu avaLthan\naruL ninaindhE azhum kuzhavi adhu pOnRu irundhEnE",
"en": "Even if You do not stop the sorrow You give me, I have no refuge but Your feet, O Lord of Vithuvakkodu, ringed by groves of fragrant flowers. Like a baby who, even when its own mother pushes it away in anger, cries thinking only of her love, so I have stayed.",
"note": "One of the best-loved verses on total dependence (saranagati).",
"v": "Project Madurai, cross-checked with koyil.org (minor differences)",
"kl": "https://divyaprabandham.koyil.org/index.php/2023/07/perumal-thirumozhi-5-1/",
"sl": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0005_02.html",
"src": "Differences from koyil.org beyond plain word joining: PM விற்றுவக்கோட் டம்மானே / koyil viththuvakkOttammAnE (known variant spelling of the temple name); PM அதுவேபோன்று / koyil adhu pOnRu."
},
{
"ns": [
67
],
"by": "Nammazhwar",
"ref": "Thiruvaimozhi 9.6.1",
"ndp": 3728,
"ta": "உருகுமால் செஞ்சம் உயிரின் பரமன்றி,\nபெருகுமால் வேட்கையும் எஞ்செய்கேன் தொண்டனேன்,\nதெருவெல்லாம் காவி கமழ்திருக் காட்கரை,\nமருவிய மாயன்தன் மாயம் நினைதொறே.",
"tr": "",
"en": "My heart melts beyond what my life can bear, and my longing swells. What shall I do, I, Your servant, whenever I think of the wonders of the Wondrous One who dwells at Thirukkatkarai, where every street is fragrant with blue lilies?",
"note": "",
"v": "Project Madurai, cross-checked with koyil.org (minor differences)",
"kl": "https://divyaprabandham.koyil.org/index.php/2019/08/thiruvaimozhi-9-6-1-urugumal-nenjam/",
"sl": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0008_02.html",

},
{
"ns": [
68
],
"by": "Nammazhwar",
"ref": "Thiruvaimozhi 9.7.1",
"ndp": 3739,
"ta": "எங்கானல் அகங்கழிவாய்\nஇரைத்தேர்ந்திங் கினிதமரும்,\nசெங்கால மடநாராய்.\nதிருமூழிக் களத்துறையும்,\nகொங்கார்பூந் துழாய்முடியெங்\nகுடக்கூத்தர்க் கென்தூதாய்,\nநுங்கால்க ளென் தலைமேல்\nகெழுமீரோ நுமரோடே.",
"tr": "engAnal agangazhivAy irai thErndhinginidhamarum\nsengAla mada nArAy! thirumUzhikkaLaththuraiyum\nkongAr pUndhuzhAy mudi engudakkUththarkken thUdhAy\nnungAlgaL en thalai mEl kezhumIrO numarOdE",
"en": "O young crane with red legs, who seeks food in the lovely wide backwaters and rests sweetly here! Be my messenger, with your companions, to my pot-dancer with the honey-rich tulasi crown, who dwells at Thirumoozhikkalam; then your feet will be on my head.",
"note": "A messenger verse: the Azhwar, as a girl in love, sends a crane to the Lord.",
"v": "Project Madurai, cross-checked with koyil.org (minor differences)",
"kl": "https://divyaprabandham.koyil.org/index.php/2019/08/thiruvaimozhi-9-7-1-enganal-agangazhivay/",
"sl": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0008_02.html",
"src": "A stray Latin letter in the Project Madurai text (கென்fதூதாய்) was removed by hand; otherwise as published. Differences from koyil.org beyond plain word joining: NEEDS A HAND FIX BEFORE DISPLAY: PM has a stray Latin 'f' inside the verse ('குடக்கூத்தர்க் கென்fதூதாய்'; koyil reads engudakkUththarkken thUdhAy). It is left exactly as published because the second source (dravidaveda.org/3847) has several worse slips in this verse. Also PM இரைத்தேர்ந்து / koyil irai thErndhu; koyil 'thuraiyum' for துறையும் is a romanisation slip on the koyil page."
},
{
"ns": [
69
],
"by": "Nammazhwar",
"ref": "Thiruvaimozhi 5.9.1",
"ndp": 3321,
"ta": "மானேய் நோக்குநல்லீர். வைகலும்வினை யேன்மெலிய,\nவானார் வண்கமுகும் மதுமல்லிகை யுங்கமழும்,\nதேனார் சோலைகள்சூழ் திருவல்ல வாழுறையும்\nகோனா ரை,அடியேண் அடிகூடுவ தென்றுகொலோ?",
"tr": "mAnEy nOkku nalleer! vaigalum vinaiyEn meliya\nvAnAr vaN kamugum madhu malligai kamazhum\nthEnAr sOlaigaL sUzh thiruvallavAzh uRaiyum\nkOnArai adiyEn adi kUduvadhu enRu kolO?",
"en": "You women with eyes like a deer's! As I, a sinner, waste away day after day: when will I, His servant, reach the feet of the King who dwells at Thiruvallavazh, ringed by honey-rich groves where sky-high areca and honeyed jasmine are fragrant?",
"note": "",
"v": "Project Madurai, cross-checked with koyil.org (minor differences)",
"kl": "https://divyaprabandham.koyil.org/index.php/2017/09/thiruvaimozhi-5-9-1-maney-nokku/",
"sl": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0008_01.html",
"src": "Differences from koyil.org beyond plain word joining: PM மதுமல்லிகை யுங்கமழும் / koyil madhu malligai kamazhum; PM அடியேண் / koyil adiyEn (PM looks like a typing slip for அடியேன்)."
},
{
"ns": [
70
],
"by": "Nammazhwar",
"ref": "Thiruvaimozhi 8.6.1",
"ndp": 3618,
"ta": "எல்லியும் காலையும் தன்னை நினைந்தெழ,\nநல்ல அருள்கள் நமக்கேதந் தருள்செய்வான்,\nஅல்லியந் தண்ணந் துழாய்முடி யப்பனூர்,\nசெல்வர்கள் வாழும் திருக்கடித் தானமே.",
"tr": "elliyum kAlaiyum thannai ninaindhezha\nnalla aruLgaL namakkE thandharuL seyvAn\nalliy andhaNNandhuzhAy mudi appan Ur\nselvargaL vAzhum thirukkadiththAnamE",
"en": "So that we rise thinking of Him night and morning, He gives His good graces to us: the town of the Father who wears a crown of fresh cool tulasi is Thirukkadithanam, where prosperous people live.",
"note": "",
"v": "Project Madurai, cross-checked with koyil.org (minor differences)",

"sl": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0008_02.html",

},
{
"ns": [
71
],
"by": "Nammazhwar",
"ref": "Thiruvaimozhi 8.4.1",
"ndp": 3596,
"ta": "வார்கடா அருவி யானைமா மலையின்\nமருப்பிணைக் குவடிறுத் துருட்டி,\nஊர்கொள்திண் பாகன் உயிர்செகுத் தரங்கின்\nமல்லரைக் கொன்றுசூழ் பரண்மேல்,\nபோர்கடா வரசர் புறக்கிட மாட\nமீமசைக் கஞ்சனைத் தகர்த்த,\nசீர்கொள்சிற் றாயன் திருச்செங்குன் றூரில்\nதிருச்சிற்றா றெங்கள்செல் சார்வே.",
"tr": "",
"en": "He broke off the twin tusks of the elephant, a great mountain flowing with must, and rolled it over; He took the life of its strong mahout who came to seize the town; He killed the wrestlers in the arena and smashed Kamsa on his high platform as the kings who came to fight turned and fled. The glorious little cowherd, at Thiruchitraru in Thiruchenkundrur, is our refuge.",
"note": "",
"v": "Project Madurai, cross-checked with koyil.org (minor differences)",

"src": "The koyil.org page prints this verse in Tamil script only (no transliteration), so koyil_translit is empty; the check compared koyil.org's Tamil with the Tamil text here. Differences from koyil.org beyond plain word joining: PM மீமசை / koyil மீ மிசை (PM looks like a typing slip)."
},
{
"ns": [
72
],
"by": "Nammazhwar",
"ref": "Thiruvaimozhi 8.9.1",
"ndp": 3651,
"ta": "கருமா ணிக்க மலைமேல்மணித்\nதடந்தாமரைக் காடுகள்போல்,\nதிருமார்வு வாய்கண்கை யுந்திகாலுடை\nயாடைகள் செய்யபிரான்\nதிருமா லெம்மான் செழுநீர்வயல்\nகுட்டநாட்டுத் திருப்புலியூர்,\nஅருமாயன் பேரன்றிப் பேச்சிலள்\nஅன்னைமீரிதற் கென்செய்கேனா.",
"tr": "karu mANikka malai mEl maNiththadandhAmaraik kAdugaL pOl\nthirumArvu vay kaN kai undhi kAl udai AdaigaL seyya pirAn\nthirumAl emmAn sezhu nIr vayal kutta nAttuth thiruppuliyUr\naru mAyan pEr anRip pEchchilaL annaimIr! idhaRken seygEnO?",
"en": "The red-hued Lord whose sacred chest, mouth, eyes, hands, navel, feet and garments are like forests of bright lotuses on a dark gem mountain; Thirumal, our Master, the rare Wondrous One of Thiruppuliyur in Kuttanad with its rich watery fields: she speaks of nothing but His names. O mothers, what can I do about this?",
"note": "A mother speaks of her daughter's love for the Lord.",
"v": "Project Madurai, cross-checked with koyil.org (minor differences)",
"kl": "https://divyaprabandham.koyil.org/index.php/2019/05/thiruvaimozhi-8-9-1-karu-manikka-malai/",
"sl": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0008_02.html",
"src": "Differences from koyil.org beyond plain word joining: PM என்செய்கேனா / koyil en seygEnO (PM looks like a typing slip for கேனோ); koyil 'vay' for வாய் is a slip on the koyil page."
},
{
"ns": [
73
],
"by": "Nammazhwar",
"ref": "Thiruvaimozhi 7.10.1",
"ndp": 3552,
"ta": "இன்பம் பயக்க எழில்மலர்\nமாதரும் தானுமிவ் வேழுலகை,\nஇன்பம் பயக்க இனிதுடன்\nவீற்றிருந் தாள்கின்ற எங்கள்பிரான்,\nஅன்புற் றமர்ந்துறை கின்றா\nணிபொழில் சூழ்திரு வாறன்விளை,\nஅன்புற் றமர்ந்து வலம்செய்து\nகைதொழும் நாள்களும் ஆகுங்கொலோ.",
"tr": "inbam payakka ezhil malar mAdharum thAnum ivvEzhulagai\ninbam payakka inidhudan vIRRirundhu ALginRa engaL pirAn\nanbuRRamarndhuRaiginRa aNi pozhil thiruvARanviLai\nanbuRRamarndhu valanjeydhu kai thozhu nALgaLum AgungolO?",
"en": "Our Lord sits in splendour with the beautiful Lady of the flower and rules these seven worlds so that joy arises in them. When will the days come when I, with love, go round Thiruvaranvilai of lovely groves, where He dwells with love, and worship with joined hands?",
"note": "",
"v": "Project Madurai, cross-checked with koyil.org (minor differences)",
"kl": "https://divyaprabandham.koyil.org/index.php/2018/11/thiruvaimozhi-7-10-1-inbam-payakka/",
"sl": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0008_02.html",
"src": "Differences from koyil.org beyond plain word joining: PM பொழில் சூழ்திரு வாறன்விளை / koyil aNi pozhil thiruvARanviLai (koyil has no சூழ்); PM உறைகின்றாணி / koyil uRaiginRa aNi."
},
{
"ns": [
74
],
"by": "Nammazhwar",
"ref": "Thiruvaimozhi 6.1.1",
"ndp": 3343,
"ta": "வைகல்பூங் கழிவாய் வந்து மேயும் குருகினங்காள்,\nசெய்கொள் செந்நெ லுயர்திருவண்வண் டூருறையும்,\nகைகொள் சக்கரத் தென்கனி வாய்பெரு மானைக்கண்டு,\nகைகள் கூப்பிச் சொல்லீர் வினையாட்டியேன் காதன்மையே.",
"tr": "vaigal pUngazhivAy vandhu mEyum kurginangAL!\nsey koL sennel uyar thiruvaNvaNdUr uRaiyum\nkai koL chakkaraththu en kani vAyp perumAnaik kaNdu\nkaigaL kUppich cholleer vinaiyAttiyEn kAdhanmaiyE",
"en": "O flock of cranes that come every day to feed in the flowering backwaters! When you see my Lord with fruit-red lips, who holds the discus in His hand and dwells at Thiruvanvandoor, where red paddy grows tall in the fields, join your hands and tell Him of the love of this sinner.",
"note": "A messenger verse sent through the cranes.",
"v": "Project Madurai, cross-checked with koyil.org (minor differences)",
"kl": "https://divyaprabandham.koyil.org/index.php/2017/10/thiruvaimozhi-6-1-1-vaigal-pungazhivay/",
"sl": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0008_02.html",
"src": "Differs from koyil.org only in how words are joined or split (sandhi)."
},
{
"ns": [
76
],
"by": "Nammazhwar",
"ref": "Thiruvaimozhi 10.6.1",
"ndp": 3838,
"ta": "அருள்பெறுவார் அடியார்தம் அடியனேற்கு ஆழியான்\nஅருள்தருவான் அமைகின்றான் அதுநமது விதிவகையே\nஇருள்தருமா ஞாலத்துள் இனிப்பிறவி யான்வேண்டேன்\nமருளொழிநீ மடநெஞ்சே. வாட்டாற்றான் அடிவணங்கே.",
"tr": "",
"en": "His devotees are the ones who receive grace; and to me, servant of His devotees' servants, the Lord of the discus has resolved to give His grace. That is our good fortune. In this great world that brings darkness I want no more births. Leave your confusion, simple heart, and bow to the feet of the Lord of Vattaru.",
"note": "",

function save(){

    const id = await user.id(); if(!id) return;
    const doc = db.collection('data/users/'+id).doc('yatra');

    if(d && d.json){
      const r = JSON.parse(d.json);
      if((r.ts||0) > (S.ts||0)){ S.profile = Object.assign(S.profile, r.profile||{}); S.diary = r.diary||{}; S.ts = r.ts; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} render(); }

      cloudState = 'Saved to your Claude account';
    } else if(S.ts) pushCloud(); else cloudState = 'Saved to your Claude account';
    if(route().v==='me') render();
  }catch(e){}
}

/* ---------- render and events ---------- */
function render(){
  if(LMAP){ try{LMAP.remove();}catch(e){} LMAP=null; }
  const r = route();
  document.body.classList.toggle('big', !!S.profile.big);
  let html, title = TITLES[r.v], tab = r.v;
  if(r.v==='temple'){ html = vTemple(r.n); title = 'Divya Desam '+r.n; tab='temples'; }
  else if(r.v==='azhwar'){ html = vAzhwar(r.k); title = 'Azhwar'; tab='azhwars'; }
  else if(r.v==='group'){ html = vGroup(r.k); title = 'Sacred group'; tab='journeys'; }
  else if(r.v==='temples') html = vTemples();
  else if(r.v==='azhwars') html = vAzhwars();
  else if(r.v==='journeys') html = vJourneys();
  else if(r.v==='learn') html = vLearn();
  else if(r.v==='map'){ html = vMap(); tab='journeys'; }
  else if(r.v==='checklist'){ html = vChecklist(); tab='home'; }
  else if(r.v==='quiz'){ html = vQuiz(); tab='learn'; }
  else if(r.v==='nearby'){ html = vNearby(); tab='journeys'; }
  else if(r.v==='me') html = vMe();
  else if(r.v==='about'){ html = vAbout(); tab='learn'; }
  else { html = vHome(); title = TITLES.home; tab='home'; }
  $('#title').textContent = title;
  $('#back').hidden = !(['temple','azhwar','group','me','about','map','checklist','quiz','nearby'].includes(r.v));
  $('main').innerHTML = html; $('main').scrollTop = 0;
  $('nav').innerHTML = TABS.map(([k,l,p])=>`<a href="#${k}" class="${k===tab?'on':''}"><svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>${l}</a>`).join('');
  bind(r);
}
function bind(r){
  if(r.v==='temples'){
    drawList();
    $('#fq').addEventListener('input', e=>{F.q=e.target.value; drawList();});
    ['reg','st','pos','form','az','grp','mine','bl','face'].forEach(k=>$('#f-'+k).addEventListener('change', e=>{F[k]=e.target.value; drawList();}));
    $('#fclear').addEventListener('click', ()=>{F={q:'',reg:'',st:'',pos:'',form:'',az:'',grp:'',mine:'',bl:'',face:''}; render();});
  }
  if(r.v==='home'||!TITLES[r.v]&&!['temple','azhwar','group'].includes(r.v)){
    document.querySelectorAll('.tiles a[data-f]').forEach(a=>a.addEventListener('click', ()=>{ setTimeout(()=>{const el=$('#f-'+a.dataset.f); if(el) el.focus();},60); }));
    const dp = document.querySelector('.tiles a[data-deep]'); if(dp) dp.addEventListener('click', e=>{ e.preventDefault(); location.hash='#g-DEEP'; });
  }
  if(r.v==='checklist') bindChecklist();
  if(r.v==='quiz') bindQuiz();
  if(r.v==='map' && window.L){ mapInit(); }
  else if(r.v==='map'){
    document.querySelectorAll('[data-z]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();MZ=a.dataset.z;render();}));
    document.querySelectorAll('.dot').forEach(g=>{const go=()=>{MSEL=+g.dataset.n;document.querySelectorAll('.dot.sel').forEach(x=>x.classList.remove('sel'));g.classList.add('sel');$('#mapsel').innerHTML=tRow(byN(MSEL));};g.addEventListener('click',go);g.addEventListener('keydown',e=>{if(e.key==='Enter')go();});});
  }
  if(r.v==='temple'){
    const n=r.n, b=(id,fn)=>{const el=$(id); if(el) el.addEventListener('click',fn);};
    b('#bv',()=>{ const on=D(n).s==='v'; setD(n,{s:on?'':'v', d:D(n).d||''}); render(); toast(on?'Removed from visited':'Marked visited'); });
    b('#bw',()=>{ const on=D(n).s==='w'; setD(n,{s:on?'':'w'}); render(); });
    const dd=$('#dd'), dn=$('#dn');
    if(dd) dd.addEventListener('change',()=>{ setD(n,{d:dd.value}); $('#dsaved').textContent='Saved.'; });
    if(dn) dn.addEventListener('input',()=>{ setD(n,{note:dn.value}); $('#dsaved').textContent='Saved.'; });
    b('#fbs',async()=>{ const v=$('#fbx').value.trim(); if(!v){toast('Write the correction first');return;} S.fb.push({n,text:v,t:Date.now()}); save(); $('#fbx').value=''; const ok=await pushFeedback(); toast(ok?'Saved and shared with the app owner':'Saved under My Yatra'); });
  }
  if(r.v==='me'){
    $('#pn').addEventListener('input',e=>{S.profile.name=e.target.value; save();});
    $('#pw').addEventListener('input',e=>{S.profile.withWhom=e.target.value; save();});
    $('#tg').addEventListener('click',()=>{S.profile.gaudiya=!S.profile.gaudiya; save(); render();});
    $('#tb').addEventListener('click',()=>{S.profile.big=!S.profile.big; save(); render();});
    $('#bk').addEventListener('click',()=>copy(JSON.stringify({app:'divyadesam-yatra',profile:S.profile,diary:S.diary,fb:S.fb}),'Backup copied'));
    $('#rs').addEventListener('click',()=>{ try{ const o=JSON.parse($('#copybox').value); if(o.app!=='divyadesam-yatra') throw 0; S.profile=Object.assign(S.profile,o.profile||{}); S.diary=o.diary||{}; S.fb=o.fb||S.fb; save(); render(); toast('Diary restored'); }catch(e){ toast('That text is not a backup from this app'); } });
    const fc=$('#fbc'); if(fc) fc.addEventListener('click',()=>copy('Divya Desam Yatra app – corrections from '+(S.profile.name||'a devotee')+'\n\n'+S.fb.map(f=>(f.n?f.n+'. '+byN(f.n).name:'General')+': '+f.text).join('\n\n'),'Corrections copied'));
    document.querySelectorAll('[data-del]').forEach(x=>x.addEventListener('click',()=>{S.fb.splice(+x.dataset.del,1); save(); pushFeedback(); render();}));
    $('#fbgs').addEventListener('click',async()=>{ const v=$('#fbg').value.trim(); if(!v) return; S.fb.push({n:0,text:v,t:Date.now()}); save(); await pushFeedback(); render(); toast('Feedback saved'); });
  }
}

function viewBounds(k){ const ns=MAP_SETS[k][1]().filter(n=>W(n).la); const la=ns.map(n=>W(n).la), lo=ns.map(n=>W(n).lo); const p=Math.max(0.02,(Math.max(...la)-Math.min(...la))*0.08); return [[Math.min(...la)-p,Math.min(...lo)-p],[Math.max(...la)+p,Math.max(...lo)+p]]; }

function pinLatLng(){ // spread temples that share coordinates (e.g. four shrines in one Kanchi compound)
  const groups={}, out={};
  T.forEach(t=>{const w=W(t.n); if(!w.la) return; const k=w.la.toFixed(3)+','+w.lo.toFixed(3); (groups[k]=groups[k]||[]).push(t.n);});
  Object.values(groups).forEach(ns=>ns.forEach((n,i)=>{const w=W(n); if(ns.length===1){out[n]=[w.la,w.lo];return;} const a=2*Math.PI*i/ns.length; out[n]=[w.la+0.0007*Math.sin(a), w.lo+0.0007*Math.cos(a)];}));
  return out;
}
const gmapsAt = n => { const w=W(n); return w.la?`https://www.google.com/maps/search/?api=1&query=${w.la}%2C${w.lo}`:`https://www.google.com/maps/search/?api=1&query=${q(byN(n).name+' '+byN(n).aka)}`; };
const gmapsDir = n => { const w=W(n); return `https://www.google.com/maps/dir/?api=1&destination=${w.la}%2C${w.lo}`; };
function routeLinks(ns){ // Google Maps allows a destination plus up to 9 waypoints; start is the phone's location
  const pts=ns.filter(n=>W(n).la); if(!pts.length) return [];
  const left=[...pts], order=[left.shift()];
  while(left.length){ const a=W(order[order.length-1]); let bi=0,bd=1e9; left.forEach((n,i)=>{const b=W(n); const d=(a.la-b.la)**2+(a.lo-b.lo)**2; if(d<bd){bd=d;bi=i;}}); order.push(left.splice(bi,1)[0]); }
  const legs=[]; for(let i=0;i<order.length;i+=10) legs.push(order.slice(i,i+10));
  return legs.map(leg=>{ const dest=leg[leg.length-1], wps=leg.slice(0,-1).map(n=>W(n).la+','+W(n).lo).join('|');
    return {ns:leg, url:`https://www.google.com/maps/dir/?api=1&destination=${W(dest).la}%2C${W(dest).lo}${wps?'&waypoints='+encodeURIComponent(wps):''}&travelmode=driving`}; });
}
function routeHtml(ns){ return routeLinks(ns).map((r,i,a)=>`<a href="${r.url}" target="_blank" rel="noopener">Route in Google Maps${a.length>1?' '+(i+1)+' of '+a.length:''}: ${r.ns.length} stop${r.ns.length>1?'s':''}</a>`).join(''); }
