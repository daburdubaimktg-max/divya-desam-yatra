wiki/File:Muktinath_Temple_view.JPG"},"102":{"t":"Kesava_Deo_Temple","d":"Believed to be the site where Krishna was born. One of the most famous Vaishnavite pilgrimage sites in India.","x":"Krishna Janmasthan Temple is a Hindu temple situated in Mathura, Uttar Pradesh, India. There are three main temples inside the premises -- Keshavdev temple which is dedicated to Krishna, Garbh Griha where Krishna is believed to be born in Dvapar Yuga and Bhagvata Bhavan where presiding deities are Radha Krishna. The place has held religious significance since at least the 6th century BCE with findings of religious artifacts in excavations. The temples were destroyed multiple times throughout history, most recently by the Mughal emperor Aurangzeb in 1670. He built the Shahi Eidgah mosque there, which still stands. In the 20th century, the new temple complex adjacent to mosque was built with the financial help from industrialists.","la":27.5048,"lo":77.6696,"fs":"Krishna Janmashtami","ia":"Diego Delso","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Mathura_Temple-Mathura-India0002.JPG"},"103":{"t":"Tiruvaaippadi","d":"Regarded to be the site Krishna spent his childhood with his brother Balarama and Radha, Krishna's lover","x":"The Navamohana Krishna Temple, also referred to in Sri Vaishnava tradition as Tiruvaipadi, is one of the Divya Desams, the 108 temples of Vishnu revered by the 12 poet-saints called the Alvars. It is located in modern day Gokul, in the Mathura district of the Indian state of Uttar Pradesh. It is located 15 km south-east of Mathura. It is regarded to be the site of Krishna's childhood past-times. The place is revered by Andal, the only female Alvar. It is also closely associated with the ancient Nappinai cult of Tamil Nadu.","la":26.9501,"lo":80.4387,"ia":"Hidden_macy (talk) (Uploads)","il":"CC BY 3.0","ip":"https://commons.wikimedia.org/wiki/File:Gokul_temple.JPG"},"104":{"t":"Dwarkadheesh_temple,_Gujrat","d":"Regarded to be the site Krishna's chief wife, Rukmini, was cursed by the sage Durvasa, and was liberated by her husband. Also located near the site of Dwaraka, the ancient floating island kingdom of Lord Krishna.","x":"The Dwarkadhish temple, also known as the Jagat Mandir and occasionally spelled Dwarakadheesh, is a Hindu temple dedicated to Krishna, who is worshiped in the temple by the name Dwarkadhish (Sanskrit: द्वारकाधीश, IAST: Dvārakādhīśa, meaning: 'Lord of Dvārakā'). The temple is located in Dwarka city of Gujarat, India, which is one of the destinations of Char Dham, a Hindu pilgrimage circuit. The main shrine of the five-storied building, supported by 72 pillars, is known as Jagat Mandir or Nija Mandir. Archaeological findings suggest the original temple was built in 200 BCE at the earliest. The temple was rebuilt and enlarged in the 15th–16th century. The temple became part of the Char Dham pilgrimage considered sacred by Hindus in India. Adi Shankara, the 8th century Hindu theologian and philosopher, visited the shrine. The other three being comprising Rameswaram, Badrinath and Puri. Even today a memorial within the temple is dedicated to his visit. Dwarakadheesh is the 98th Divya Desam of Vishnu on the subcontinent, glorified in the Divya Prabandha sacred texts.","la":24.0099,"lo":73.3305,"fs":"Krishna Janmashtami","ws":"https://www.dwarkadhish.org/","ia":"Scalebelow","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Dwarkadheesh_temple.jpg"},"105":{"t":"Ahobilam","d":"This is believed to be the site where Narasimha appeared to protect his devotee Prahlada and slay the demon Hiranyakashipu. The giant massive pillar from which he appeared is called Ugra Stambha, and one can still see it. Here, Narasimha appears in nine different forms; these re collectively called Nava Narasimha. There is a pond filled with red water called Rakta Kundam, where it is believed Narasimha washed his bloodied hands.","x":"Ahobilam is a town and holy site in the Allagadda mandal of Nandyal district in the Indian state of Andhra Pradesh. It is surrounded by the Eastern Ghats with several mountain hills and gorges. It is the centre of worship of Narasimha, the lion-headed avatar of Vishnu, along with his consort Pratyangira, an avatar of Lakshmi. It is one of the nine Hindu temples and shrines dedicated to this deity. The main village and a temple complex are at Lower Ahobilam. Upper Ahobilam, about 8 kilometres to the east, has more temples in a steep gorge. The site has evidence of historical patronage from a number of regional dynasties, with the most significant being that of the Vijayanagara Kingdom.","la":15.341,"lo":79.1533,"ws":"http://ahobilamtemple.com","ia":"Sai Sreekanth","il":"CC BY-SA 2.0","ip":"https://commons.wikimedia.org/wiki/File:Upper_Ahobilam_temple_Gopuram.jpg"},"106":{"t":"Tirumala_Venkateswara_Temple","d":"Vishnu, in his form as Venkateswara or Srinivasa, married Padmavati, the mortal princess avatar of Lakshmi, at this temple. One of the most famous Vaishnavite pilgrimage sites in India, this temple draws about 100,000 visitors everyday and is also one of the richest temples in India in terms of wealth. The idol here is also called Kaliyuga Pratyakshadeva (The one who relieves devotees of troubles in the Kali Yuga). A pilgrimage to Tirupati is not complete without a visit to the Padmavati Temple in Tiruchanur. Venkateswara is also called Govinda, Srinivasa or Balaji.","x":"The Venkateswara Swami Temple—also known as Tirumala Temple, Tirupati Temple and Tirupati Balaji Temple—is a Hindu temple located in the hills of Tirumala, within Tirupati Urban Mandal, Tirupati district, Andhra Pradesh, India. The temple is dedicated to Venkateswara, a form of Vishnu, who is believed to have appeared on earth to save mankind from trials and troubles of Kali Yuga. Hence the site is also called Kaliyuga Vaikuntha and the deity is known as Kaliyuga Prathyaksha Daivam. Venkateswara is additionally known as Balaji, Govinda, and Srinivasa. The temple is administered by the Tirumala Tirupati Devasthanams (TTD), an autonomous body under the control of the Government of Andhra Pradesh. The head of TTD is appointed by Andhra Pradesh Government. Tirumala Hills, which are part of Seshachalam Hills range, rise to approximately 980 metres (3,220 ft) above sea level and comprise seven peaks. Per local tradition, the seven peaks represent the seven heads of Adisesha. The temple lies on the seventh peak—Venkatadri, on the southern banks of Sri Swami Pushkarini, a holy water tank.","la":13.8339,"lo":79.4087,"fs":"Srivari Brahmotsavam, Vaikunta Ekadashi, Ratha Saptami","cr":"Tondaiman Ilandiraiyan , Veera Narasingadeva Krishnadevaraya , Veera Rakshasa Krishnadevaraya , Ranganatharaya","ins":"Tamil, Telugu, Kannada, Sanskrit","ia":"Nikhilb239","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Tirumala_Venkateswara_temple_entrance_09062015.JPG"},"107":{"t":"Kshir_Sagar","d":"This Divya Desam is not located on Earth. It is located in the higher heavens. It is often described as an ocean of pure milky water, upon which Vishnu and Lakshmi reside, lying on the snake Adishesha. But the divine essence of this ocean is believed to be present in this temple - Prasanna Venkatesa Perumal Temple, Perumal Koil Street, District Vellore, Walaja Taluk, Tirupparkatal, Tamil Nadu, India","x":"The Kshira Sagara (Sanskrit: क्षीरसागर, romanized: Kṣīrasāgara, lit. 'Ocean of Milk') is an ocean in Hindu cosmology. It is the abode where Vishnu reclines upon the serpent-king Shesha alongside his consort, Lakshmi. In the Samudra Manthana legend of the Puranas, the devas and asuras churned this ocean for a millennium to obtain amrita (the nectar of immortality). It is listed as the fifth of the seven oceans from the centre, surrounding the continent of Krauncha.","ia":"AnonymousUnknown author","il":"Public domain","ip":"https://commons.wikimedia.org/wiki/File:Vishnu_and_Lakshmi_on_Shesha_Naga,_ca_1870.jpg"},"108":{"t":"Vaikunta","d":"This Divya Desam is not located on Earth. Vaikuntha is the heavenly abode of Vishnu and Lakshmi. It is often described as being approached by seven tall golden doors. The guardians Jaya-Vijaya, the vehicle Garuda and the military commander Vishwaksena stand at the seventh door. When the seventh door opens, one can see Vishnu and Lakshmi seated on Adishesha, enjoying music from his devotee Narada. While the first 106 Divya Desams are believed to be mortal earthly replicas of Vaikuntha, this is the Vaikuntha situated upon the spiritual sky (Paravyoma).","x":"Vaikuntha (Sanskrit: वैकुण्ठ, romanized: Vaikuṇṭha, lit. 'without anxiety / imperfections'), also called Vishnuloka (Viṣṇuloka), is the abode of Vishnu, the supreme deity in the Vaishnava tradition of Hinduism, and his consort, Lakshmi, the supreme goddess of the sect. According to Ramanuja, Vaikuntha is the Parama Padam or Nitya Vibhuti, an \"eternal heavenly realm\", and is the \"divine imperishable world that is God's abode\". In Vaishnava literature, Vaikuntha is described as the highest realm above the fourteen lokas (worlds), and the place where the devotees of Vishnu go upon achieving liberation. It is guarded by the twin deities, Jaya and Vijaya, the dvarapalakas, or gatekeepers of Vaikuntha. The army of Vishnu, stationed at Vaikuntha, is led by Vishvaksena. The planets of Vaikuntha are described as being full of golden palaces and hanging gardens that grow fragrant fruits and flowers. The planets of Vaikuntha begin 26,200,000 yojanas (209,600,000 miles) above Satyaloka. This does not refer to physical distance.","ia":"A Tamil writer","il":"Public domain","ip":"https://commons.wikimedia.org/wiki/File:Picture_of_Vaikunda_-_Garuda_eagle_is_the_vehicle_of_Vishnu.jpg"}};

1:{
 story:'The Ranga Vimanam is said to have risen from the Milk Ocean and been worshipped by Brahma, then by the kings of the solar line down to Sri Rama, who gave it to Vibhishana. Carrying it to Lanka, Vibhishana set it down on the island between the Kaveri and the Kollidam, and it would not move again. The Lord promised to lie facing south, towards Lanka. The temple grew into seven enclosures with twenty-one towers, and the whole town lives inside its walls.',
 see:['Periya Perumal reclining on Adisesha under the golden Ranga Vimanam, and the processional Lord, Namperumal','Ranganayaki Thayar in Her own shrine. She never leaves it; the Lord comes to Her','Udayavar sannidhi, where the body of Ramanujacharya is preserved seated','Chakrathazhwar (Sudarsana) and the Dhanvantari shrine','The thousand-pillar hall and the Sesharaya mandapam carvings','The 73 metre Rajagopuram on the south side'],
 customs:['Thulukka Nachiyar: a shrine honours the Sultan\'s daughter who loved the Lord. In her memory He is offered wheat rotis with butter and is dressed in a lungi-style cloth.','Araiyar sevai: hereditary singers enact the Azhwars\' verses with gesture before the Lord.','Panguni Uthiram: the one day the Lord and Thayar sit together. Ramanuja offered his three Gadyams on this day.','On Kaisika Ekadasi and during Adhyayana Utsavam the Thiruvaimozhi is recited over ten nights, a practice traced to Thirumangai Azhwar and Nathamuni.'],
 festivals:'Vaikuntha Ekadasi in Margazhi (December to January), with the twenty-one day Pagal Pathu and Ra Pathu and the opening of the Paramapada Vasal. Panguni Uthiram (March to April). Chithirai car festival.',
 when:'October to March is comfortable. Vaikuntha Ekadasi is glorious and extremely crowded. Go for Viswaroopa darshan at dawn if you can; allow half a day at least.',
 gaudiya:'Sri Caitanya Mahaprabhu arrived in 1510, bathed in the Kaveri and saw Ranganatha daily, dancing in ecstasy (Caitanya-caritamrta, Madhya 9.79 to 9.165). He spent the four months of Caturmasya in the home of Venkata Bhatta, a Sri Vaishnava brahmana, whose young son became Gopala Bhatta Gosvami of Vrindavana. Their friendly conversation on why Lakshmi could not enter the rasa dance while the gopis could (Madhya 9.111 to 9.162) is one of the key passages on aisvarya and madhurya. Here too He embraced the brahmana who read the Gita with faulty Sanskrit but with tears, seeing Krishna as Arjuna\'s charioteer. A Jagannatha Math in Srirangam marks His stay. Sri Nityananda Prabhu also came here on pilgrimage (Caitanya-bhagavata, Adi 9).',
 pasuram:[{by:'Thondaradippodi Azhwar',ref:'Thirumalai 2',v:'Tamil Wikisource',
  ta:'பச்சைமா மலைபோல் மேனி பவளவாய் கமலச் செங்கண்\nஅச்சுதா! அமரர் ஏறே! ஆயர்தம் கொழுந்தே! என்னும்\nஇச்சுவை தவிர யான்போய் இந்திர லோகம் ஆளும்\nஅச்சுவை பெறினும் வேண்டேன் அரங்கமா நகருளானே!',
  tr:'pacchai mā malai pōl mēni, pavaḷa vāy, kamalac ceṅkaṇ\nacchutā! amarar ēṟē! āyar tam koḻundē! ennum\nic cuvai tavira yān pōy indira lōkam āḷum\nac cuvai peṟinum vēṇḍēn, araṅga mā nagar uḷānē!',
  en:'Body like a great green mountain, coral lips, eyes like red lotuses. O Achyuta! Bull among the immortals! Tender shoot of the cowherd clan! Apart from this taste of calling You so, even if I were given the taste of ruling Indra\'s world, I would not want it, O Lord who dwells in the great city of Arangam.',
  note:'The Azhwar prefers the taste of the Holy Name to heaven. A Gaudiya reader will hear the same mood as Sikshashtaka 4, na dhanam na janam.'},
 {by:'Thiruppaan Azhwar',ref:'Amalanadipiran 10',v:'Tamil Wikisource',
  ta:'கொண்டல் வண்ணனைக் கோவலனாய் வெண்ணெய்\nஉண்ட வாயன் என் உள்ளம் கவர்ந்தானை\nஅண்டர்கோன் அணியரங்கன் என் அமுதினைக்\nகண்ட கண்கள் மற்றொன்றினைக் காணாவே.',
  tr:'koṇḍal vaṇṇanai, kōvalanāy veṇṇey\nuṇḍa vāyan, en uḷḷam kavarndānai,\naṇḍar kōn, aṇi araṅgan, en amudinaik\nkaṇḍa kaṇgaḷ maṟṟonṟinaik kāṇāvē.',
  en:'He is the colour of a rain cloud. As a cowherd boy His mouth ate butter. He has stolen my heart. King of the gods, the jewel of Arangam, my nectar: the eyes that have seen Him will see nothing else.',
  note:'The last of ten verses describing the Lord from feet to face. The Azhwar sees the butter thief of Gokula in Ranganatha.'}],
 official:'https://srirangamranganathar.hrce.tn.gov.in'

12:{
 story:'Sage Hema performed penance by the Potramarai tank and Lakshmi appeared as his daughter Komalavalli. The Lord came down in a chariot to marry Her, and the sanctum is built as a chariot with wheels, horses and elephants. He is Sarangapani, bearer of the bow Sarnga, and Aravamudhan, the nectar that never satiates. When Thirumazhisai Azhwar asked whether He lay down from weariness after measuring the worlds, the Lord began to rise to answer; the Azhwar begged Him to stay as He was, and He remains half-risen (utthana sayanam).',
 see:['The chariot-shaped sanctum with separate northern and southern entrances used by season','Aravamudhan half-risen on Adisesha','Komalavalli Thayar and the Potramarai (golden lotus) tank','The eleven-tier rajagopuram with dance karanas carved on it'],
 customs:['The Lord is honoured as "Aravamudazhwan" and Thirumazhisai Azhwar as "Thirumazhisai Piran", an exchange of titles between Lord and devotee.','The Lord is said to have performed the last rites for a childless devotee, Lakshmi Narayanaswami, who built the tower. The rite is still observed each Deepavali new moon.'],
 festivals:'Chithirai car festival; Thai (Sankranti) and Vaikasi festivals. The Mahamaham at the nearby tank comes once in twelve years.',
 when:'Kumbakonam is the best base for some fifteen Divya Desams. November to February is pleasant.',
 gaudiya:'Caitanya-caritamrta (Madhya 9.78) records Mahaprabhu at Kumbhakarna-kapala, which Srila Prabhupada identifies as Kumbakonam, before He reached Sri Ranga. The Sri Vaishnava story of Nathamuni is the pearl here: a single decad heard from travelling singers set him searching until he recovered all four thousand verses from Nammazhwar by chanting Madhurakavi\'s verses on his guru.',
 pasuram:[{by:'Nammazhwar',ref:'Thiruvaimozhi 5.8.1',v:'the koyil.org edition',
  ta:'ஆராவமுதே! அடியேன் உடலம் நின்பால் அன்பாயே\nநீராய் அலைந்து கரைய உருக்குகின்ற நெடுமாலே!\nசீரார் செந்நெல் கவரி வீசும் செழுநீர்த் திருக்குடந்தை\nஏரார் கோலம் திகழக் கிடந்தாய்! கண்டேன் எம்மானே!',
  tr:'ārā amudē! aḍiyēn uḍalam nin pāl anbāyē\nnīrāy alaindu karaiya urukkuginṟa neḍumālē!\nsīr ār sennel kavari vīsum seḻu nīrt tirukkuḍandai\nēr ār kōlam tigaḻak kiḍandāy! kaṇḍēn emmānē!',
  en:'O nectar that never satiates! O Lord of endless love, You melt this servant\'s very body, which has become nothing but love for You, until it dissolves and flows like water. In Thirukkudanthai of rich waters, where ripe red paddy waves like royal fans, I have seen You lying there, radiant in Your beauty, my Master!',
  note:'The verse Nathamuni heard. Its closing line said "these ten out of a thousand", which told him a thousand existed.'}]
},
13:{
 story:'Sage Markandeya found a girl child under a tulasi plant and raised Her. An old brahmana came asking for Her hand. Markandeya protested that She was too young even to cook with the right amount of salt. The suitor answered that he would gladly eat without salt, and revealed Himself as Narayana. The Lord is Oppiliappan, "He who has no equal", and Bhumi Devi kneels beside Him in the same sanctum.',
 see:['The Lord standing with His right hand showing the words "mam ekam saranam vraja"','Bhumi Devi and Markandeya kneeling in the sanctum','The Ahoratra Pushkarini, where bathing is permitted by day or night'],
 customs:['No salt is used in any offering, and pilgrims do not carry salted food into the temple.','Many families who cannot travel to Tirumala fulfil their vows here; the Lord is called the elder brother of Venkatesa.','Sravanam, the Lord\'s star each month, is observed with a lamp procession.'],
 festivals:'Purattasi Brahmotsavam (September to October) and Panguni Brahmotsavam; monthly Sravana deepam.',
 when:'Five kilometres from Kumbakonam; easily combined with Nachiyar Koil and Thirucherai in one morning.',
 gaudiya:'The gesture of the Lord\'s hand points to Bhagavad-gita 18.66, the carama-sloka that Sri Vaishnavas treasure as one of their three secrets and that Gaudiya acharyas treat as the Gita\'s final instruction.'
},
17:{
 story:'The Lord here is said to grant liberation without delay, and the town is called Bhuloka Vaikuntham in its own tradition. The processional Lord is Sowrirajan, "the king with hair". A temple priest once gave the Lord\'s garland to a lady, and when the king found a hair on it the priest swore it was the Lord\'s own. The next day the Lord showed a lock of hair to save His servant.',
 see:['Sowrirajan with a flowing lock of hair, seen on the new moon procession','The Lord\'s hand in the pose of receiving, not giving','The seven-tier tower and the Nitya Pushkarini in front'],
 customs:['Muniyodharan pongal: a late-night offering of pongal recalls a devotee who offered his own meal in his mind each night.','The Lord gives darshan as Vishnu, Brahma and Shiva on successive days of the Vaikasi festival.'],
 festivals:'Vaikasi Brahmotsavam and the Masi Magam procession to the sea at Thirumalairayanpattinam.',
 when:'Between Nannilam and Nagapattinam. Combine with Thirukkannamangai and Thirukkannangudi.',
 gaudiya:'A Pancha Krishnaranya kshetram. Kulasekhara Azhwar\'s lullaby here, sung as Kausalya, is vatsalya-rasa for Sri Rama, a mood Gaudiya readers know from Mother Yasoda.',
 pasuram:[{by:'Kulasekhara Azhwar',ref:'Perumal Thirumozhi 8.1',v:'the koyil.org edition',
  ta:'மன்னுபுகழ்க் கௌசலைதன் மணிவயிறு வாய்த்தவனே!\nதென்னிலங்கைக் கோன்முடிகள் சிந்துவித்தாய்! செம்பொன்சேர்\nகன்னிநன் மாமதிள் புடைசூழ் கணபுரத்தென் கருமணியே!\nஎன்னுடைய இன்னமுதே! இராகவனே! தாலேலோ.',
  tr:'mannu pugaḻk kausalai tan maṇi vayiṟu vāyttavanē!\nten ilaṅgaik kōn muḍigaḷ sinduvittāy! sem pon sēr\nkanni nan mā madiḷ puḍai sūḻ kaṇapurattu en karumaṇiyē!\nennuḍaiya in amudē! irāgavanē! tālēlō.',
  en:'You who graced the jewel-like womb of Kausalya of lasting fame! You who scattered the crowns of the king of southern Lanka! My dark gem of Kannapuram, ringed by fine strong walls of red gold! My own sweet nectar! O Raghava, talelo.',
  note:'"Talelo" is the refrain of a Tamil lullaby. Sung in homes to put children to sleep.'}]
},
42:{
 story:'On a night of heavy rain Poigai Azhwar took shelter in the narrow entrance passage of a hermitage. Bhoothath Azhwar arrived, and then Pey Azhwar: room for one to lie, two to sit, three to stand. In the dark they felt a fourth pressing among them. Poigai lit a lamp of the earth, the sea and the sun. Bhoothath lit a lamp of love. By that light Pey Azhwar saw the Lord with Sri, and the first three hundred verses of the Divya Prabandham poured out. The presiding Lord is Trivikrama, a huge figure of dark wood with one foot raised.',
 see:['Trivikrama with right foot raised, holding the conch in His right hand, with Mahabali\'s son at His feet','The small passage (idaikazhi) associated with the three Azhwars','A shrine to Vishnu Durga within the Vishnu temple','One of the tallest temple towers in Tamil Nadu on the east side'],
 customs:['The three Mudhal Azhwars are honoured together here, and their meeting is re-enacted in the temple festival.'],
 festivals:'Panguni Brahmotsavam; Vaikuntha Ekadasi; the Mudhal Azhwar festival in Aippasi.',
 when:'On the Pennai river between Tiruvannamalai and Villupuram. Half a day from Chennai by road.',
 gaudiya:'The Azhwars\' experience matches the Bhagavatam\'s teaching that the Lord comes uninvited where His devotees gather to speak of Him. Three sadhus, no plan, no seat, and He pressed in to be with them.',
 pasuram:[{by:'Poigai Azhwar',ref:'Mudhal Thiruvandadi 1',v:'Tamil Wikipedia',
  ta:'வையம் தகளியா வார்கடலே நெய்யாக\nவெய்ய கதிரோன் விளக்காக - செய்ய\nசுடராழியான் அடிக்கே சூட்டினேன் சொல்மாலை\nஇடராழி நீங்குகவே என்று.',
  tr:'vaiyam tagaḷiyā, vār kaḍalē neyyāga,\nveyya kadirōn viḷakkāga – seyya\nsuḍar āḻiyān aḍikkē sūṭṭinēn sol mālai\niḍar āḻi nīṅgugavē enṟu.',
  en:'With the earth as the lamp bowl, the wide ocean as the ghee and the hot-rayed sun as the flame, I have laid a garland of words at the feet of Him who holds the bright red discus, praying that the ocean of sorrow may recede.',
  note:'The very first verse of the three Thiruvandadis. Each verse begins with the last word of the one before.'}]
},
43:{
 story:'Brahma performed a great sacrifice at Kanchi. When the river Vegavati rushed to wash it away the Lord lay across her path, and at the end He rose from the sacrificial fire as Varadaraja, the king who grants boons. The sanctum stands on Hastigiri, the Elephant Hill, reached by twenty-four steps. Ramanujacharya carried water daily for this Lord, and through Thirukachi Nambi the Lord sent him six answers that settled his doctrine. It is "Perumal Koil" to Sri Vaishnavas, as Srirangam is "Koil" and Tirumala is "Malai".',
 see:['Varadaraja standing on Hastigiri, and Perundevi Thayar in Her shrine','The hundred-pillar hall with stone chains carved from a single block','The golden and silver lizards on the ceiling behind the sanctum, which pilgrims touch','Anantha Saras tank, where Athi Varadar rests under water','Shrines of Ramanuja, Thirukachi Nambi and Vedanta Desika'],
 customs:['Athi Varadar, the original fig-wood form, is raised from the tank for 48 days once in forty years (last in 2019).','The Lord\'s Garuda Sevai in Vaikasi is famous; for a few moments the umbrellas hide Him, recalling a devotee far away who was granted the sight.','Recitation and honours here follow the Vadakalai tradition.'],
 festivals:'Vaikasi Brahmotsavam (May to June) with Garuda Sevai on the third day; Purattasi Navaratri; Vaikuntha Ekadasi.',
 when:'Use Kanchipuram as a base for two days to cover its fourteen Divya Desams and Thiruputkuzhi. Temples close from about noon to 4 pm.',
 gaudiya:'Caitanya-caritamrta (Madhya 9.69) says Mahaprabhu came to Vishnu-kanchi, saw Lakshmi-Narayana and offered prayers, and stayed two days dancing and chanting. Srila Prabhupada\'s purport names Lord Varadaraja. Sri Nityananda Prabhu also visited Kanchi.',
 pasuram:[{by:'Bhoothath Azhwar',ref:'Irandam Thiruvandadi 96',v:'the koyil.org edition',
  ta:'அத்தியூரான் புள்ளையூர்வான் அணிமணியின்\nதுத்திசேர் நாகத்தின்மேல் துயில்வான் - முத்தீ\nமறையாவான் மாகடல் நஞ்சுண்டான் தனக்கும்\nஇறையாவான் எங்கள் பிரான்.',
  tr:'attiyūrān, puḷḷai ūrvān, aṇi maṇiyin\ntutti sēr nāgattin mēl tuyilvān – muttī\nmaṟai āvān, mā kaḍal nañcu uṇḍān tanakkum\niṟai āvān, eṅgaḷ pirān.',
  en:'He is the Lord of Atthiyur. He rides the bird. He sleeps upon the serpent whose hoods are marked with lovely gems. He is the three fires and the Vedas. He is Lord even of the one who drank the poison of the great ocean. He is our benefactor.',
  note:'Atthiyur, "town of the fig tree", is the old name of the Varadaraja kshetram.'}]
},
51:{
 story:'Thirumazhisai Azhwar lived here with his disciple Kanikannan. The Pallava king, angered that Kanikannan would not sing his praise, banished him. The Azhwar told the Lord: Kanikannan is leaving, I am leaving, roll up Your serpent mat and come. The Lord did so, and Kanchi fell dark. The king begged forgiveness, the three returned, and the Lord lay down again with His head to the other side. He is Yathothakari, in Tamil "Sonna Vannam Seitha Perumal", the Lord who did as He was told. In the older story He lay across the Vegavati to protect Brahma\'s sacrifice.',
 see:['The Lord reclining with His head to the right of the viewer, the reverse of the usual direction','Poigai Azhwar\'s birth tank and shrine beside the temple'],
 customs:['The place where the three halted for the night is still called Orikkai, "one night\'s stay".'],
 festivals:'Panguni Brahmotsavam; Poigai Azhwar\'s birth star in Aippasi.',
 when:'A short visit within the Kanchipuram circuit, near Ashtabuyagaram and Thoopul.',
 gaudiya:'A direct picture of bhakta-vatsalya: the Lord sets aside His majesty and obeys His devotee, as Krishna drove Arjuna\'s chariot and let Yasoda bind Him.',
 pasuram:[{by:'Thirumazhisai Azhwar',ref:'Traditional single verse (not part of the four thousand)',v:'Tamil Wikipedia',
  ta:'கணிகண்ணன் போகின்றான் காமருபூங் கச்சி\nமணிவண்ணா! நீ கிடக்க வேண்டா - துணிவுடைய\nசெந்நாப் புலவனும் போகின்றேன் நீயும் உன்றன்\nபைந்நாகப் பாய்சுருட்டிக் கொள்.',
  tr:'kaṇikaṇṇan pōginṟān; kāmaru pūṅ kacci\nmaṇivaṇṇā! nī kiḍakka vēṇḍā – tuṇivuḍaiya\nsennāp pulavanum pōginṟēn; nīyum unṟan\npainnāgap pāy suruṭṭik koḷ.',
  en:'Kanikannan is going. O gem-hued Lord of lovely, flowering Kanchi, You need not lie here any longer. I, the poet of fearless and truthful tongue, am going too. You also, roll up Your serpent mat.',
  note:'On their return he sang the same verse with the words changed: Kanikannan has turned back, lie down again and spread Your mat.'}]
},
60:{
 story:'King Sumati wished to see the Lord as He was on the battlefield of Kurukshetra, and Venkatakrishna appeared here. He stands with a sword at His waist and the conch in His hand but no discus, because He had vowed not to take up a weapon in the war. He wears a moustache, and with Him in the sanctum are Rukmini, Balarama, Satyaki, Pradyumna and Aniruddha. The temple houses five Lords sung by the Azhwars: Venkatakrishna, Ranganatha, Rama, Gajendra Varada and Narasimha.',
 see:['Venkatakrishna with His family, a rare group in one sanctum','Parthasarathy, the utsavar, whose face shows the scars of Bhishma\'s arrows','Yoga Narasimha (Thelliya Singar) facing west with a separate flagstaff','Vedavalli Thayar and the lily tank (alli keni) that names Triplicane'],
 customs:['The moustache is removed for a few days around Vaikuntha Ekadasi so devotees may see the Lord without it.','Less chilli is used in the offerings, out of tenderness for the Lord\'s wounded face.'],
 festivals:'Chithirai Brahmotsavam for Parthasarathy and Aani Brahmotsavam for Narasimha; Vaikuntha Ekadasi.',
 when:'In the heart of Chennai. Early morning or after 6 pm on a weekday is easiest.',
 gaudiya:'This is Krishna exactly as the speaker of Bhagavad-gita, the Lord who chose to be His devotee\'s driver. Srila Prabhupada often cited Partha-sarathi as proof that the Lord enjoys serving His devotee.',
 pasuram:[{by:'Thirumangai Azhwar',ref:'Periya Thirumozhi 2.3.1',v:'the koyil.org edition',
  ta:'விற்பெரு விழவும் கஞ்சனும் மல்லும் வேழமும் பாகனும் வீழ\nசெற்றவன் தன்னை, புரமெரி செய்த சிவனுறு துயர்களை தேவை\nபற்றலர் வீயக் கோல்கையில் கொண்டு பார்த்தன்தன் தேர்முன் நின்றானை\nசிற்றவை பணியால் முடிதுறந்தானைத் திருவல்லிக்கேணிக் கண்டேனே.',
  tr:'viṟ peru viḻavum, kañcanum, mallum, vēḻamum, pāganum vīḻa\nseṟṟavan tannai; puram eri seyda sivan uṟu tuyar kaḷai dēvai;\npaṟṟalar vīyak kōl kaiyil koṇḍu pārttan tan tēr mun ninṟānai;\nsiṟṟavai paṇiyāl muḍi tuṟandānait tiruvallikkēṇik kaṇḍēnē.',
  en:'He who brought down the great bow festival, Kamsa, the wrestlers, the elephant and its keeper; the God who removed the suffering of Shiva, burner of the three cities; He who stood at the front of Partha\'s chariot with a whip in hand so that the enemies would perish; He who gave up the crown at His stepmother\'s word: Him I have seen in Thiruvallikkeni.',
  note:'One verse names Krishna of Mathura, Krishna the charioteer and Rama of Ayodhya, all present in this one temple.'}]
},
75:{
 story:'The sage Divakara (in another telling, Vilvamangalam Swami) served a mischievous child who one day vanished, saying he could be found in Ananthankadu. The sage searched the forest and saw the child merge into a tree, which fell and became the Lord reclining on Ananta, so vast that he begged Him to shrink. The Lord is still so long that He is seen through three doors. The form is made of katusarkara, a herbal compound, over 12,008 salagrama silas. The kings of Travancore ruled as Padmanabha-dasa, servants of the Lord, who is the sovereign of the state.',
 see:['Darshan through three doors: the face with a hand over a Shiva linga, Brahma on the lotus from the navel, and the lotus feet','The single-stone platform (ottakkal mandapam) before the sanctum','Shrines of Narasimha and of Krishna (Thiruvambadi), each with its own flagstaff','The long corridor of carved pillars and the Padma Theertham tank'],
 customs:['Strict dress code: men wear a dhoti with no shirt; women wear a sari or a dhoti wrapped over other dress. Phones and cameras are not allowed inside.','Murajapam, a 56-day Vedic recitation, ends once in six years with Laksha Deepam, a hundred thousand lamps.','At the Arattu the Maharaja walks with sword in hand before the Lord to the sea.'],
 festivals:'Alpashi (October to November) and Painkuni (March to April) festivals, each ending in Arattu at Shankumugham beach.',
 when:'Darshan hours are short and broken into slots; check the day before. Early morning is best.',
 gaudiya:'Caitanya-caritamrta (Madhya 9.241 to 9.242) records that Mahaprabhu came to Ananta Padmanabha and stayed two days seeing the Lord, soon after He found the Brahma-samhita at Adi Kesava. Sri Nityananda Prabhu and, centuries later, the Gaudiya acharyas also honoured this temple.',
 pasuram:[{by:'Nammazhwar',ref:'Thiruvaimozhi 10.2.1',v:'the koyil.org edition',
  ta:'கெடும் இடராய எல்லாம் கேசவா என்ன, நாளும்\nகொடுவினை செய்யும் கூற்றின் தமர்களும் குறுககில்லார்\nவிடமுடை அரவில் பள்ளி விரும்பினான் சுரும்பலற்றும்\nதடமுடை வயல் அனந்தபுரநகர் புகுதும் இன்றே.',
  tr:'keḍum iḍar āya ellām "kēsavā" enna; nāḷum\nkoḍu vinai seyyum kūṟṟin tamargaḷum kuṟugagillār;\nviḍam uḍai aravil paḷḷi virumbinān, surumbu alaṟṟum\ntaḍam uḍai vayal anantapura nagar pugudum inṟē.',
  en:'Say "Kesava" and all that is called suffering is destroyed. The servants of Death, who do their cruel work every day, will not even come near. Let us enter today itself the city of Anantapuram, with its broad fields and ponds where bees hum, where He has chosen to rest on the venomous serpent.',
  note:'Among the last decads of the Thiruvaimozhi, sung as the Azhwar prepares to leave this world. Note the urgency of "today itself".'}]
},
76:{
 story:'The Lord lay down here to subdue the demon Kesi, and the rivers Kothai and Paraliyar flow around the temple in a circle (vattam aru), which gives the town its name. Adikesava is about twenty-two feet long and faces west. Local tradition counts Him the elder brother of Anantha Padmanabha, and the two temples face each other across the distance. The temple is built in Kerala style with fine woodwork, though it now lies in Tamil Nadu.',
 see:['Adikesava seen through three doors, like Padmanabha but reclining in the opposite direction','The ottakkal mandapam cut from one stone','Wood carvings and murals around the sanctum','The river ghats on three sides'],
 customs:['Kerala temple rules apply: men enter in a dhoti without a shirt.','On certain evenings in the months of Purattasi and Panguni the setting sun lights the Lord\'s face.'],
 festivals:'Painkuni and Alpashi festivals with Arattu; Vaikuntha Ekadasi.',
 when:'About 45 km from Thiruvananthapuram and 30 km from Nagercoil. A major renovation and reconsecration was completed in 2022.',
 gaudiya:'This is the single most important Divya Desam for Gaudiya history. Caitanya-caritamrta (Madhya 9.234 to 9.241) tells that at the temple of Adi Kesava on the Payasvini, Mahaprabhu heard devotees reciting the fifth chapter of the Brahma-samhita, was overjoyed at its conclusions and had it copied to carry back to Puri. It opens with isvarah paramah krsnah and gives the govindam adi-purusam prayers sung in ISKCON temples every morning.'
},
87:{
 story:'Maran was born to Kari and Udayanangai and from birth neither cried, ate nor spoke. His parents left him before Adinatha, and the child crawled into the hollow of a tamarind tree and sat in meditation for sixteen years. Madhurakavi, travelling in the north, followed a light in the southern sky to this tree, asked a question, and received the answer that made him a disciple for life. From under the tree flowed the four works honoured as the Tamil form of the four Vedas. The town was Kurugur; it became Azhwar Thirunagari, the holy city of the Azhwar.',
 see:['Adinatha, a self-manifest form whose feet are said to lie below the ground','The Uranga Puli, "the tamarind that does not sleep": its leaves do not close at night. It is revered as Adisesha','Nammazhwar\'s own shrine and vimanam, larger than the Lord\'s','The festival image of Nammazhwar, said to have been formed from the boiled water of the Tamraparni'],
 customs:['Araiyar sevai is preserved here, as at Srirangam and Srivilliputhur.','On Vaikasi Visakam the nine Lords of the Nava Tirupati arrive on Garuda and Nammazhwar greets each with the verses he sang for Him.','The Sathari placed on your head in every Vishnu temple represents Nammazhwar (Sathakopan) at the Lord\'s feet.'],
 festivals:'Vaikasi Visakam (May to June), Nammazhwar\'s birth star, with the nine Garuda Sevai; Margazhi Adhyayana Utsavam.',
 when:'Base at Tirunelveli or Tiruchendur. All nine Nava Tirupati fit into one full day by car if you start at 7 am.',
 gaudiya:'Caitanya-caritamrta (Madhya 9.219) says Mahaprabhu bathed in the Tamraparni and saw Naya-tripati, which the purport of Srila Prabhupada identifies with Alwar Tirunagari. Text 9.222 adds the Vishnu temple at Sri Vaikuntha on the same river. Madhurakavi\'s single-minded service to his guru mirrors the Gaudiya understanding that the mercy of Krishna comes through the spiritual master.',
 pasuram:[{by:'Madhurakavi Azhwar',ref:'Kanninun Siruthambu 1',v:'Tamil Wikisource',
  ta:'கண்ணிநுண் சிறுத்தாம்பினால் கட்டுண்ணப்\nபண்ணிய பெருமாயன் என் அப்பனில்\nநண்ணித் தென்குருகூர் நம்பி என்றக்கால்\nஅண்ணிக்கும் அமுதூறும் என் நாவுக்கே.',
  tr:'kaṇṇi nuṇ siṟut tāmbināl kaṭṭuṇṇap\npaṇṇiya peru māyan en appanil\nnaṇṇit ten kurugūr nambi enṟakkāl\naṇṇikkum amudu ūṟum en nāvukkē.',
  en:'My Lord, the great wonder-worker, let Himself be tied with a thin, short, knotted rope. Yet when I turn from Him and say "Nambi of southern Kurugur", sweetness wells up like nectar on my tongue.',
  note:'Damodara-lila in the first line; the glory of the devotee in the rest. The guru\'s name is sweeter to him than even Krishna bound by Yasoda.'}]
},
88:{
 story:'Two hunter brothers, Villi and Kandan, founded the town after the Lord appeared to Villi; hence Villi-puthur. Vishnuchitta kept a flower garden here and found a baby girl beneath the tulasi. She grew up as Kodai, wore the Lord\'s garlands before they were offered, and when her father was dismayed the Lord said He wanted only those she had worn. She is Andal, "she who rules". She imagined her town as Gokula and herself as a gopi, sang the Thiruppavai, and was carried in bridal procession to Srirangam, where she entered the sanctum and merged with Ranganatha.',
 see:['Vatapatrasayi, the Lord reclining on a banyan leaf, in the older temple','The Andal temple: Rangamannar as bridegroom with Andal on His right and Garuda on His left, all on one seat','The well in which Andal looked at her reflection wearing the garland','The tulasi garden where she was found','The eleven-tier tower, about 59 metres, the emblem of the Tamil Nadu government'],
 customs:['Andal\'s garland and her parrot made of leaves are sent to Tirumala for the Purattasi Brahmotsavam and to Azhagar Koil for the Chithirai festival.','Araiyar sevai continues here.','Thiruppavai is recited in every Vishnu temple of the south through Margazhi, and at Tirumala it replaces the Suprabhatam that month.'],
 festivals:'Aadi Pooram (July to August), Andal\'s birth star, with the great car festival; Margazhi Thiruppavai recitation; Panguni wedding festival.',
 when:'About 75 km south-west of Madurai. Combine with Thiruthangal.',
 gaudiya:'Andal is the nearest point of contact between the Azhwars and the mood of Vraja. She does not approach Narayana in awe; she becomes a cowherd girl waking her friends to go to Krishna. Gaudiya readers will recognise katyayani-vrata of the gopis (Srimad-Bhagavatam 10.22) behind the Thiruppavai.',
 pasuram:[{by:'Andal',ref:'Thiruppavai 1',v:'Tamil Wikisource',
  ta:'மார்கழித் திங்கள் மதிநிறைந்த நன்னாளால்\nநீராடப் போதுவீர்! போதுமினோ, நேரிழையீர்!\nசீர்மல்கும் ஆய்ப்பாடிச் செல்வச் சிறுமீர்காள்!\nகூர்வேல் கொடுந்தொழிலன் நந்தகோபன் குமரன்\nஏரார்ந்த கண்ணி யசோதை இளஞ்சிங்கம்\nகார்மேனிச் செங்கண் கதிர்மதியம் போல்முகத்தான்\nநாராயணனே நமக்கே பறைதருவான்\nபாரோர் புகழப் படிந்தேலோர் எம்பாவாய்.',
  tr:'mārgaḻit tiṅgaḷ madi niṟainda nannāḷāl\nnīrāḍap pōduvīr! pōduminō, nēr iḻaiyīr!\nsīr malgum āyppāḍic celvac ciṟumīrgāḷ!\nkūr vēl koḍun toḻilan nandagōpan kumaran,\nēr ārnda kaṇṇi yasōdai iḷam siṅgam,\nkār mēnic ceṅkaṇ kadir madiyam pōl mugattān,\nnārāyaṇanē namakkē paṟai taruvān;\npārōr pugaḻap paḍindēlōr empāvāy.',
  en:'It is the month of Margazhi, the auspicious day of the full moon. Come, all who wish to bathe, you girls with fine jewels, precious young maidens of prosperous Ayppadi! The son of Nandagopa, who is fierce with his sharp spear; the young lion of Yasoda of the lovely eyes; He of the dark body, red eyes and face like the sun and moon; Narayana Himself will surely give us what we seek. Join in, so that the world may praise us, my girls.',
  note:'"Narayanane namakke": He alone is the means, and we alone, who have nothing else, are fit to receive. The whole doctrine of surrender is read from these two words.'}]
},
91:{
 story:'The hill is Vrishabhadri, the hill of the bull, where Dharma in the form of a bull worshipped the Lord. The Lord is Sundararaja, "Azhagar", the beautiful one, and Kallazhagar to the Kallar community who regard Him as their own. Each Chithirai He rides on a golden horse to Madurai and steps into the Vaigai. Legend says He comes for His sister Meenakshi\'s wedding, hears on the way that it is over, and turns back at the river: a festival that joins Vaishnavas and Saivas of the whole region. On the way He wears the garland sent by Andal.',
 see:['Paramaswami standing with Sri Devi and Bhu Devi, and the processional Sundararaja of pure gold alloy','Sudarsana with sixteen arms and Yoga Narasimha behind','The shrine of Karuppannaswami, guardian of the eighteen steps, worshipped at the closed tower door','Nupura Ganga (Silambaru), a spring on the hill said to flow from the Lord\'s anklet'],
 customs:['Andal vowed a hundred pots of butter and a hundred pots of sweet rice to this Lord. Ramanuja made the offering on her behalf, and when he reached Srivilliputhur she called him "Annan", elder brother.','Dosai made with the hill spring water is the temple\'s special prasadam.'],
 festivals:'Chithirai festival (April to May) with the entry into the Vaigai; Aadi Brahmotsavam with the car festival.',
 when:'21 km north-east of Madurai at the foot of a wooded hill. Mornings are cool; monkeys are bold.',
 gaudiya:'Caitanya-caritamrta (Madhya 9.166 to 9.173) says that after Sri Ranga Mahaprabhu came to Rishabha Hill, offered prayers at the temple of Narayana and stayed three days with Paramananda Puri. Some devotees identify Rishabha Hill with this Vrishabhadri. The purport of Srila Prabhupada, however, places it at the Palni hills near Madurai, so the identification with Azhagar Koil is a possibility, not a settled fact.',
 pasuram:[{by:'Andal',ref:'Nachiyar Thirumozhi 9.6',v:'Tamil Wikisource',
  ta:'நாறு நறும்பொழில் மாலிருஞ்சோலை நம்பிக்கு, நான்\nநூறு தடாவில் வெண்ணெய் வாய்நேர்ந்து பராவி வைத்தேன்\nநூறு தடா நிறைந்த அக்கார அடிசில் சொன்னேன்\nஏறு திருவுடையான் இன்று வந்து இவை கொள்ளுங்கொலோ!',
  tr:'nāṟu naṟum poḻil māliruñcōlai nambikku, nān\nnūṟu taḍāvil veṇṇey vāy nērndu parāvi vaittēn;\nnūṟu taḍā niṟainda akkāra aḍisil sonnēn;\nēṟu tiru uḍaiyān inṟu vandu ivai koḷḷuṅkolō!',
  en:'To the Lord of Maliruncholai of fragrant groves I have vowed by word of mouth a hundred pots of butter, and I have promised a hundred pots filled with sweet milk rice. Will He whose glory ever rises come today and accept them?',
  note:'She could only promise in words. Ramanuja, reading this, went to Azhagar Koil and offered both in full.'}]
},
93:{
 story:'When Hiranyakasipu troubled the worlds, the devas and sages met here in a group (goshti) to plan with the Lord, which gives the town its name. The temple has a three-storey Ashtanga vimanam: the Lord dancing as Krishna on the ground floor, reclining on the first, sitting above that, and standing at the top. Ramanujacharya walked from Srirangam eighteen times before Thirukoshtiyur Nambi taught him the meaning of the eight-syllable mantra, on condition of secrecy. Ramanuja then called those who wished to hear and taught it from the temple. Asked why he risked hell by disobeying, he said that if so many gained liberation, he was content to go alone. Nambi embraced him and called him "Emperumanar", greater than my Lord.',
 see:['The four levels of the Ashtanga vimanam; climb to the top for the view Ramanuja had','Uraga Mellanayan reclining, with the silver utsavar Sowmya Narayanan','Images of Ramanuja and Thirukoshtiyur Nambi; Nambi\'s house nearby','A Shiva linga within the temple, worshipped as part of the legend of the devas\' meeting'],
 customs:['Lamp vow: devotees take home a small lamp from the temple at Masi Magam, keep it for a year for a wish, and return it with more lamps.'],
 festivals:'Masi Magam float festival (February to March); Vaikuntha Ekadasi.',
 when:'Between Madurai and Karaikudi. Combine with Thirumeyyam on the same road.',
 gaudiya:'Ramanuja\'s act is the Sri Vaishnava parallel to Mahaprabhu\'s open distribution of the Holy Name: compassion that will not keep the highest gift for a qualified few. Note that Sri Vaishnava tradition understands that he shared the meaning with sincere seekers, not that mantra and initiation became unnecessary.',
 pasuram:[{by:'Periyazhwar',ref:'Periyazhwar Thirumozhi 1.1.1',v:'Tamil Wikisource',

106:{

const LEARN = [
{id:'what',title:'What is a Divya Desam?',html:`
<p>A Divya Desam is a temple of Vishnu praised in the hymns of the Azhwars, twelve poet-saints of the Tamil country who lived roughly between the sixth and ninth centuries. Their four thousand verses, the Nalayira Divya Prabandham, are honoured by Sri Vaishnavas as the Tamil Veda. The act of singing the Lord's welfare at a shrine is called <b>mangalasasanam</b>.</p>
<p>There are 108: 105 in India, one in Nepal, and two beyond this world, the Milk Ocean and Paramapadam. So a pilgrim can walk to <b>106</b>. The list was fixed in the form we know by later teachers, notably in the <i>Nootrettu Thiruppathi Andadi</i> of Pillai Perumal Iyengar.</p>
<p>The verses were nearly lost. In the ninth or tenth century Nathamuni heard ten verses on the Lord of Kumbakonam, went looking for the rest, and received all four thousand from Nammazhwar in meditation at Azhwar Thirunagari. He set them to music and placed them in temple worship, where they are still sung.</p>
<p>The regions follow the old Tamil kingdoms: Chola Nadu (40), Nadu Nadu (2), Thondai Nadu (22), Malai Nadu (13), Pandya Nadu (18), Vada Nadu in the north (11) and Vinnulagam, the heavenly realm (2).</p>`},
{id:'sv',title:'Sri Vaishnavism in simple words',html:`
<p><b>Who is God?</b> Sriman Narayana, always with Sri (Lakshmi). The name of the tradition begins with Her because She is the mediator (purushakara) who recommends the soul to the Lord and softens His justice with mercy.</p>
<p><b>What is the philosophy?</b> Visishtadvaita, taught by Ramanujacharya (1017 to 1137). Souls and matter are real and eternal, and they are the body of God, who is their inner soul. There is one reality, qualified by these distinctions.</p>
<p><b>What is the path?</b> Bhakti, and above all <b>prapatti</b> or saranagati: giving oneself entirely into the Lord's care. Its support is three "secrets": the eight-syllable mantra, the dvaya mantra and the carama-sloka (Bhagavad-gita 18.66).</p>
<p><b>Five forms of the Lord:</b> para (in Vaikuntha), vyuha (in the Milk Ocean), vibhava (the avataras), antaryami (in the heart) and <b>archa</b> (the deity in the temple). The archa form is prized most because it is the one within reach of everyone, which is why the Divya Desams matter so much.</p>
<p><b>Teachers to know:</b> Nathamuni, Yamunacharya (Alavandar), Ramanuja, Pillai Lokacharya, Vedanta Desika and Manavala Mamunigal.</p>`},
{id:'kalai',title:'Tenkalai and Vadakalai',html:`
<p>About two centuries after Ramanuja two schools took shape. They share the same Lord, scriptures, acharya and temples. The differences are of emphasis, traditionally counted as eighteen points. Both are respected here; please ask the local devotees which tradition a temple follows.</p>
<table><thead><tr><th></th><th>Tenkalai (southern)</th><th>Vadakalai (northern)</th></tr></thead><tbody>
<tr><td>Chief teachers</td><td>Pillai Lokacharya, Manavala Mamunigal</td><td>Vedanta Desika</td></tr>
<tr><td>Grace and effort</td><td>Grace is unconditioned. The Lord carries the soul as a mother cat carries her kitten.</td><td>Grace responds to a gesture of surrender. The soul holds on as a baby monkey clings to its mother.</td></tr>
<tr><td>Prapatti</td><td>Not an act that earns anything; it is the recognition that He alone is the means.</td><td>A definite act with limbs, performed once, which the Lord has chosen to accept as the occasion for His grace.</td></tr>
<tr><td>Sri (Lakshmi)</td><td>Supreme mediator; a soul of unique status, not infinite in the way the Lord is.</td><td>Co-equal with the Lord, infinite, and Herself able to grant liberation.</td></tr>
<tr><td>Scripture</td><td>Strong emphasis on the Tamil Prabandham.</td><td>Sanskrit Veda and Tamil Prabandham given equal weight (Ubhaya Vedanta is shared by both).</td></tr>
<tr><td>The Lord and the sinner</td><td>He relishes the faults of the surrendered soul as a cow licks her newborn calf.</td><td>He forgives the faults; He does not relish them.</td></tr>
<tr><td>Tilaka</td><td>Y-shaped, with a foot extending onto the nose.</td><td>U-shaped, without the foot.</td></tr>
<tr><td>Seats today</td><td>Srirangam, Vanamamalai, Azhwar Thirunagari, Sriperumbudur, Tirumala jeeyars.</td><td>Ahobila Mutt, Parakala Mutt, Andavan Ashramams; Kanchi Varadaraja temple.</td></tr>
</tbody></table>
<p>A simple way to hold it: Tenkalai guards the truth that mercy is causeless; Vadakalai guards the truth that the soul must turn to receive it. A Gaudiya will find both in his own tradition: <i>krsna-krpa</i> is causeless, and yet <i>saranagati</i> has six limbs.</p>`},
{id:'syn',title:'Sri Vaishnava and Gaudiya siddhanta: a synthesis',html:`
<p class="note">This section is written for Gaudiya devotees visiting Sri Vaishnava temples. It tries to state each side as its own teachers would. Please correct it through the feedback button.</p>
<h4>What the two share</h4>
<ul>
<li>Vishnu is the Supreme Person, with form, qualities and pastimes. Impersonal monism is rejected by both.</li>
<li>The soul is an eternal individual and by nature a servant of God.</li>
<li>Bhakti and surrender, not knowledge or ritual alone, bring the soul to Him.</li>
<li>The deity in the temple is the Lord Himself, not a symbol.</li>
<li>Service to the devotees is as dear to Him as service to Himself, or dearer.</li>
<li>The six limbs of surrender are common property. Gaudiya texts quote the same verse (<i>anukulyasya sankalpah</i>) from the Vaishnava-tantra.</li>
</ul>
<h4>Where they differ</h4>
<table><thead><tr><th></th><th>Sri Vaishnava</th><th>Gaudiya Vaishnava</th></tr></thead><tbody>
<tr><td>Vedanta</td><td>Visishtadvaita: souls and matter are the body of Brahman.</td><td>Acintya-bhedabheda: souls and matter are energies of the Lord, inconceivably one with and different from Him.</td></tr>
<tr><td>The original form</td><td>Narayana in Vaikuntha is the source; Krishna and Rama are His full avataras.</td><td>Krishna is svayam bhagavan (Srimad-Bhagavatam 1.3.28; Brahma-samhita 5.1); Narayana is His vilasa form in majesty.</td></tr>
<tr><td>The Goddess</td><td>Sri, Bhu and Nila; Andal is Bhu Devi.</td><td>Srimati Radharani is the source; Lakshmi is Her expansion in Vaikuntha.</td></tr>
<tr><td>Chief mood</td><td>Servant to master, with awe and intimacy mixed. The Azhwars also sing as mother and as beloved.</td><td>Five rasas, with the unreserved sweetness (madhurya) of Vraja held highest.</td></tr>
<tr><td>The goal</td><td>Eternal service (kainkarya) to the Divine Couple in Vaikuntha.</td><td>Loving service in Goloka Vrindavana under the gopis and their followers.</td></tr>
<tr><td>Main practice</td><td>Prapatti, temple service, recitation of the Prabandham, the three mantras.</td><td>Congregational chanting of the Holy Name, hearing Bhagavatam, deity worship.</td></tr>
<tr><td>Prime texts</td><td>Divya Prabandham, Sri Bhashya, Bhagavad-vishayam.</td><td>Srimad-Bhagavatam, Caitanya-caritamrta, the Gosvamis' works.</td></tr>
</tbody></table>
<h4>The conversation at Srirangam</h4>
<p>Caitanya-caritamrta (Madhya 9) records the friendly exchange between Mahaprabhu and Venkata Bhatta. The Lord asked, smiling: Lakshmi is the most chaste, so why did She perform austerity to join Krishna's rasa dance? And why did She not succeed, when the gopis did? Venkata Bhatta answered that Narayana and Krishna are one, so Her chastity is not broken. Mahaprabhu agreed, and added that Krishna in Vraja is approached only by following the gopis' mood, without the sense of His majesty. He concluded without a trace of rivalry: there is no difference between the forms of the Lord; the difference is in the rasa.</p>
<h4>How a Gaudiya pilgrim can enter a Divya Desam</h4>
<ul>
<li>See Sriman Narayana as the same Krishna in His aspect of majesty, and Thayar as the merciful Mother who presents you to Him. Go to Her shrine first where that is the custom.</li>
<li>Listen for Vraja in the Azhwars. Periyazhwar is Yasoda. Andal is a gopi. Nammazhwar pines as a lover in a third of his verses. Kulasekhara rocks Rama to sleep.</li>
<li>Honour the debt. Srila Prabhupada called Ramanujacharya a great acharya of the Vaishnava world; the Sri sampradaya is one of the four authorised lines; Gopala Bhatta Gosvami was born in a Srirangam priest's house; Jiva Gosvami cites Ramanuja with respect; and Hari-bhakti-vilasa draws on South Indian temple practice.</li>
<li>Follow local rules on dress, queues and what may be touched. Take sathari, tirtha and prasadam with gratitude.</li>
</ul>`},
{id:'route',title:'Sri Caitanya Mahaprabhu and Nityananda Prabhu at the Divya Desams',html:`
<p>Mahaprabhu toured South India from 1510 to 1512. Caitanya-caritamrta, Madhya-lila chapter 9, lists the holy places. Those that are Divya Desams, in the order of the text:</p>
<table><thead><tr><th>In the text</th><th>Divya Desam</th><th>Reference</th></tr></thead><tbody>
<tr><td>Ahovala-nrisimha</td><td>105 Ahobilam</td><td>Madhya 9.16 to 17</td></tr>
<tr><td>Tirupati, Tirumala, Venkata hill</td><td>106 Thiruvenkadam</td><td>Madhya 9.64 to 65</td></tr>
<tr><td>Vishnu-kanchi</td><td>43 Varadaraja, Kanchipuram</td><td>Madhya 9.69 to 70</td></tr>
<tr><td>Kumbhakarna-kapala</td><td>Kumbakonam town (12)</td><td>Madhya 9.78</td></tr>
<tr><td>Sri Ranga-kshetra</td><td>1 Srirangam</td><td>Madhya 9.79 to 165</td></tr>
<tr><td>Rishabha Hill</td><td>91 Azhagar Koil (some say; the purport says the Palni hills)</td><td>Madhya 9.166 to 173</td></tr>
<tr><td>Durvasana, temple of Ramacandra</td><td>Possibly 94 Thiruppullani (the purport places it near Ramnad)</td><td>Madhya 9.198</td></tr>
<tr><td>Naya-tripati on the Tamraparni</td><td>87 Azhwar Thirunagari and the Nava Tirupati</td><td>Madhya 9.219</td></tr>
<tr><td>Sri Vaikuntha</td><td>80 Srivaikuntam</td><td>Madhya 9.222</td></tr>
<tr><td>Adi-kesava (Brahma-samhita found)</td><td>76 Thiruvattar</td><td>Madhya 9.234 to 241</td></tr>
<tr><td>Ananta Padmanabha</td><td>75 Thiruvananthapuram</td><td>Madhya 9.241 to 242</td></tr>
<tr><td>Mathura and Gokula</td><td>102, 103</td><td>Madhya 17 and 18</td></tr>
</tbody></table>
<p class="note">Verse numbers were checked against the Bhaktivedanta Book Trust text of Madhya-lila chapter 9. The conversation with Venkata Bhatta on Lakshmi and the gopis runs from 9.111 to 9.162.</p>
<p>The text names other places in the Pandya country, such as Panagadi, Chiyadatala and Gajendra-mokshana, whose identification with particular Divya Desams is discussed by scholars and is left open here.</p>
<p><b>Sri Nityananda Prabhu</b> wandered the holy places for twenty years as a young avadhuta. Caitanya-bhagavata, Adi-khanda chapter 9, names among them Ayodhya, Naimisaranya, Mathura and Gokula, Dvaraka, Badarikasrama, Venkatanatha, Kanchi and Sri Ranga on the Kaveri.</p>`},
{id:'tips',title:'Yatra with family: practical notes',html:`
<ul>
<li><b>Hours.</b> Most Tamil Nadu temples open about 6 am to 12 noon and 4 pm to 8.30 pm. Kerala temples open earlier and close by 11 am. Small village temples may open only when the priest is called; keep the phone number from the notice board.</li>
<li><b>Dress.</b> Dhoti or pyjama-kurta for men, sari or salwar for women is accepted everywhere. In Kerala and at Thiruvattar men remove the shirt.</li>
<li><b>Season.</b> November to February is best in the south. Margazhi (mid-December to mid-January) is the month of Thiruppavai and Vaikuntha Ekadasi. The Himalayan shrines are open about May to November.</li>
<li><b>With elders.</b> Plan three or four temples a day, not eight. Sholinghur, Ahobilam upper shrines, Thiruneermalai hilltop and Muktinath involve climbing or altitude.</li>
<li><b>Order of darshan.</b> In many Sri Vaishnava temples one sees Garuda, then Thayar, then the Lord. In practice, follow the queue.</li>
<li><b>What to carry.</b> Tulasi garlands or flowers bought outside, small notes for the hundi and the priests' plate, a cloth bag for prasadam, and this app's diary to note the Lord's name before you leave the mandapam.</li>
<li><b>Sathari and tirtha.</b> The priest places the Lord's feet (sathari) on your head and gives three sips of water. Receive with the right hand cupped over the left.</li>
<li><b>Etiquette.</b> Do not pay touts for quick darshan. Ask before photographing; cameras are barred near most sanctums.</li>
</ul>`},

{id:'gloss',title:'Glossary',html:`
<dl>
<dt>Azhwar (Alvar)</dt><dd>"One who is immersed" in God. The twelve poet-saints.</dd>
<dt>Pasuram</dt><dd>A verse of the Divya Prabandham.</dd>
<dt>Mangalasasanam</dt><dd>Singing for the Lord's well-being; an Azhwar's hymn on a shrine.</dd>
<dt>Perumal, Emperuman</dt><dd>"The great One", "our Lord": Vishnu.</dd>
<dt>Thayar, Nachiyar, Piratti</dt><dd>The Mother: Lakshmi in Her shrine.</dd>
<dt>Moolavar and Utsavar</dt><dd>The fixed main deity and the processional deity.</dd>
<dt>Nindra, Irundha, Kidantha</dt><dd>Standing, sitting and reclining postures of the Lord.</dd>
<dt>Vimanam</dt><dd>The tower over the sanctum. Gopuram is the gateway tower.</dd>
<dt>Pushkarini, Theertham</dt><dd>The sacred tank or water of a temple.</dd>
<dt>Sthala purana</dt><dd>The sacred history of a place.</dd>
<dt>Pratyaksham</dt><dd>The person to whom the Lord showed Himself at that place.</dd>
<dt>Sathari</dt><dd>The crown bearing the Lord's feet, placed on the pilgrim's head; identified with Nammazhwar.</dd>
<dt>Araiyar sevai</dt><dd>Sung and gestured performance of the Prabandham by hereditary temple singers.</dd>
<dt>Garuda Sevai</dt><dd>Procession of the Lord on His eagle carrier.</dd>
<dt>Brahmotsavam</dt><dd>The main annual festival, usually nine or ten days.</dd>
<dt>Abhimana sthalam</dt><dd>A revered Vishnu temple not sung by the Azhwars, such as Guruvayur, Udupi, Melkote, Sriperumbudur or Srimushnam.</dd>
<dt>Kainkarya</dt><dd>Loving service; the goal of life for a Sri Vaishnava.</dd>
<dt>Prapatti, Saranagati</dt><dd>Surrender; taking the Lord as one's only refuge.</dd>
</dl>`}
];

2:{
 story:'The Chola king Nanda Chozhan prayed for a child, and Lakshmi appeared on a lotus in his tank. He named her Kamalavalli. When she came of age she set her heart on Ranganatha of Srirangam, and the king gave her to Him and built this temple to mark the wedding. The Lord here is Azhagiya Manavalan, "the handsome bridegroom", and both are in wedding dress (kalyana thirukkolam). There is no separate processional image of the Lord: Namperumal of Srirangam Himself comes here as the groom.',
 see:['Azhagiya Manavalan standing, facing north, discus in hand, with Kamalavalli Nachiyar seated beside Him as a bride','The shrine of Thiruppaan Azhwar, who was born in Uraiyur, with its painted walls','The pillared walkway and the five-tier tower','Kalyana Pushkarini and Surya Pushkarini'],
 customs:['Thayar has precedence here, as at Nachiyar Koil, Thiruvellarai and Thiruthevanar Thogai.','The compound wall is attributed to Kulasekhara Azhwar, who ruled this region.','The Lord\'s feet are seen only on Fridays, when Thayar goes out in procession.'],
 festivals:'Panguni (March to April): the birth of Kamalavalli and her wedding with the Lord of Srirangam are enacted, and Namperumal crosses the Kaveri to Uraiyur.',
 when:'In Woraiyur, a suburb of Tiruchirappalli, about 3 km from Srirangam. Combine with Srirangam on the same day.',
 gaudiya:'Thiruppaan Azhwar, born here in a community kept outside the temple, was carried into Srirangam on the priest\'s shoulders by the Lord\'s own order. It is the Sri Vaishnava counterpart of the teaching that devotion, not birth, makes a Vaishnava.'
},
3:{
 story:'Vishnu, wishing to test Brahma\'s devotion, took the form of a kadamba tree here. Brahma recognised Him and bathed the tree in worship; the water filled a tank that became Kadamba Theertham, and Brahma was granted a shrine of his own. Later Shiva, wandering as a beggar with Brahma\'s skull fixed to his hand, came here and Lakshmi filled his bowl, which for once did not empty. So all three of the Trimurti, with their consorts, are worshipped in one compound. The place is Uthamar Koil, the temple of the Supreme Person, and also Bhikshandar Koil and Kadamba Kshetram.',
 see:['Purushottaman reclining on Adisesha, facing east, His right hand under His head as a pillow','Poornavalli Thayar','The shrine of Shiva as Bhikshandar directly behind the Vishnu sanctum, with Soundarya Parvati','The shrine of Brahma with its gilded doorway, and Saraswati shown without her vina','Paintings of the ten avataras along the corridor'],
 customs:['Two flagstaffs stand in one temple, one for Vishnu in front and one for Shiva behind.','In Karthigai the processional deities of Vishnu and Shiva go round the streets together.','Tradition credits King Janaka, father of Sita, with building the first temple. There is no main tower.'],
 festivals:'Brahmotsavam in Karthigai (November to December); the chariot festival in Chithirai (April to May).',
 when:'About 12 km from Tiruchirappalli on the Salem road, just across the Kollidam from Srirangam.',
 gaudiya:'Sri Vaishnavas and Gaudiyas alike honour Lord Shiva as the greatest Vaishnava (vaisnavanam yatha sambhuh, Srimad-Bhagavatam 12.13.16). Here he is seen exactly so: a mendicant who receives his meal from Lakshmi and worships Purushottama.'
},
4:{
 story:'The name means "white rock", after the pale outcrop on which the temple stands like a fort, about fifty feet above the plain. King Sibi camped here and chased a white boar that vanished into a burrow. The sage Markandeya, in penance nearby, heard his account, and through their worship the Lord revealed Himself. The temple is held to be older than Srirangam. Pallava inscriptions of Nandivarman II and Dantivarman survive, with rock-cut caves beside the temple.',
 see:['Pundarikakshan standing, facing east, holding the discus, with the Sun and Moon fanning Him and Garuda and Adisesha in human form on either side','Shenbagavalli (Pankajavalli) Thayar, who wears a garland of salagrama stones','The two doorways to the sanctum: Uttarayana Vasal, used from mid-January to mid-June, and Dakshinayana Vasal for the other half of the year','The Swastika-shaped temple tank in the south-west corner, built around 800 CE','The unfinished main tower, and pillar carvings of Krishna dancing on a pot'],
 customs:['Thayar has precedence over the Lord in processions and honours.','Eighteen steps to the shrine stand for the eighteen chapters of the Bhagavad-gita; four steps at the tower for the Vedas; five near the altar for the elements.','The Lord is called Mayavan during Dakshinayana and Thai Mada Nayagan during Uttarayana.'],
 festivals:'Chithirai Brahmotsavam with the chariot festival (April to May); Panguni festival.',
 when:'About 25 km from Tiruchirappalli on the Thuraiyur road. Allow an hour and a half; the climb is gentle.',
 gaudiya:'Periyazhwar\'s verses here are sung as Yasoda calling little Krishna to come at dusk and have protective charms tied on: pure vatsalya in a hill fort of the Pallavas.'
},
5:{
 story:'The sage Manduka was meditating under the water when Durvasa came to see him and, kept waiting, cursed him to become a frog. Manduka continued his penance in the pond until Vishnu appeared and freed him, so the place is Manduka-puri and the tank Manduka Theertham. The name Anbil is from anbu, love: the temple built for love of God. Shiva too passed this way with Brahma\'s skull on his hand, between Uthamar Koil, where Lakshmi fed him, and Kandiyur, where he was finally released.',
 see:['Vadivazhagiya Nambi, "the Lord of perfect form", reclining on Adisesha (bhujanga sayanam) and facing east','Sri Devi and Bhu Devi seated at His feet, so that the feet themselves are hidden','Azhagiyavalli Thayar; Andal standing in the front hall','The three-tier east-facing tower on the north bank of the Kollidam'],
 customs:['The western part of the village is Vishnu\'s and the eastern part Shiva\'s, and both communities revere the place.','It is called Triveni, for the Kaveri and two unseen rivers, Savitri and Phalguni, said to meet here.','Chola copper plates found here record royal gifts to the temple.'],
 festivals:'Masi Theerthavari (February to March); Vaikuntha Ekadasi.',
 when:'About 25 km from Tiruchirappalli and 8 km from Lalgudi. Hours are short; go in the morning. Koviladi (6) lies just across the river.',
 gaudiya:'The chain Uthamar Koil, Anbil, Kandiyur follows Shiva\'s pilgrimage to be freed of an offence. Even the greatest personalities seek the shelter of Vishnu.'
},
20:{
 story:'In an earlier age three demons, Thanjakan, Thandakan and Gajamukhan, won from Shiva the boon that only he could cause their death, and then tormented the sages. The sages turned to Vishnu, who took forms including Narasimha and destroyed all three. The place took the name of Thanjakan and became Thanjavur. The three spots where the demons fell are three temples close together on the bank of the Vennaru, sung together as one Divya Desam.',
 see:['Neelamegha Perumal seated, with Senkamalavalli Thayar: the Mamani Koil proper','Veera Narasimha seated, with Thanjai Nayaki: Thanjai Yali Koil','Manikundra Perumal seated, with Ambujavalli','A pillar with Yoga Narasimha on one face and Hanuman on the other; shrines of Lakshmi Narasimha and Vedanta Desika'],
 customs:['All three sanctums face east and the Lord is seated in each.','The Garuda Sevai of Thanjavur brings the Perumals of many temples of the town together in one procession.','The vimanam of the Mamani Koil is called Soundarya Vimanam for its carving.'],
 festivals:'The three temples hold Brahmotsavam in turn through Panguni, Chithirai and Vaikasi (March to June).',
 when:'About 4 km from Thanjavur station. Visit all three in one stop; ask the priest of one to open the next.',
 gaudiya:'The Azhwars gave these shrines only a verse or two, yet the Lord counts it. One sincere verse makes a place a Divya Desam.'
}

/* Short hand-written profiles (v3) for the temples without a long profile, and the "blessed by the Lord" index.
