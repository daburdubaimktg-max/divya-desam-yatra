:root{
  /* layout: phone-first single column; maroon-and-gold header band like a temple doorway; photographs lead every temple */
  --bg:#fbf4e6; --surface:#fffdf7; --ink:#2a1812; --muted:#7b6352; --accent:#8a1c2c; --gold:#c08a12; --rose:#0f6e73; --line:#ead7b6; --tint:#f5e6c8;
  --head:#6d1422; --head2:#4a0c17; --headink:#ffe7b0;
  --display:'Marcellus','Noto Serif Tamil',Georgia,serif; --body:'Mukta','Noto Sans Tamil',system-ui,-apple-system,sans-serif; --tamil:'Noto Serif Tamil','Mukta',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#160e0c;--surface:#231714;--ink:#f4e8d6;--muted:#b9a48f;--accent:#f0b25e;--gold:#e8b548;--rose:#5cc7c1;--line:#3b2a22;--tint:#2e201a;--head:#3f0e18;--head2:#24070d;--headink:#ffe1a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#160e0c;--surface:#231714;--ink:#f4e8d6;--muted:#b9a48f;--accent:#f0b25e;--gold:#e8b548;--rose:#5cc7c1;--line:#3b2a22;--tint:#2e201a;--head:#3f0e18;--head2:#24070d;--headink:#ffe1a0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body.big{font-size:19.5px}
#app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,var(--head),var(--head2));border-bottom:3px solid var(--gold);color:var(--headink)}
header button{background:transparent;color:var(--headink);border-color:color-mix(in srgb,var(--headink) 45%,transparent)}
header h1{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0;flex:1;text-wrap:balance;line-height:1.2}
header button{flex:none}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:9px 2px 8px;font-size:.74rem;color:var(--muted);text-decoration:none;letter-spacing:.02em;border-top:3px solid transparent}
nav a svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--accent);border-top-color:var(--gold);font-weight:600}
h2{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0 0 4px;text-wrap:balance;line-height:1.2}
h3{font-family:var(--display);font-weight:400;font-size:1.12rem;margin:22px 0 8px;color:var(--accent)}
h4{font-size:1rem;margin:16px 0 6px}
p{margin:0 0 10px;max-width:65ch}
a{color:var(--accent)}
.ta{font-family:var(--tamil)}
.muted{color:var(--muted)} .small{font-size:.86rem}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--accent);color:var(--surface);border-color:var(--accent)}
button.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input[type=text],input[type=search],input[type=date],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:92px;resize:vertical}
label{display:block;font-size:.86rem;color:var(--muted);margin:10px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.count{margin:6px 0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.t{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:inherit}
.t .n{font-family:var(--display);font-size:1.15rem;color:var(--gold);font-variant-numeric:tabular-nums;text-align:center;border-right:1px solid var(--line);padding-right:8px;line-height:1.3}
.t .n small{display:block;font-family:var(--body);font-size:.62rem;color:var(--muted);letter-spacing:.04em}
.t b{font-weight:600;display:block;line-height:1.25}
.t .sub{font-size:.86rem;color:var(--muted);line-height:1.35}
.pill{display:inline-block;font-size:.74rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;white-space:nowrap;background:var(--tint)}
.pill.v{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.pill.w{border-color:var(--gold);color:var(--gold);background:transparent}
.pill.g{border-color:var(--rose);color:var(--rose);background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a,.chips span{font-size:.84rem;border:1px solid var(--line);border-radius:99px;padding:2px 10px;text-decoration:none;color:var(--ink);background:var(--surface)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px}
.ring text{font-family:var(--display);fill:var(--ink)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:.86rem;margin-top:6px}
.bar{height:7px;background:var(--tint);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tiles a{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;text-decoration:none;color:inherit;line-height:1.3}
.tiles a b{display:block}
.tiles a span{font-size:.82rem;color:var(--muted)}
.pearl{border-left:3px solid var(--gold);padding:4px 0 4px 14px;margin:12px 0;font-size:1.04rem}
dl.facts{display:grid;grid-template-columns:minmax(92px,auto) 1fr;gap:6px 14px;margin:12px 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
dl.facts dt{color:var(--muted);font-size:.86rem;padding-top:2px}
dl.facts dd{margin:0}
dl:not(.facts) dt{font-weight:600;margin-top:8px} dl:not(.facts) dd{margin:0 0 4px;color:var(--muted)}
ul{padding-left:20px;margin:0 0 10px;max-width:65ch} li{margin-bottom:5px}
.verse{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--rose);border-radius:10px;padding:14px;margin:10px 0}
.verse .ref{font-size:.86rem;color:var(--muted);margin-bottom:8px}
.verse pre{font-family:var(--tamil);white-space:pre-wrap;margin:0 0 10px;font-size:1.05rem;line-height:1.75}
.verse pre.tr{font-family:var(--body);font-style:italic;font-size:.96rem;line-height:1.55;color:var(--muted)}
.verse .draft{font-size:.76rem;color:var(--rose);letter-spacing:.03em;text-transform:uppercase;margin-bottom:2px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.note{font-size:.88rem;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.gbox{border-left:3px solid var(--rose);padding-left:14px;margin:12px 0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font-size:.9rem;min-width:520px;margin:8px 0 12px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--tint);font-weight:600}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:0 14px}
details summary{font-family:var(--display);font-size:1.08rem;padding:12px 0;cursor:pointer}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
.pn{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem;z-index:9}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{border:1px solid var(--accent);border-radius:8px;padding:7px 12px;text-decoration:none;font-size:.92rem;background:var(--surface)}
@media (max-width:400px){.hero{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){main{scroll-behavior:smooth}}

h3{color:var(--accent)}
.t .th{width:72px;height:72px;object-fit:cover;border-radius:8px;background:var(--tint);display:block}

.t .side{grid-column:2}
.num{color:var(--gold);font-family:var(--display);font-variant-numeric:tabular-nums;margin-right:2px}

.wk{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--rose);border-radius:10px;padding:12px 14px}

.hero{border-top:3px solid var(--gold)}
.pearl{font-family:var(--display);font-size:1.12rem;line-height:1.45}
.chips a.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.bigbtn{display:block;text-align:center;background:var(--accent);color:var(--surface);padding:11px;border-radius:10px;text-decoration:none;font-weight:600}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;max-height:70vh}
.dot{cursor:pointer}
.dot circle{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.dot text{text-anchor:middle;font-family:var(--body);font-weight:600;fill:var(--accent);pointer-events:none}
.dot.v circle{fill:var(--accent)} .dot.v text{fill:var(--surface)}
.dot.w circle{fill:var(--gold);stroke:var(--gold)} .dot.w text{fill:var(--surface)}
.dot.sel circle{stroke:var(--rose);stroke-width:6}
.city rect{fill:var(--muted);opacity:.55}.city text{font-family:var(--body);font-size:30px;fill:var(--muted)}
.lg{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--accent);vertical-align:-1px;margin-left:6px}
.lg.v{background:var(--accent)}.lg.w{background:var(--gold);border-color:var(--gold)}
nav a.on{color:var(--accent)}

.pop img{width:100%;height:110px;object-fit:cover;border-radius:6px;margin-bottom:6px;display:block}
.pop{font-family:var(--body);color:#2a1812}.pop .small{font-size:.8rem;color:#6d5a48}
.poplinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.poplinks a{border:1px solid #8a1c2c;color:#8a1c2c;border-radius:6px;padding:4px 8px;text-decoration:none;font-size:.82rem}
.leaflet-container{font-family:var(--body)}

.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}.chips.scrollx a{white-space:nowrap}

.refs{margin:6px 0 8px;padding-left:18px}.refs li{margin-bottom:4px}

.ck{display:flex;flex-direction:column;gap:2px}
.ckrow{display:grid;grid-template-columns:24px 34px 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);color:var(--ink);font-size:.95rem;margin:0}

.qopt{text-align:left;padding:11px 12px;font-size:1rem}
.qopt.ok{background:#2f7a3a;color:#fff;border-color:#2f7a3a}.qopt.no{background:#a3253a;color:#fff;border-color:#a3253a}

const WIKI = {"1":{"t":"Ranganathaswamy_Temple,_Srirangam","d":"The Srirangam temple is often listed as the largest functioning Hindu temple in the world. The temple occupies an area of 156 acres (631,000 m2) with a perimeter of 4,116m (10,710 feet) making it the largest temple in India and one of the largest religious complexes in the world. The annual 21 day festival of Vaikuntha Ekadashi, conducted during the Tamil month of Margaḻi (December–January) attracts 1 million visitors. The temple legend (Sthalapuranam) says that the Vishnu idol was first worshipped by Lord Brahma, then Ikshvaku, then Lord Rama and then gifted to Vibhishana.","x":"The Ranganathaswamy Temple, also known as Arulmigu Ranganathar Thirukovil, is a Hindu temple dedicated to Ranganathar (a form of Vishnu) and his consort Ranganayaki (a form of Lakshmi). The temple is located in Srirangam, Tiruchirappalli, Tamil Nadu, India. Constructed in the Tamil architectural style, the temple is glorified by the Tamil poet-saints called the Alvars in their canon, the Naalayira Divya Prabhandham, and has the unique distinction of being the foremost among the 108 Divya Desams dedicated to the god Vishnu. The Srirangam temple stands as the largest functioning religious complex in the world in active worship with a continuous historical presence as a Hindu temple. Some of these structures have been renovated, expanded, and rebuilt over the centuries as a living temple. The latest addition is the outer rajagopuram (tower) that is approximately 73 metres (240 ft) tall, which was completed in 1987 with support from the Ahobila Mutt among others.","la":10.8625,"lo":78.6897,"tw":"Pranavakara Vimanam.","fs":"Vaikuntha Ekadashi; Uriyadi; Jeeyarpuram","cr":"Early Cholas, Medieval Cholas, Later Cholas, Pandyas, Hoysala, Vijayanagara Empire","ws":"https://srirangamranganathar.hrce.tn.gov.in/","ins":"over 600","ia":"Rainer Halama","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Srirangam-Ranganathaswamy_Temple-WUS03687.jpg"},"2":{"t":"Azhagiya_Manavala_Perumal_Temple","d":"The temple is locally called Nachiyar Koil (to be distinguished from Thirunaraiyur) and is one of the few Divya Desams where the goddess is offered prominence over Vishnu. This temple has no procession idol (utsavar) for Vishnu, as it is believed that the Srirangam idol is the utsavar of Uraiyur. Goddess Lakshmi is worshipped as Kamalavalli The temple is the birthplace of Thiruppaan Alvar, one of the twelve Alvars. In Srirangam, the yearly birth festival of Thiruppaan Alvar is celebrated with the Vishvarupa Darshanam of Ranganatha at the sanctum on the occasion of his birthday. The utsavar of Tiruppan Alvar is taken from the temple to Srirangam.","x":"Azhagiya Manavalan Perumal Temple (also called Thirukozhi or Nachiyar Koil) in Uraiyur, a suburb Tiruchirappalli in the south Indian state of Tamil Nadu, is dedicated to the Hindu God Azhagiya Manavalan (Vishnu) and Goddess Kamalavalli (Lakshmi). Constructed in the Dravidian style of architecture, the temple is glorified in the Divya Prabandha, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divyadesam dedicated to Lakshmi Narayana. The temple is believed to have been built by the Medieval Cholas of the late 8th century CE, with later contributions from later Pandyas, Vijayanagar kings and Madurai Nayaks. As per Hindu legend, Azhagiya Manavalan appeared to Kamalavalli, the daughter of Chola king Nanda Cholan, in this place to marry her. A granite wall surrounds the temple, enclosing all its shrines and bodies of water. The temple has a five-tiered rajagopuram, the temple's gateway tower.","la":10.82,"lo":78.67,"cr":"Cholas","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Nachiyar4.jpg"},"3":{"t":"Uthamar_Kovil","d":"This rare temple is dedicated to the Hindu Trimurti (trinity) namely Vishnu, Shiva, and Brahma. According to Hindu legend, the temple is believed to have been constructed by Janaka, the king of Mithila and the father of Sita from the epic Ramayana. Tirumangai Alvar is believed to have resided in the temple to build the surrounding walls of the Srirangam Ranganathaswamy temple.","x":"Uthamar Kovil (also known as Thirukkarambanoor or Bhikshandar Kovil) in Uthamarkoil, a village in the outskirts of Tiruchirappalli in the Indian state of Tamil Nadu, is a temple to the Hindu Trimurti of Vishnu, Shiva, and Brahma. Constructed in the Dravidian style of architecture, the temple is mentioned in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Purushothaman Perumal (also called as Purushothamar) and his consort Lakshmi as Poornavalli Thayar. Purushottamar is believed to have appeared to Hindu gods Brahma and Shiva, to relieve Shiva off his sins committed while cutting one of Brahma's heads. The temple is one of the few historical temples in India where the images of the Trimurti, Vishnu, Shiva and Brahma are housed in the same premises. It is one of the two temples in Chola Nadu where the trinity can be seen in the same premises, the other being Hara Saabha Vimocchana Perumal Temple at Thirukkandiyur.","la":10.49,"lo":78.81,"cr":"Cholas","ia":"Mohan Krishnan (talk)","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Uthamarkoil1.jpg"},"4":{"t":"Pundarikakshan_Perumal_Temple","d":"The Pundarikakshan Perumal temple is believed to have been built by the Pallava king Dantivarman (796–847 CE). A swastika-shaped temple tank built during 800 CE is present in the south-western corner of the street around the temple. It has four stepped gateways, each having 51 steps. The tank is believed to have been built by Kamban Araiyan during the reign of Dantivarman. In modern times, it is maintained by the Department of Archaeology of the Government of Tamil Nadu. The temple complex covers an area of 2.62 ha (6.5 acres), while the tank covers an area of 0.1256 ha (0.310 acres).","x":"The Pundarikakshan Perumal Temple or Thiruvellarai Temple in Thiruvellarai, a village in the outskirts of Tiruchirappalli in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Pundarikakshan and his consort Lakshmi as Pankajavalli. According to legends, the temple is said to have been built by Sibi Chakravarthy. The temple has three inscriptions in its two rock-cut caves, two dating from the period of Nandivarman II (732–796 CE) and the other to that of Dantivarman (796–847). It also has Pallava sculptural depictions of Narasimha and Varaha, two of the ten avatars of Vishnu. A granite wall surrounds the temple, enclosing all its shrines and six of its seven bodies of water. The rajagopuram, the temple's gateway tower, is unfinished.","la":10.96,"lo":78.67,"tw":"Vimalaakkruthi Vimanam","cr":"Cholas","ia":"Mohan Krishnan (talk)","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Tiruvellarai1.jpg"},"5":{"t":"Sundararaja_Perumal_temple","d":"King Sundara Chola, who ruled the area, was a devotee of the temple, and during each of his innumerable victories in wars, he showered a lot of wealth on this temple. His prime minister Anirudha Brahmarayar is believed to be from Anbil, the village where the temple is located. The copper plates having the records from the Chola period from Anbil indicate generous contribution from the Medieval Cholas indicate various gifts to the temple.","x":"Thiru Anbil, or Sundararaja Perumal Temple (also called Vadivazhagiya Nambi Perumal Temple), in Anbil, a village in the outskirts of Tiruchirappalli in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Sundararajan and his consort Lakshmi as Sundaravalli. The temple is believed to have been built by the Medieval Cholas of the late 8th century CE, with later contributions from Vijayanagara kings and Madurai Nayaks. The copper plate inscriptions from Anbil indicate generous contribution by the Chola kings to the temple. A granite wall surrounds the temple, enclosing all its shrines and bodies of water. The rajagopuram, the temple's gateway tower, is east facing and has a 3-tier structure. The temple is located on the banks of river Kollidam.","la":10.8677,"lo":78.8822,"tw":"Tharaga Vimanam","tk":"Manduka Theertham","cr":"Cholas","ia":"Mohan Krishnan (talk)","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Tiruanbil4.jpg"},"6":{"t":"Appakkudathaan_Perumal_Temple","d":"The temple has inscriptions from the 18th year of the reign of Aditya Chola. The temple is one of the five Pancharanga Kshetrams, a group of five Hindu temples on the banks of the Kaveri River dedicated to Ranganatha, a form of Vishnu.","x":"Appakkudathaan Perumal Temple or Thirupper Nagar, is a Perumal temple located in Koviladi, a village 10 miles (16 km) from Tiruchirapalli, Tamil Nadu, India. It is dedicated to Vishnu and is one of the Divya Desams—the 108 temples of Vishnu revered in Nalayira Divya Prabandham by the 12 poet saints or Alvars. This temple is located along the banks of the Cauvery River and is one of the five Pancharanga Kshetrams located on the banks of the Cauvery River. The temple is believed to be of significant antiquity, with contributions at different times from the Medieval Cholas. The temple is built on an elevated structure and is approached through a flight of 21 steps. The rajagopuram (the main gateway) has three tiers and the temple has a precinct around the sanctum. Ranganatha is believed to have appeared for king Upmananya and sage Parasara. The temple has four daily rituals; the first begins at 8:30 a.m. and the last at 8 p.m.","la":10.8393,"lo":78.8891,"cr":"Karikala Chola, Medieval Cholas","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Koviladi1.jpg"},"7":{"t":"Hara_Saabha_Vimocchana_Perumal_Temple","d":"Since Vishnu relieved (vimochana) the curse (shāpa) of Shiva (also called Hara), the temple is called Hara Sābha Vimochana Temple.","x":"Hara Saabha Vimochana Perumal Temple in Thirukandiyur, a village in the outskirts of Thiruvayaru in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desam dedicated to Vishnu, who is worshipped as Hara Saabha Vimochana Perumal and his consort Lakshmi as Kamalavalli Nachiyar. The temple is believed to have been built by the Medieval Cholas of the late 8th century CE, with later contributions from Vijayanagara kings and Madurai Nayaks. A granite wall surrounds the temple, enclosing all its shrines and its bodies of water. The temple has a 5-tiered rajagopuram, the temple's gateway tower. Hara Saabha Vimochana Perumal is believed to have appeared to Hindu gods Brahma and Shiva, and King Mahabali. It is one of the few temples where the Trimurti - Brahma, Vishnu and Shiva are worshipped in the same premises.","la":10.8603,"lo":79.1089,"tk":"Kapala Moksha Pushkarani","ia":"Jamstechs","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Hara_Saabha_Vimochana_Perumal_.jpg"},"8":{"t":"Thirukkoodaloor","d":"The river goddess Kaveri wanted to cleanse herself, and approached the Hindu god Brahma, who advised her to worship Vishnu. She is believed to have worshipped Vishnu at this place, and received relief. A parrot that was devoted to Vishnu was shot down in the nearby forest. Vishnu rescued the parrot and apprised him of his previous birth. Thus, it is believed that Vishnu descends here for all forms of life. Vishnu is also believed to have appeared for sage Nandaka.","x":"The Jagad Rakshaka Perumal Temple or Thirukoodalur (locally called Aduthurai Perumal Temple) in Vadakurangaduthurai, a village in the outskirts of Kumbakonam in the Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is mentioned in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Jakath Rakshaka and his consort Lakshmi as Pushpavalli. The temple is believed to have been built by the Medieval Cholas of the late 8th century CE, with later contributions from Vijayanagara kings and Madurai Nayaks. A brick wall surrounds the temple, enclosing all its shrines and bodies of water. Jakath Rakshaka is believed to have appeared to the sage Nandaka and King Ambarisha. The temple is maintained and administered by the Hindu Religious and Endowment Board of the Government of Tamil Nadu.","la":10.9252,"lo":79.2035,"tw":"Suddha Satwa Vimanam","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Aduthurai_perumal1.jpg"},"9":{"t":"Gajendra_Varadha_Temple","d":"Based on Gajendra Moksha, Vishnu is believed to have saved Gajendra the elephant also called Indradyumna, from the crocodile called Huhu. This temple was Sage Parasara and Lord Hanuman. The temple is one of the Panchakanna (Krishnaranya) Kshetrams, the five holy temples associated with Krishna, an avatar of Vishnu.","x":"The Gajendra Varadha Perumal Temple in Thirukkavithalam, a village in the outskirts of Papanasam in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Gajendra Varadha Perumal and his consort Lakshmi as Ramamanivalli. The temple is one of the five Pancha-Kannan temples, where Krishna, an avatar of Vishnu is given prominence over the presiding deity. The temple is believed to have been built by the Medieval Cholas of the late 9th century CE, with later contributions from Vijayanagara kings and Madurai Nayaks. A granite wall surrounds the temple, enclosing all its shrines and its bodies of water. Gajendra Varada is believed to have appeared to Gajendra the elephant also called Indrajumnan, the crocodile called Kuhu, Sage Parasara, and Anjaneya.","la":10.9469,"lo":79.2565,"tw":"Gajanakriti","tk":"Gajendra, Kapila","ia":"Sundarstravels","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:009_-_Thiru_Kavithalam.jpg"},"10":{"t":"Thirupullabhoothangudi_Temple","d":"Rama is believed to have appeared for Sita, and the temple is believed to be the place where Rama performed the last rites of the eagle king Jatayu.","x":"Thirupullabhoothangudi Temple is a Hindu temple dedicated to Vishnu located in Pullabhoothangudi near Kumbakonam in the South Indian state of Tamil Nadu. Constructed in South Indian Style of Architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is counted as one among the 108 Divya Desams dedicated to Vishnu. Vishnu is worshiped as Valvil Ramar and his consort Lakshmi as Sita. The temple has a small shrine with Vimanam and five-tier rajagopuram. The temple was built by Medieval Cholas with additions from later kings. The temple is located in Pulla Bhoothangudi, a small village, 8 km away from Kumbakonam and 3 km from Swamimalai. The temple tank is located north of the temple. Kolavalli Ramar is believed to have appeared for Sita and the temple is believed to be the place where Rama performed the last rites of the eagle king Jatayu. The temple has six daily rituals at various times from 7:30 a.m. to 8 p.m., and four yearly festivals on its calendar.","la":10.9716,"lo":79.3034,"tw":"Sopana","tk":"Jatayu","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Pullabhoothangudi_(11).jpg"},"11":{"t":"Thiru_Aadanoor_Temple","d":"Vishnu is worshipped as Andalukkum-aiyyan and is believed to have appeared for an affluent devotee trying to save his idol. It is also believed that the presiding deity appeared for Kamadhenu, the divine cow, and also for Tirumangai Alvar, the saint poet of the 8th century.","x":"The Thiru Aadanoor or the Andalakkum Aiyan Perumal Temple is a Hindu temple dedicated to Vishnu located in Aadanoor, Thanjavur district in Tamil Nadu, India. Constructed in Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is counted as one among the 108 Divya Desams dedicated to Vishnu. Vishnu is worshipped as Andalakkum Aiyan and his consort is worshipped as Ranganayaki, a form of Lakshmi. The temple has a small shrine with Vimanam and 3-tier rajagopuram. The temple was built by Aditya Chola. The temple is located in Olaipadi, a small village, 7 km away from Kumbakonam and 2 km from Swamimalai. The temple tank is located north of the temple. The deities are similar to the Sri Ranganathaswamy temple of Srirangam with the chief deity Vishnu in a reclining, half-sleeping posture.","la":10.9765,"lo":79.3135,"tw":"Pranava","tk":"Surya","ia":"பா.ஜம்புலிங்கம்","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Adhanur_perumal.jpg"},"12":{"t":"Sarangapani_Temple","d":"The temple is called Ubaya Pradhana Kshetram as the mulavar (presiding deity) and utsavar (festive deity) enjoy the same importance. It is believed that the presiding deity asked Nathamuni to compile the four thousand verses of Naalayira Divya Prabandham at this place. The twin temple chariots weigh 300 t (660,000 lb) each and are next only in size to the ones in Thyagaraja temple in Thiruvarur and Andal Temple in Srivilliputhur. This temple is along Kaveri and is one of the Pancharanga Kshetrams.","x":"The Sharngapani Temple, also known as Thirukudanthai or Kumbakonam koyil, is a Hindu temple dedicated to Vishnu, located in Kumbakonam, Tamil Nadu, India. It is one of the Divya Desams, the 108 temples of Vishnu revered in Nalayira Divya Prabandham by the 12 poet-saints, or Alvars. Situated along the Kaveri river, it is counted among the Pancharanga Kshetrams. The temple is one of the Pancha Kshethram sites, associated with the legend where the goddess Lakshmi was born as Bhargavi, the daughter of Maharishi Bhrigu. The other four temples forming the Pancha Kshethram are the Sundararaja Perumal Temple in Salem, Oppiliappan Temple, Nachiyar Koil and the Venkateswara Temple in Tirumala. The temple is believed to be of significant antiquity with contributions at different times from Medieval Cholas, Vijayanagara Empire and Madurai Nayaks. The temple is enshrined within a huge granite wall and the complex contains all the shrines and the water bodies of the temple. The rajagopuram (the main gateway) has eleven tiers and has a height of 173 ft (53 m).","la":10.9596,"lo":79.375,"cr":"Cholas","ia":"Adam Jones Adam63","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Gopuras_in_Kumbakonam_-_India.JPG"},"13":{"t":"Uppiliappan_Temple","d":"It is believed that Vishnu appeared as Uppiliappan to marry sage Hemarishi's daughter, who was Lakshmi's reincarnation. Since the sage stated that his girl was too young to offer him food with salt, Vishnu agreed to accept an offering without salt, hence the name Uppiliappan (the one who does not eat salt)","x":"Oppiliappan Temple, is a Hindu temple dedicated to Vishnu, located near Thirunageswaram and also known by its old toponym Thiruvinnagar, a village in the outskirts of the Kumbakonam in the South Indian state of Tamil Nadu. Constructed in the Dravidian style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is counted as the 60th of the 108 Divya Desams dedicated to Vishnu. Vishnu is worshiped as Oppiliappan and his consort Lakshmi as Bhudevi. The temple is one of the Pancha Kshethram, where Lakshmi was born as Bhargavi, the daughter of the sage Bhrigu. The temple is believed to be of significant antiquity and to have been initiated by the Medieval Cholas of the late 8th century CE, with later contributions at different times from Thanjavur Nayaks. The temple has two inscriptions dating from the Chola period, a five-tiered rajagopuram (gateway tower), and a granite wall. The complex contains all the shrines and water bodies associated with it.","la":10.9616,"lo":79.4321,"tw":"Suddhananda Vimana","tk":"Ahoraathra Pushkarani","fs":"Rama Navami, Vaikuntha Ekadasi, Sravanam Festival","ws":"http://www.oppiliappanswamytemple.tnhrce.in/","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Uppiliappan_koil3.JPG"},"14":{"t":"Thirunarayur_Nambi_Temple","d":"According to local lore, Vishnu was of the view that during Kali Yuga, men would have to listen to women. Hence, he decided that he would first set an example and listen to the goddess here. During all festive occasions, the first rights are reserved for Goddess Lakshmi as Vanchulavalli, who moves ahead, while Vishnu as Srinivasa follows her. Even the food is first served to Lakshmi, and then to Srinivasa. The stone Garuda image in the temple used during the festive occasions is believed to increase in weight seeking 4, 8, 16, 32, 64, and 128 people in succession when the procession comes out of various gates from the sanctum to the main entrance of the temple.","x":"Nachiyar Kovil or Thirunarayur Nambi Temple is a Sri Vaishnava Hindu temple in Thirunarayur, a village in the outskirts of Kumbakonam in the southern Indian state of Tamil Nadu. It is dedicated to Niladevi, an aspect of the goddess Lakshmi, and her consort Vishnu. Nachiyar Koil is one of the divyadesams where Lakshmi is pradahana (main deity) over Vishnu. Thirunaraiyur is the sub urban region of business city of Kumbakonam. Constructed in the Dravidian style of architecture, the temple is glorified in the Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th to 9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Srinivasa Perumal and his consort Lakshmi as Nachiyar. The temple is the place where god Vishnu is believed to have initiated Pancha Samskara (religious initiation) to Thirumangai Alvar. The temple follows the Tenkalai mode of worship, and the priests follow the Tenkalai tradition.","la":10.9158,"lo":79.4456,"cr":"Kochengat Cholan","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Nachiyar_Kovil_(13).jpg"},"15":{"t":"Tirucherai_Saranathan_Temple","d":"Saranathan is believed to have appeared to the river goddess Kaveri, sage Markandeya, and the heaven king Indra. The crown of some of the idol from the Chola period show the influence of Buddhism in the region. The metal image of Sita is believed to be a classic example of Chola Art during the 9th-10th centuries.","x":"The Saranathan Temple in Thirucherai, a village on the outskirts of Kumbakonam in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. The temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Saranathan and his consort Lakshmi as Saranayaki. It is believed that Saranathan appeared for Kaveri, the river goddess, who performed penance at this place. The temple is believed to be of significant antiquity with contributions at different times from Medieval Cholas, the Vijayanagara Empire and Madurai Nayaks. A granite wall surrounds the temple, enclosing all its shrines and three of the four bodies of water. The rajagopuram, the temple's gateway tower has five tiers and raises to a height of 120 ft (37 m). The temple is unique where the presiding deity Vishnu has five consorts. It has also a shrine dedicated to the river Kaveri, which is a unique feature among all Vishnu temples.","la":10.8791,"lo":79.4544,"tw":"Sara Vimanam","tk":"Sara Pushkarani","fd":"Standing","cr":"Cholas","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thirucherai_temple_tank_(1).jpg"},"16":{"t":"Bhaktavatsala_Perumal_temple,_Tirukannamangai","d":"The temple is one of the Panchakanna (Krishnaranya) Kshetrams, the five holy temples associated with Krishna, an avatar of Vishnu. The temple also has a statue of the Buddha worshipped in the shrine.","x":"The Bhaktavatsala Perumal Temple is a temple dedicated to Hindu god Vishnu, located in Thirukannamangai, a village in Tiruvarur district in the South Indian state of Tamil Nadu. Constructed in Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is counted as one among the 108 Divya Desams dedicated to Vishnu. Vishnu is worshipped as Bhaktavatsala Perumal and his consort Lakshmi as Kannamangai Nayagi. The temple is believed to be of significant antiquity and is believed to be initiated by the Medieval Cholas of the late 9th century CE, with later contributions at different times from Thanjavur Nayaks. The temple has three inscriptions dating from the Chola period. The temple has a five-tiered rajagopuram (gateway tower) and enshrined within a granite wall. The complex contains all the shrines and the temple tank is located outside the main entrance of the temple. Bhaktavatsala Perumal is believed to have appeared to marry his consort Lakshmi in the place.","la":10.7996,"lo":79.5866,"tw":"Utpala","tk":"Darshana","fs":"Brahmothsavam Chithrai Month","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thirukannamangai2.JPG"},"17":{"t":"Neelamegha_Perumal_Temple","d":"The idol of Vishnu is depicted with silky hair at this locale. Legend has it that he grew the hair to safeguard his devotee's words. The temple is one of the Panchakanna (Krishnaranya) Kshetrams, the five holy temples associated with Krishna, an avatar of Vishnu.","x":"The Neelamegha Perumal Temple or Sowriraja Perumal Temple is a Hindu temple in Thirukannapuram, a village in the outskirts of Nagapattinam in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Divya Prabandha, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desam dedicated to Vishnu, who is worshipped as Neelamegha Perumal (also called as Neela Meghar) and his consort Lakshmi as Thirukannapura Nayagi. As per Hindu legend, the presiding deity is believed to have appeared with a wig (called sowri locally) to save a devotee, leading to the name Sowriraja Perumal (also called as Sowrirajan or Sowrirajar). A granite wall surrounds the temple, enclosing all its shrines and three of its seven bodies of water. The temple has a seven-tiered rajagopuram, the temple's gateway tower and a huge temple tank in front of it. The temple is believed to have been built by the Cholas, with later additions from the Thanjavur Nayaks.","la":10.8685,"lo":79.7043,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Tirukannapuram9.JPG"},"18":{"t":"Loganatha_Perumal_Temple","d":"The temple is one of the Panchakanna (Krishnaranya) Kshetrams, the five holy temples associated with Krishna, an avatar of Vishnu.","x":"The Loganatha Perumal Temple is a Hindu temple dedicated to Vishnu located 2 km away from Sikkal, Tamil Nadu, India on the Tiruvarur-Nagapatnam highway. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshiped as Loganatha Perumal and his consort Lakshmi as Loganayagi. The temple is believed to have been built by the Medieval Cholas of the late 9th century CE, with later contributions from Vijayanagara kings and Madurai Nayaks. A granite wall surrounds the temple, enclosing all its shrines and its bodies of water. The temple has a five-tiered rajagopuram, the temple's gateway tower. The deity Loganatha is believed to have appeared to Brahma, sages Gautama, Uparivasu, Vashista, Bhrigu, and Madarar . Six daily rituals and four yearly festivals are held at the temple, of which the Panguni Brahmostavam, celebrated during the Tamil month of Panguni (April–May), is the most prominent.","la":10.7572,"lo":79.7633,"tw":"Utpala","tk":"Sravana","ia":"VishnuDevA7","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thirukannangudi_01_09_2021_withRahul.jpg"},"19":{"t":"Soundararajaperumal_Temple,_Nagapattinam","d":"The tributary of river Cauvery, Odambokki, passes close to the temple and the river is also called Virutha Kaveri. This leads to one of the names of presiding deity, \"Kaveri Thuraivan\". The present day Nagapattinam is believed to have been a forest, historically named Sundararinyam. During the Treta Yuga, this is the forest where Dhruva performed a penance to appease Vishnu.","x":"The Soundararajaperumal Temple is a temple dedicated to the Hindu god, Vishnu. It is located in Nagapattinam, a town in the South Indian state of Tamil Nadu. Constructed in Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is counted as one among the 108 Divya Desams dedicated to Vishnu. Vishnu is worshiped as Soundararaja Perumal and his consort Lakshmi as Soundaravalli. The temple is believed to have been built by the Medieval Cholas of the late 8th century CE, with later contributions at different times from Thanjavur Nayaks. The temple has two inscriptions dating from the Chola period. The temple has a five-tiered rajagopuram (gateway tower) within a granite wall. The complex contains all the shrines and water bodies associated with it. Soundararaja Perumal is believed to have appeared for Sage Markandeya, Dhruva, Saleesan, and the goddess Bhudevi. The temple observes six daily rituals and three yearly festivals.","la":10.7598,"lo":79.8437,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thirunagai8.JPG"},"20":{"t":"Thanjai_Mamanikoil","d":"Unlike other Divya Desams where a single shrine is referred, this set of temples is referred together in all the pasurams (verses). During the Treta Yuga, there were three demons by the names of Tanchakan, Tantakan, and Kacamukan who were blessed by Shiva, and became very powerful. They grew arrogant and troubled sage Parashara, who was doing penance at this place. Vishnu killed Tanchakan, after whom Thanjavur was named.","x":"Thanjai Mamani Koil, Thirutanjai, or Thanjavur Perumal Temple is a set of three adjacent Hindu temples to Vishnu in Thanjavur, Tamil Nadu, India. It is one of the Divya Desams, the 108 temples of Vishnu revered by the 12 poet saints called the Alvars. Unlike other Divya Desams where a single shrine is referenced, this set of temples is referred together in all the pasurams (sacred hymns). The temples are believed to be of significant antiquity with contributions at different times from Medieval Cholas, the Vijayanagara Empire, and Madurai Nayaks. The temples are enshrined within granite walls and the three complex contains all the shrines of the temple. Vishnu is regarded by adherents to have assumed the form of Varaha the boar to kill three demons named Tanchakan, Tantakan, and Kacamukan. The temples are maintained and administered by the Hindu Religious and Charitable Endowments Department of the Government of Tamil Nadu along with Thanjavur Palace Devasthanam.","la":10.8157,"lo":79.1387,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Neelamegha_Perumal_temple_(5).jpg","more":[{"k":"020a","name":"Thanjavur,","a":"Ssriram mt","l":"CC BY-SA 4.0","p":"https://commons.wikimedia.org/wiki/File:Manikundra_Perumal_temple,_Thanjavur_(4).jpg"},{"k":"020b","name":"Thanjavur,","a":"Ssriram mt","l":"CC BY-SA 4.0","p":"https://commons.wikimedia.org/wiki/File:Veeranarasimha_Perumal_temple_(1)_02.jpg"}]},"21":{"t":"Thirunandipura_Vinnagaram","d":"Nandi, the sacred bull vehicle of Shiva, is believed to have got his curses relieved by worshipping Vishnu here, and hence the place is called Nandipuram and Nandhipura Vinnagaram. It is also believed that king Sibi worshipped Vishnu at this place.","x":"Nathan Kovil or Thiru Nandipura Vinnagaram Temple in Nathan Kovil, a village in the outskirts of Kumbakonam in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Jagannathan and his consort Lakshmi as Shenbagavalli. Nandi, the sacred bull of Shiva, is believed to have got his curses relieved by worshipping Vishnu here and hence the place is called Nandipuram. All the shrines and water bodies associated with the temple are named after Nandi. Six rituals are performed every day and two festivals are celebrated every year in the temple. The Fridays during the Tamil month of Aipasi are believed to be auspicious to worship Shenbagavalli.","la":10.9221,"lo":79.3722,"ia":"பா.ஜம்புலிங்கம்","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Natankovil1.jpg"},"22":{"t":"Kola_Valvill_Ramar_Temple,_Tiruvelliyangudi","d":"The temple is counted as Vaishnava Shukra Kshetra as Vishnu appeared as a beautiful idol to please his devotee Shukra (Venus). The place derived its name Thiruvelliyangudi hence and the presiding deity is also referred to as Velliyan. It is believed that Vishnu appeared in Kalyana Kolam (marriage posture) to Parasara, Markandeya, Maya, Brahma, Shukra, and Bhudevi. To de-stress or relieve Vishnu, his mount or vahana, the eagle Garuda, holds the conch and the Sudarshana chakra of Vishnu, making this the only temple where Garuda is depicted in such a posture.","x":"Kolavalvil Ramar Temple is a Hindu temple dedicated to Vishnu 19 km from Kumbakonam, Tamil Nadu, India. Constructed in the Dravidian style of architecture, the temple is mentioned in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Kola Valvill Ramar and his consort Lakshmi as Maragathavalli. A granite wall surrounds the temple, enclosing all the shrines and two bodies of water. There is a four-tiered gopuram, the temple's gateway tower. Kola Vallvil Ramar is believed to have appeared to the sage Markendeya. The temple is maintained and administered by the Hindu Religious and Endowment Board of the Government of Tamil Nadu.","la":11.0567,"lo":79.4431,"tk":"Sukra, Brahma, Indra, Parasara","ia":"Ssriram mt","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Velliyangudi_temple.jpg"},"23":{"t":"Sri_Devaadi_Raja_Perumal_Temple_(Thiruvazhunthoor)","d":"In a Hindu legend, Brahma, the creator deity, drove away the cattle belonging to Krishna, an avatar of Vishnu. Krishna created another herd. Realising that the herd belonged to Krishna, Brahma apologised, and wished Krishna to set his abode at this place. Since Krishna appeared for the cattle and settled here, the presiding deity is called Amaruviappan (the one who is flanked by cattle). Following the legend, the presiding deity in the sanctum is portrayed with cattle surrounding him.","x":"The Devaadi Raja Perumal temple (Tamil: தேவாதிராஜன் பெருமாள் கோயில்) (also called Amaruviappan temple) in Therazhundur, a village in Mayiladuthurai district of the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Amaruviappan, and his consort Lakshmi as Sengamalavalli Thayar. The original structure of the temple was built by the Karikala Chola during the 1st century CE, with later additions from the Cholas during the 11th century. A granite wall surrounds the temple, enclosing all its shrines. The temple tank is located opposite to the temple, outside the main entrance. The temple follows Vadakalai tradition of worship.","la":11.0465,"lo":79.5795,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Therazhunthur_3.jpg"},"24":{"t":"Sthalasayana_Perumal_Temple,_Tirusirupuliyur","d":"Shiva ordered the sage Vyaghrapada to perform penance at Srirangam, requesting the god Vishnu to give him a place in his abode, Vaikuntha. Vyaghrapada was joined by sage Patanjali in his journey. Because of his poor eyesight, the sages instead went southward, lost their way and reached Krupa Samudram, modern day Tirusirupuliyur. They prayed to Vishnu to come from Srirangam to grant them moksha (divine liberation). Vishnu is also believed to have appeared for sage Vyasa at this place.","x":"Sthalasayana Perumal Temple (also called Arulmaakadal Perumal Temple) is a temple of the Hindu god Vishnu near Kollumangudi, Tamil Nadu, India. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Sthalasayana Perumal and his consort Lakshmi as Thirumagal Nachiyar. A granite wall surrounds the temple, enclosing all the shrines. There is a four-tiered rajagopuram, the temple's gateway tower, in the temple. Sthalasayana Perumal is believed to have appeared to sage Vyaghrapada. Three daily rituals and three yearly festivals are held at the temple, of which the Brahmotsavam festival, celebrated during the Tamil month of Vaikasi (May–June), being the most prominent. The temple is maintained and administered by the Hindu Religious and Endowment Board of the Government of Tamil Nadu.","la":10.9912,"lo":79.6694,"tw":"Nanda Vardhana Vimanam","fd":"Bhujanga Shayanam and South-faced","ia":"Ssriram mt at English Wikipedia","il":"Public domain","ip":"https://commons.wikimedia.org/wiki/File:Tiruchirupuliur4.jpg"},"25":{"t":"Thalai_Sanga_Nanmathiyam","d":"The moon deity Chandra once conducted a sacrifice called the rajasuya yajna, which was attended by all the celestial deities. Tara, the wife of Brihaspati (Jupiter) was attracted by Chandra. Brihaspati appealed to Vishnu on the event and cursed Chandra to have leprosy. Tara bore Budha (Mercury) from Chandra and since his birth had resulted from an illicit relationship, Budha hated his father. To propitiate himself of the curse, Chandra started worshipping Vishnu in this place.","x":"The Naanmadiya Perumal Temple (also called Thalachanga Nanmathiyam) is a Hindu temple situated in the village of Thalaichangadu, near Akkur in Mayiladuthurai district in the South Indian state of Tamil Nadu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Nanmadiya Perumal and his consort Lakshmi as Talaichanga Nachiar. The temple is maintained and administered by the Hindu Religious and Endowment Board of the Government of Tamil Nadu.","la":11.1298,"lo":79.7853,"tk":"Chandra","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thalachanga_Nanmathiyam_(6).jpg"},"26":{"t":"Parimala_Ranganatha_Perumal_Temple","d":"According to Hindu legend, this site is where the moon god, Chandra is believed to have been relieved of his curse. Indu means moon, and the place Tiruindaloor derives its name from the legend. Chandra, worshipped Vishnu, who appeared to please his devotee.","x":"Parimala Ranganathar Perumal Temples also known as Tiruindaloor Parimala Ranganathar Temple, is a Hindu temple dedicated to the deity Vishnu. It is located in Thiruvilandur, also known as Indalur, in the town of Mayiladuthurai in the South Indian state of Tamil Nadu. It is one of the Divya Desams, the 108 temples of Vishnu revered in Nalayira Divya Prabandham by the 12 poet saints, or the Alvars. This temple is along Kaveri and is one of the Pancharanga Kshetrams. The temple is believed to be of significant antiquity with contributions at different times from Medieval Cholas, Vijayanagara Empire and Madurai Nayaks. The temple is enshrined within a granite wall and the complex contains all the shrines of the temple. The rajagopuram (the main gateway) has five tiers. Parimala Ranganathar is believed to have appeared for Chandra, the moon god. The temple has six daily rituals at various times from 5:30 a.m. to 9 p.m., and twelve yearly festivals on its calendar.","la":11.1097,"lo":79.6462,"tw":"Vedachakra","ia":"Ssriram mt","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Indaloor1.jpg"},"27":{"t":"Thirukkavalampadi","d":"Krishna, the eighth incarnation of Vishnu, and his consort Satyabhama, chose this location for their garden, as it resembled the one in the palace of the king of celestial deities, Indra. Kavalam indicates elephant, and padi indicates place - it is believed that Krishna saved an elephant at this place leading to the name of the temple. The event is described in the verses of Tirumangai Alvar in the Naalayira Divya Prabandham.","x":"Thirukkavalampadi also known as the Gopalakrishna Perumal Temple is a hindu temple located in Thirunangur in Sirkali taluk of Mayiladuthurai district, in the South Indian state of Tamil Nadu. It is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Gopalakrishnan and his consort Lakshmi in two forms as Rukmini and Satyabhama. It is one among the eleven Divya Desams of Thirunangur Tirupathis and is closely associated with Thirumangai Alvar. The temple is open from 8 a.m. to 10 a.m. and 5 p.m. to 7 p.m and has four daily rituals at various times of the day. The Thirumangai Alvar Mangalasasana Utsavam celebrated annually during the Tamil month of Thai is the major festival of the temple during which the festival images of the eleven Thirunangur Tirupathis are brought on mount designed like Garuda, called Garuda Vahana, to Thirunangur.","la":11.1769,"lo":79.7824,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thirukavalambadi2.jpg"},"28":{"t":"Kazheesirama_Vinnagaram","d":"Thirumangai Aḻvar was requested by the Shaiva poetSambandar to praise God through pasurams. The deity in the temple is praised as \"Man alantha tadalan\", meaning the one who measured the land. The name Tadalan is in honour of Trivikrama (Vamana) form and the mulavar (central deity) fixed in the central shrine is in this form. The presiding deity, Trivikrama, appeared for sage Ashtakoma.","x":"Kazheesirama Vinnagaram or Thadalan Kovil or Trivikrama Perumal Temple is a Hindu temple dedicated to Vishnu located in Sirkazhi, of Mayiladuthurai district, Tamil Nadu, India. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Trivikrama and his consort Lakshmi as Loganayagi. The temple is believed to have been built by Cholas, with later contributions from Medieval Cholas, Vijayanagara kings, and Madurai Nayaks. The temple is found in Sirkazhi, and situated in a location called Thadalan Kovil. The temple complex actually houses all the shrines within large concentric walls completed by a three-tiered Rajagopuram (entrance tower). There are three major shrines in the temple, with the one of Trivikrama-Vishnu in the main sanctum and two other shrines of Loganyagi-Lakshmi and Andal being the most prominent.","la":11.241,"lo":79.7317,"tw":"Pushkala Vartha","tk":"Shankha Pushkarani - Chakra Theertham","cr":"Chola Empire","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thadalankoil_(10).jpg"},"29":{"t":"Thiruarimeya_Vinnagaram","d":"The Hindu god Shiva is believed to have started dancing (tandava) in fury at this place after the death of his consort Sati during the yagna (sacrifice) of Daksha. Each time his lock of hair touched the ground, there were eleven other forms of Shiva who appeared. The celestial deities were worried that if the dance continues, it would result in the decimation of all of creation. They prayed to Vishnu for help, who appeared at this place. On seeing Vishnu, Shiva's anger reduced, and he requested Vishnu to appear in eleven forms like he had. On his request, Vishnu appeared in eleven different forms at Tirunangur.","x":"Thiruarimeya Vinnagaram or Kudamadukoothan Perumal Temple is dedicated to the Hindu god Vishnu in Tirunangur, a village in the outskirts of Sirkaḻi in the South Indian state of Tamil Nadu. Constructed in the Dravidian style of architecture, the temple is mentioned in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Kudamudakoothan and his consort Lakshmi as Amirtagadavalli. It is one among the eleven Divya Desams of Tirunangur Tirupatis and is closely associated with Thirumangai Alvar.","la":11.1777,"lo":79.7815,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Arimeya_Vinnagaram_-_Kuamadukoothan5.jpg"},"30":{"t":"Thiru_Vanpurushothamam","d":"Same as Thiruarimeya Vinnagaram.","x":"The Purushotama Perumal Temple is located in Thirunangur, a village in the outskirts of Sirkazhi in the South Indian state of Tamil Nadu, and is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Purushottaman and his consort Lakshmi as Purushottama Nayagi. It is one among the eleven Divya Desams of Thirunangur Tirupathis and is closely associated with Thirumangai Alvar. The temple is open from 8 a.m. to 10 a.m. and 5 p.m. to 7 p.m and has four daily rituals at various times of the day. The Thirumangai Alvar Mangalasasana Utsavam celebrated annually during the Tamil month of Thai is the major festival of the temple during which the festival images of the eleven Thirunangur Tirupathis are brought on mount designed like Garuda, called Garuda Vahana, to Thirunangur.","la":11.1788,"lo":79.7767,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thrivuanpurushotam2.jpg"},"31":{"t":"Thiruchsemponsey","d":"Same as Thiruarimeya Vinnagaram.","x":"Thiruchsemponsey or Perarulaalan Perumal Temple is dedicated to Hindu god Vishnu located in Thirunangur, a village in the outskirts of Sirkazhi in the South Indian state of Tamil Nadu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries AD. It is one of the 108 Divya Desam dedicated to Vishnu, who is worshipped as Peralulalan and his consort Lakshmi as Allimalar Nachiyar. It is one among the eleven divyadesams of Thirunangur Tirupathis and is closely associated with Thirumangai Alvar. The temple is open from 8 a.m. to 10 a.m. and 5 p.m. to 7 p.m and has four daily rituals at various times of the day. The Thirumangai Alvar Mangalasasana Utsavam celebrated annually during the Tamil month of Thai is the major festival of the temple during which the festival images of the eleven Thirunangur Tirupathis are brought on mount designed like Garuda, called Garuda Vahana, to Thirunangur.","la":11.1784,"lo":79.7797,"tw":"Kanaga","fd":"East facing standing posture","fs":"iypasi swati bromotsavam","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thiruchsemponsey2.jpg"},"32":{"t":"Thirumanimadam","d":"Same as Thiruarimeya Vinnagaram.","x":"Thirumanimadam or Narayanan Perumal Temple (also called Badrinarayana Perumal Temple) is dedicated to the Hindu god Vishnu located in Thirunangur, a village in the outskirts of Sirkazhi in the Indian state of Tamil Nadu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Narayanan and his consort Lakshmi as Pundarikavalli. It is one among the eleven Divya Desams of Thirunangur Tirupathis and is closely associated with Thirumangai Alvar. The Thirumangai Alvar Mangalasasana Utsavam celebrated annually during the Tamil month of Thai is the major festival of the temple during which the festival images of the eleven Thirunangur Tirupatis are brought on mount designed like Garuda, called Garuda Vahana, to Thirunangur.","la":11.174,"lo":79.7769,"tw":"Pranava","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Narayana_Perumal5.jpg"},"33":{"t":"Thiruvaikunda_vinnagaram","d":"Same as Thiruarimeya Vinnagaram.","x":"Thiruvaikunda Vinnagaram or Vaikunta Nathan Perumal Temple is dedicated to Hindu god Vishnu located in Tirunangur, a village in the outskirts of Sirkazhi in the South Indian state of Tamil Nadu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Vaikuntanathan and his consort Lakshmi as Vaikuntavalli. It is one among the eleven Divya Desams of Thirunangur Tirupathis and is closely associated with Thirumangai Alvar. The temple is open from 8 a.m. to 10 a.m. and 5 p.m. to 7 p.m and has four daily rituals at various times of the day. The Thirumangai Alvar Mangalasasana Utsavam celebrated annually during the Tamil month of Tai is the major festival of the temple during which the festival images of the eleven Thirunangur Tirupatis are brought on mount designed like Garuda, called Garuda Vahana, to Thirunangur.","la":11.1798,"lo":79.7783,"tw":"Anantasatyavartaka","tk":"Lakshmi, viraja","fs":"adi magam","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Vaikunda_vinnagaram_2.jpg"},"34":{"t":"Azhagiyasingar_Temple,_Thiruvali","d":"Associated with Narasimha's killing of Hiranyakashipu, and his pacification by Lakshmi and Prahlada sitting on his lap.","x":"The Alagiyasingar Temple in Thiruvali, a village in Mayiladuthurai district in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Alagiyasingar and his consort Lakshmi as Purnavalli. A granite wall surrounds the temple, enclosing all its shrines. The temple is originally believed to have been built by the Cholas, with later additions by the Vijayanagara and Thanjavur Nayak kings during the 16th century. Alagiyasingar is believed to have appeared to Thirumangai Alvar at this place. The legend of the temple is closely associated with Thirunagari temple. The temple follows Thenkalai tradition of worship. Four daily rituals and three yearly festivals are held at the temple, of which the Thirumangai Alvar Utsavam during Thai being the most prominent.","la":11.203,"lo":79.7745,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thiruvali4.jpg","more":[{"k":"034a","name":"Thirunagari, Mayiladuthurai district, Ta","a":"Ssriram mt","l":"CC BY-SA 4.0","p":"https://commons.wikimedia.org/wiki/File:Thirunagari1.jpg"}]},"35":{"t":"Thiruthevanartthogai","d":"Same as Thiruarimeya Vinnagaram.","x":"Thiruthevanartthogai or Madhava Perumal Temple is a Hindu temple dedicated to Vishnu located in Tirunangur, a village in the outskirts of Sirkaḻi in the South Indian state of Tamil Nadu. Constructed in the Dravidian style of architecture, the temple is mentioned in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Madhava Perumal and his consort Lakshmi as Kadalmagal. It is one among the eleven Divya Desams of Tirunangur Tirupatis and is closely associated with Thirumangai Alvar. The Thirumangai Alvar Mangalasasana Utsavam celebrated annually during the Tamil month of Tai is the major festival of the temple during which the festival images of the eleven Tirunangur Tirupatis are brought on mount designed like Garuda, called Garuda Vahana, to Tirunangur. The temple follows the Tenkalai mode of worship.","la":11.1968,"lo":79.7755,"tw":"Sopana","tk":"Sopana","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thiruthevanarthogai3.jpg"},"36":{"t":"Thiruthetriyambalam","d":"Same as Thiruarimeya Vinnagaram.","x":"Thiruthetriyambalam or Palli Konda Perumal Temple is located in Tirunangur, a village in the outskirts of Sirkaḻi in the Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Palli Konda Perumal. It is one among the eleven Divya Desams of Tirunangur Tirupathis and is closely associated with Tirumangai Alvar. It is also the only temple in the Nangur Divya Desams to have revered by a poet-saint other than Tirumangai Alvar. As per Hindu legend, the temple tank for dug by Arjuna from the age of Mahabharata. Krishna appeared as Parthasarathy to Arjuna here and initiated his education, leading to the name of the temple.","la":11.173,"lo":79.7951,"tw":"Veda","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Pallikonda_Perumal_-_Thiruthetriambalam3.jpg"},"37":{"t":"Thirumanikkoodam","d":"Same as Thiruarimeya Vinnagaram.","x":"Thirumanikkoodam or Varadaraja Perumal Temple is located in Thirunangur, a village in the outskirts of Sirkaḻi in the Indian state of Tamil Nadu. It is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is mentioned in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Varadharaja Perumal. It is one among the eleven Divya Desams of Thirunangur Tirupatis and is closely associated with Thirumangai Alvar. It is also the only temple in the Nangur Divya Desams to have revered by a poet-saint other than Thirumangai Alvar. As per Hindu legend, the temple tank for dug by Arjuna from the age of Mahabharata. Krishna is regarded to have appeared as Parthasarathy to Arjuna here and initiated his education, leading to the name of the temple.","la":11.1774,"lo":79.7778,"tw":"Kanaka","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thirumanikoodam4.jpg"},"38":{"t":"Thiruvellakkulam","d":"Same as Thiruarimeya Vinnagaram.","x":"Thiruvellakkulam (also called Annan Perumal Temple or Annankoil) is a Hindu temple of Vishnu in Thirunangur, a village in the outskirts of Sirkazhi in the Indian state of Tamil Nadu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Annan Perumal and his consort Lakshmi as Alamermangai. It is one among the eleven Divya Desams of the Thirunangur Tirupatis, and is closely associated with Thirumangai Alvar.","la":11.1901,"lo":79.7649,"tw":"Tatvatyodaga","fs":"10 Birmosthavam @ Puratasi Month (Between Sep & Oct) Vasatha Urchnava, Perumal and thayar","ia":"Vishwajith33","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Annan_koil.jpeg"},"39":{"t":"Thiruppaarththanpalli","d":"Same as Thiruarimeya Vinnagaram, and also a site where the Pandava prince Arjuna prayed to Lord Krishna.","x":"The Taamaraiyaal Kelvan Perumal Temple or Thiruppaarththanpalli is located close to Thirunangur, a small village, 8 km east of Sirkali en route to Thiruvenkadu and is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is mentioned in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Taamariyaal Kelvan and his consort Lakshmi as Shegamalavalli. It is one among the eleven Divya Desams of Thirunangur Tirupathis and is closely associated with Thirumangai Alvar. It is also the only temple in the Nangur Divya Desams to have revered by an Alvar other than Thirumangai Alvar. As per Hindu legend, the temple tank for dug by Arjuna from the age of Mahabharata. Legend says Krishna appeared as Parthasarathy to Arjuna here and initiated his education, leading to the name of the temple.","la":11.17,"lo":79.7975,"tw":"Narayana","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thiruparthanpalli1.jpg"},"40":{"t":"Govindaraja_Perumal_Temple","d":"The shrine has close connections with the Govindaraja temple in Tirupati, dating back to the saint Ramanuja of the 11-12th century. Ramanuja fled to Tirupati with the utsava (festival idol) of the temple to escape Shaiva persecution.","x":"The Govindaraja Perumal Temple, also called Thiruchitrakoodam, is a temple situated in Chidambaram, a town in the South Indian state of Tamil Nadu. Dedicated to the Hindu god Vishnu, the temple is inside the premises of the Thillai Nataraja Temple, constructed in the Dravidian architecture. The temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desam dedicated to Vishnu, who is worshipped as Govindaraja Perumal and his wife Lakshmi as Pundarikavalli Thayar. Also significant as a major shrine of Shiva worship since the classical period, there have been several renovations and offerings to Chidambaram by the Pallava, Chola, Pandya, Vijayanagara, and Chera royals in the ancient and pre-medieval periods. The temple as it stands now is mainly of the 12th and 13th centuries, with later additions in similar style. The Govindaraja idol is believed to have been uprooted outside the temple complex during the period of Kulothunga Chola II.","la":11.3992,"lo":79.6934,"ia":"Gabriele Giuseppini","il":"CC BY 3.0","ip":"https://commons.wikimedia.org/wiki/File:Temple_Tank_(Sivaganga),_Nataraja_Temple_-_panoramio.jpg"},"41":{"t":"Devanathaswamy_temple","d":"A number of sages bore witness to Mahavishnu in his resplendent form, with his weapons Sudarshana Chakra (discus), Panchajanya (conch) and the Kaumodaki (mace) gracing his arms.","x":"Devanatha Hemabhujavalli Temple (also called Thiruvanthipuram Koyil) (Thiruvaheendrapuram) is a Hindu temple in Thiruvanthipuram, a village in the outskirts of Cuddalore in the South Indian state of Tamil Nadu, dedicated to the god Vishnu and goddess Lakshmi. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Devanatha and Lakshmi as Hemabhujavalli. Though the presiding deity is Devanatha and Hemabhujavalli, the temple is known for Hayagriva, the ninth avatara of Vishnu in the Dashavatara of Vishnu and a god of knowledge. The temple is the only historical temple in South India to have a shrine of Hayagriva on hilltop. The temple in its current form is believed to have been built during the Medieval Cholas, with later expansion from Pandyas, Hoysala Empire and Vijayanagara Empire.","la":11.7451,"lo":79.7094,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Devanathaswamytemple_(6).jpg"},"42":{"t":"Ulagalantha_Perumal_Temple,_Tirukoyilur","d":"The temple is believed to be the place where the first three Alvars, the Vaishnava saints, namely, Poigai Alvar, Bhoothathalvar, and Peyalvar attained salvation. The temple is one of the Panchakanna (Krishnaranya) Kshetrams, the five holy temples associated with Krishna, an avatar of Vishnu.","x":"Ulagalantha Perumal Temple or Trivikrama Temple is a Hindu temple dedicated to Vishnu located in Tirukkoyilur, Tamil Nadu, India. Constructed in the Dravidian style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Ulagalantha Perumal and his consort Lakshmi as Poongothai. The temple is believed to have been built by the Medieval Cholas, with later contributions from Vijayanagara kings and Madurai Nayaks. The temple covers an area of 5 acres (20,000 m2) and has a temple tower that is the third tallest in Tamil Nadu, measuring 192 ft (59 m) in height. According to Hindu scriptures and beliefs, Vamana, a Brahmin dwarf avatar of Vishnu, appeared here to quell the pride of the asura king Bali. The temple is believed to be the place where the first three Alvars, the Vaishnava Saints, namely, Poigai Alvar, Bhoothathalvar, and Peyalvar attained salvation.","la":11.967,"lo":79.2025,"tw":"Sreekara","tk":"Pennar, Krishan","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Ulagalantha_Perumal9.JPG"},"43":{"t":"Varadharaja_Perumal_Temple,_Kanchipuram","d":"One of the greatest Hindu scholars of the Vaishnava Vishishtadvaita philosophy, Ramanuja, is believed to have resided in this temple. The Vishnu idol in this temple was originally made by Vishwakarma from fig tree wood (atthi) until Muslim invasions forced the wooden idol into hiding and being replaced by the current stone idol. The temple, along with Ekambareswarar Temple and Kamakshi Amman Temple in Kanchipuram, is popularly known as Mumurtivasam (abode of the trio), while Srirangam is referred to as ‘The Koil’ (temple) and Tirupati as the ‘Malai’ (hill).","x":"Varadharaja Perumal Temple, also called Hastagiri, Attiyuran, Attigiri, Perarulalan Perumal temple, Kanchi koil, Thirukatchi, or Perumal koil is a Hindu temple dedicated to Vishnu located in the city of Kanchipuram, Tamil Nadu, India. It is one of the Divya Desams, the 108 temples of Vishnu believed to have been visited by the 12 poet saints, or the Alvars. It is located in a suburb of Kanchipuram known as the Vishnu Kanchi that is a home for many famous Vishnu temples. One of the greatest Hindu scholars of Vaishnava Vishishtadvaita philosophy, Ramanuja, is believed to have resided in this temple. The temple along with Ekambareswarar Temple and Kamakshi Amman Temple in Kanchipuram is popularly known as Mumurtivasam (abode of trio), while Srirangam is referred to as: 'Koil' (meaning: \"temple\") and Tirupati as: 'Malai' (Meaning: \"hill\"). Among the Divya Desams, Kanchipuram Varadharaja Perumal temple is known as: 'Perumal Koil'. This is one of the most sacred places for Vaishnavites.","la":12.8191,"lo":79.7246,"tw":"Punyakoti Vimanam; Kalyana Koti Vimanam","tk":"Anantha Theertham","cr":"Chola Kings, later Nayaks of Thanjavur","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Varadaraja_Perumal_Temple_Kanchipuram_(31).jpg"},"44":{"t":"Ashtabujakaram","d":"Also based on Gajendra Moksha: The elephant Gajendra used to worship Vishnu with the lotuses fetched from the temple tank every day. Once, while picking up a lotus, a crocodile caught the leg of Gajendra, who started calling the name of Vishnu for help. Vishnu sent his discus to kill the crocodile, and relieve the elephant. The presiding deity is addressed by various names like Adikesava Perumal, Gajendra Varadhan, and Chakradharan.","x":"The Ashtabujakaram or Ashtabuja Perumal Temple located in Kanchipuram in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Ashta Bhuja Perumal and his consort Lakshmi as Alamelumangai. This is the 4th largest temple in south Kanchi. The temple is believed to have been renovated by the Pallavas of the late 8th century CE, with later contributions from Medieval Cholas and Vijayanagara kings. The temple has three inscriptions on its walls, two dating from the period of Kulothunga Chola I (1070–1120 CE) and one to that of Rajendra Chola (1018-54 CE). A granite wall surrounds the temple, enclosing all the shrines and two bodies of water. There is a four-tiered rajagopuram, the temple's gateway tower, in the temple. Six daily rituals and three yearly festivals are held at the temple.","la":12.8227,"lo":79.7108,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Ashtabhujakaram_(9).jpg"},"45":{"t":"Tiruththanka","d":"Vedanta Desika (1268 - 1369 CE) was an ardent devotee of Deepa Prakasa Temple at Thoppul. The devotion of Desika is mentioned in Saranagathi Deepika in 59 verses. He was born in this kshetra. Vedanta Desika also has a shrine inside the temple. A statue of Hayagriva worshipped by him also has a temple nearby to him.","x":"The Deepaprakasa Perumal Temple, also referred to as Tiruththanka, Desikar Avatara Sthalam, and Tooppul, in Kanchipuram in the Indian state of Tamil Nadu, is a temple dedicated to Vishnu, a Hindu god. Constructed in the Dravidian style of a
