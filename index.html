rchitecture, the temple is mentioned in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Deepaprakasar, and his consort Lakshmi as Maragathavalli. The temple is believed to have been expanded during the Medieval Cholas and Vijayanagara kings. The temple has inscriptions on its walls dating from the period of Rajaraja Chola III (1223 CE). A granite wall surrounds the temple, enclosing all the shrines and two bodies of water. There is a two-tiered rajagopuram, the temple's gateway tower, in the temple. Deepaprakasar is believed to have appeared to Brahma. The temple is maintained and administered by the Hindu Religious and Endowment Board of the Government of Tamil Nadu.","la":12.8244,"lo":79.7055,"ia":"Nsmohan (talk)","il":"CC BY 3.0","ip":"https://commons.wikimedia.org/wiki/File:Vilakkoli-perumal108dd.jpg"},"46":{"t":"Tiruvelukkai","d":"Narasimha is believed to have appeared here to kill Hiranyakashipu, the demon king. Velukkai is derived from Vel (desire) and irukkai (place of stay), meaning the place where Vishnu desired to stay, which became Velukkai from Velirukkai. Here, Narasimha is called Azhagiya Singar (the handsome lion)","x":"Tiruvelukkai located in Kanchipuram in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Aḻagiya Singar (Narasimha) and his consort Lakshmi as Amruthavalli. This is the smallest divyadesam in Kanchipuram, however Vedanta Desika wrote a kamasikashtakam on this perumal. The temple is believed to have been built by the Pallavas of the late 8th century CE, with later contributions from Medieval Cholas and Vijayanagara kings. The temple has three inscriptions on its walls, two dating from the period of Kulothunga Chola I (1070–1120 CE) and one to that of Rajadhiraja Chola (1018-54 CE). A granite wall surrounds the temple, enclosing all the shrines and two bodies of water. There is a 3-tiered rajagopuram, the temple's gateway tower, in the temple.","la":12.8222,"lo":79.7065,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Tiruvelukkai_(3).jpg"},"47":{"t":"Ulagalantha_Perumal_Temple,_Kanchipuram","d":"The temple has no presiding deity, but just a festive image probably brought from another shrine. The images of the festival deity, Jagadishvara, facing the east and having four arms, is housed in a hall in the second precinct. The water body associated with the temple is Akrura Tirtham and the vimana is Jagadiswara Vimanam. According to Pillai Perumal Aiyangar in his Nurrettrutiruppatiyantati, Vishnu revealed himself to a sage in the form of a child in a banyan leaf.","x":"Ulagalandha Perumal Temple is a temple dedicated to Vishnu located in Kanchipuram, Tamil Nadu, India. Constructed in the Dravidian style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th through 9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Ulagalantha Perumal, and his consort Lakshmi as Amuthavalli. The temple is believed to have been built by the Pallavas, with later contributions from the medieval Cholas, Vijayanagara kings, and Madurai Nayaks. The temple is found in Big Kanchipuram, and situated close to Kamakshi Amman Temple. The temple complex actually houses four Divya Desams in its different precincts, namely, Tirukkaravanam, Tirukarakam, Tiruneerakam, and Tiruürakam, that last of which is present within the sanctum sanctorum of the main temple. Vamana, the Brahmin dwarf, and one of the ten avatars of Vishnu, is held to have appeared here to quell the pride of the asura king Mahabali.","la":12.8391,"lo":79.7052,"tw":"Śrīkara Vimanam","tk":"Naga Tirtham, Shesha Tirtham","fd":"West","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Ulagalantha_perumal_Kanchipuram3.jpg"},"48":{"t":"Tiru_paadagam","d":"The temple is considered one of three oldest temples in Kanchipuram, and is believed to have been built by the Pallavas of the late 8th century CE, with later contributions from Medieval Cholas and Vijayanagara kings. The temple is associated with a chapter in Mahabharata when Krishna went to the Kauravas as a peace messenger (called Thoota locally) of the Pandavas.","x":"Pandavatutar Perumal Temple or Thirupadagam located in Kanchipuram in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Krishna, an avatar of the god Vishnu. Constructed in the Dravidian style of architecture, the temple is extolled in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Pandava Tutar Perumal (Krishna) and his consort Lakshmi (Rukmini). The temple is considered one of three oldest temples in Kanchipuram; The other two oldest temples are Ulagalantha Perumal Temple and Yathothkari Perumal Temple. The temple is believed to have been built by the Pallavas of the late 8th century CE with later contributions from Medieval Cholas and Vijayanagara kings. The temple has three inscriptions on its walls, two dating from the period of Kulothunga Chola I (1070–1120 CE) and one to that of Rajadhiraja Chola (1018–1054 CE). A granite wall surrounds the temple, all the shrines, and two bodies of water.","la":12.8427,"lo":79.6969,"cr":"Pallava","ins":"Tamil","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Pandavathoothar_(7).jpg"},"49":{"t":"Nilathingal_Thundam_Perumal_temple","d":"This shrine is located within the premises of the Ekambareswarar Temple. Shiva once attempted to test the devotion of his consort Parvati by setting her aflame while she meditated under the temple's mango tree. When she prayed for Vishnu's intervention, he seized Shiva's crescent moon, and used its power to douse the divine flame.","x":"Nilathingal Thundam Perumal temple (also called Chandrasoodeswarar Perumal temple) is a Hindu temple dedicated to Vishnu, located in Kanchipuram in the state of Tamil Nadu, India. The temple is located in a shrine in Ekambareswarar Temple, the largest temple in the town of Kanchipuram, located in the northern part of the town. The temple gopuram (gateway tower) is 59 m tall, which is one of the tallest gopurams in India. The temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshiped as Nilathingal Thunda Perumal and his consort Lakshmi as Nilathingal Thunda Nayagi. Six daily rituals and two major yearly festivals are held at the temple, of which the Vaikuntha Ekadashi festival, celebrated during the Tamil month of Margali (December–January), is the most prominent. The temple is maintained and administered by the Hindu Religious and Endowment Board of the Government of Tamil Nadu.","la":12.8475,"lo":79.6993,"cr":"Pallava, Chola kings","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Ekambareswarar3.jpg"},"50":{"t":"Ulagalantha_Perumal_Temple,_Kanchipuram","d":"The central shrine of temple is most commonly referred as Peragam, while the smaller shrine where the image of the demigod Adishesha is houses is called Tiruooragam. According to tradition, Mahabali, at the foot of Vamana, could not view the tall form and requested him to produce a smaller form. Vishnu obliged and appeared as a snake in a smaller shrine. The shrine is frequented by childless couple praying for offspring.","x":"Ulagalandha Perumal Temple is a temple dedicated to Vishnu located in Kanchipuram, Tamil Nadu, India. Constructed in the Dravidian style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th through 9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Ulagalantha Perumal, and his consort Lakshmi as Amuthavalli. The temple is believed to have been built by the Pallavas, with later contributions from the medieval Cholas, Vijayanagara kings, and Madurai Nayaks. The temple is found in Big Kanchipuram, and situated close to Kamakshi Amman Temple. The temple complex actually houses four Divya Desams in its different precincts, namely, Tirukkaravanam, Tirukarakam, Tiruneerakam, and Tiruürakam, that last of which is present within the sanctum sanctorum of the main temple. Vamana, the Brahmin dwarf, and one of the ten avatars of Vishnu, is held to have appeared here to quell the pride of the asura king Mahabali.","la":12.8391,"lo":79.7052,"tw":"Śrīkara Vimanam","tk":"Naga Tirtham, Shesha Tirtham","fd":"West","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Ulagalantha_perumal_Kanchipuram3.jpg"},"51":{"t":"Tiruvekkaa","d":"The goddess Saraswati, angry with Brahma, attempted to disrupt his yajna. Vishnu stopped her in these efforts. Defeated, Saraswati took the form of the Vegavati river. As Vishnu interfered the path of the river, it was termed Vegavani, then as Vegannai, which gradually corrupted to Vekka.","x":"Tiruvekkaa Temple or Yathothkari Perumal Temple (locally called Sonnavannam Seitha Perumall) is a Hindu temple located in Kanchipuram in the South Indian state of Tamil Nadu and dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Yathothkari Perumal, and his consort Lakshmi as Komalavalli. This is the 2nd largest temple in south Kanchi, after the Varadaraja perumal temple. The temple is considered one of three oldest Vishnu temples in Kanchipuram, the other two being Ulagalantha Perumal Temple and Pandava Thoothar Perumal Temple. The temple finds a mention in the Sangam text Perumpāṇāṟṟuppaṭai which is dated between 300 BCE and 100 CE. The temple is believed to have been built by the Pallavas of the late 8th century CE, with later contributions from Medieval Cholas and Vijayanagara kings.","la":12.8241,"lo":79.7125,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Yathothkari_(2).jpg"},"52":{"t":"Ulagalantha_Perumal_Temple,_Kanchipuram","d":"The shrine is located on the third precinct of the temple. According to Hindu legend, sage Garga performed his penance at this temple and obtained knowledge. The place thus derived its name Garagaham, which later became Kaaragam. The presiding deity of the shrine is Karunakara Perumal facing north and seated on Adisesha and his consort Padmamani Nachiar. The temple tank associated with it is called Agraya Tirtha and the vimana is called Vamana Vimanam or Ramaya Vimanam.","x":"Ulagalandha Perumal Temple is a temple dedicated to Vishnu located in Kanchipuram, Tamil Nadu, India. Constructed in the Dravidian style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th through 9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Ulagalantha Perumal, and his consort Lakshmi as Amuthavalli. The temple is believed to have been built by the Pallavas, with later contributions from the medieval Cholas, Vijayanagara kings, and Madurai Nayaks. The temple is found in Big Kanchipuram, and situated close to Kamakshi Amman Temple. The temple complex actually houses four Divya Desams in its different precincts, namely, Tirukkaravanam, Tirukarakam, Tiruneerakam, and Tiruürakam, that last of which is present within the sanctum sanctorum of the main temple. Vamana, the Brahmin dwarf, and one of the ten avatars of Vishnu, is held to have appeared here to quell the pride of the asura king Mahabali.","la":12.8391,"lo":79.7052,"tw":"Śrīkara Vimanam","tk":"Naga Tirtham, Shesha Tirtham","fd":"West","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Ulagalantha_perumal_Kanchipuram3.jpg"},"53":{"t":"Ulagalantha_Perumal_Temple,_Kanchipuram","d":"The shrine is located in the second precinct of the Ulagalantha Perumal Temple. The presiding Vishnu deity is called Kalvar and faces north, while his consort is Lakshmi as Kamalavalli Thayar. Gauri Tatakam and Taratara Tatakam are the temple tanks associated with the temple and the vimana is called Puskala Vimana. There is a separate for Aranavalli Thayar.","x":"Ulagalandha Perumal Temple is a temple dedicated to Vishnu located in Kanchipuram, Tamil Nadu, India. Constructed in the Dravidian style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th through 9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Ulagalantha Perumal, and his consort Lakshmi as Amuthavalli. The temple is believed to have been built by the Pallavas, with later contributions from the medieval Cholas, Vijayanagara kings, and Madurai Nayaks. The temple is found in Big Kanchipuram, and situated close to Kamakshi Amman Temple. The temple complex actually houses four Divya Desams in its different precincts, namely, Tirukkaravanam, Tirukarakam, Tiruneerakam, and Tiruürakam, that last of which is present within the sanctum sanctorum of the main temple. Vamana, the Brahmin dwarf, and one of the ten avatars of Vishnu, is held to have appeared here to quell the pride of the asura king Mahabali.","la":12.8391,"lo":79.7052,"tw":"Śrīkara Vimanam","tk":"Naga Tirtham, Shesha Tirtham","fd":"West","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Ulagalantha_perumal_Kanchipuram3.jpg"},"54":{"t":"Thirukkalvanur","d":"The shrine is present inside the Kamakshi Amman temple, and glorifies Vishnu in his form of Varaha.","x":"Thirukkalvanur also known as 'Aadhivaraaha Perumal Temple' is a Vaishnavite temple in Kanchipuram, Tamil Nadu state in India. It is one of the 108 Divya desams. It is situated right to the Kamakshi Amman shrine in Kanchipuram.","la":12.8407,"lo":79.7032,"fs":"Vaikuntha Ekadashi, Navratri","ins":"Mangalaasaasanam by Thirumangai Aallhvaar","ia":"SINHA","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Kanchipuram.in_Kamakshi-Amman_Temple_-_panoramio.jpg"},"55":{"t":"Tiru_pavla_vannam","d":"Associated with the legend that Vishnu purportedly assumes his form in different hues depending on the conduct of humans during a given age.","x":"Tirupavalavannam or Pavalavanam temple located in Kanchipuram in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Pavalavannar Perumal and his consort Lakshmi as Pavalavalli. The temple is believed to have been built by the Cholas, with later contributions from Medieval Cholas and Vijayanagara kings. The temple has three inscriptions on its walls, two dating from the period of Kulothunga Chola I (1070–1120 CE) and one to that of Rajadhiraja Chola (1018-54 CE). A granite wall surrounds the temple, enclosing all the shrines and two bodies of water. There is a seven-tiered rajagopuram, the temple's gateway tower, in the temple. Pavalavannar is believed to have appeared to sage Naimisaranya.","la":12.8437,"lo":79.7076,"tk":"Chakra Theertham","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Manavalamamunigal_05.jpg"},"56":{"t":"Tiru_parameswara_vinnagaram","d":"Regarded to be the site where Vishnu appeared before Pallava princes who had performed a yajna for him.","x":"Tiru Parameswara Vinnagaram also known today as the Vaikunta Perumal Temple is a Hindu temple dedicated to the deity Vishnu (or Krishna), located in the ancient Pallava capital city of Kanchipuram in the present-day South Indian state of Tamil Nadu. Built by the emperor Nandivarman II Pallavamalla, the 8th century stone temple was originally known as Paramechuravinnagaram in Tamil and Vishnugriha in Sanskrit, meaning \"Vishnu-house\", signifying a royal palace for Parameshvara, an epithet of the deity. Study of the Vaikunta Perumal Temple has contributed to dating portions of the Bhagavata Purana, one of the eighteen major Puranas and an influential text in Hindu religious tradition. The temple is the subject of a detailed analysis by historian D. Dennis Hudson, whose monograph is dedicated to decoding its iconography and layout as an architectural summa of the Bhagavata Purana. The temple is one of the prominent tourist attractions in the city.","la":12.8372,"lo":79.7095,"cr":"Pallava","ins":"Tamil","ia":"Sridhar.selvaraj","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Parameswara_Vinnagaram.JPG"},"57":{"t":"Vijayaraghava_Perumal_temple","d":"The last rites of Jatayu are believed to have been performed here by Rama.","x":"Vijayaraghava Perumal temple is a Vishnu temple in Thirupputkuzhi, a village in Kanchipuram district in Tamil Nadu, India. It is situated about 7 miles west of Kanchipuram and half a kilometre from Baluchetti Chattiram, which lies on the Chennai - Vellore highway. Constructed in Dravidian style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is counted as one among the 108 Divya Desams dedicated to Vishnu. Vishnu is worshiped as Vijayaraghava Perumal and his consort Lakshmi as Maragathavalli Thayar. The temple is believed to be of significant antiquity and is believed to be initiated by the Pandyas, with later contributions at different times from Cholas and Thanjavur Nayaks. The temple has three inscriptions dating from the Chola period. The temple has a five-tiered rajagopuram (gateway tower) and enshrined within a granite wall. The complex contains all the shrines while the temple tank, is located to the west of the temple.","la":12.8726,"lo":79.6187,"ia":"Ssriram mt","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Tirupukuzhi1.jpg"},"58":{"t":"Bhaktavatsala_Perumal_Temple,_Thirunindravur","d":"Regarded to be the site where Varuna worshipped Vishnu.","x":"Bhaktavatsala Perumal temple is a Hindu temple at Thirunindravur, a western suburb of Chennai, India. It is dedicated to the Hindu deity Vishnu. Constructed in the Dravidian style of architecture, the temple is mentioned in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Bhaktavatsala Perumal and his consort Lakshmi as Ennai Petra Thayar. The temple is believed to have been built by the Pallavas of the late 8th century CE, with later contributions from the Medieval Cholas and Vijayanagara kings. A granite wall surrounds the temple, enclosing all the shrines and two bodies of water. There is a four-tiered rajagopuram, the temple's gateway tower, in the temple. The temple is maintained and administered by the Hindu Religious and Endowment Board of the Government of Tamil Nadu.","la":13.1125,"lo":80.0261,"cr":"Pallavas","ia":"Padmakishore","il":"Public domain","ip":"https://commons.wikimedia.org/wiki/File:Bakthavtsala_perumal_gopuram.jpg"},"59":{"t":"Veeraraghava_Swami_Temple_(Thiruevvul)","d":"Regarded to be the site where Vishnu tested the devotion of a sage by asking him large portions of his food and residence before blessing him.","x":"Veeraraghava Swamy Temple (or Veeraraghavaswamy Temple) is a temple dedicated to the Hindu god Vishnu, located in Tiruvallur, Chennai Metropolitan City, an area and headquarters in Tiruvallur district in the South Indian state of Tamil Nadu. Constructed in the Tamil style of architecture, the temple is glorified in the Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is counted as one among the 108 Divya Desams dedicated to Vishnu. Vishnu is worshipped as Veeraraghava Perumal, and his consort Lakshmi as Kanakavalli Thayar. The temple is believed to be of significant antiquity and is believed to be initiated by the Pallavas of the late 8th century CE, with later contributions at different times from Thanjavur Nayaks. The temple has three inscriptions dating from the Chola period. The temple has a seven-tiered rajagopuram (gateway tower) and enshrined within a granite wall. The complex contains all the shrines and Hritayathabhanasini, the temple tank, is located to the west of the temple.","la":13.1432,"lo":79.9074,"tw":"Vijayakoti Vimanam","tk":"Hritayathabhanasini Pushkarni","fs":"Vaikunta Ekadasi,, Ammavasai","cr":"Pallavas, Cholas, Thanjavur Nayaks","ws":"http://svdtiruvallur.org","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Tiruvallur9.jpg"},"60":{"t":"Parthasarathy_Kovil","d":"The name Parthasarathy, in Tamil, means the 'charioteer of Arjuna', referring to Krishna's role as a charioteer to Arjuna in the epic Mahabharata. It was originally built by the Pallavas in the 8th century and considered the oldest structural in Chennai.","x":"The Parthasarathy Temple is a 6th-century Hindu Vaishnavite temple dedicated to Vishnu in Chennai, India. Located in the neighbourhood of Thiruvallikeni, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil literature canon of the Alvar saints from the 6th to 9th centuries CE and is classified as among the 108 Divya Desams dedicated to Vishnu. The name 'Parthasarathy' means the 'charioteer of Arjuna', referring to Krishna's role as a charioteer to Arjuna in the epic Mahabharata. It was originally built by the Pallavas in the 6th century by king Narasimhavarman I. The temple has icons of five forms of Vishnu: Yoga Narasimha, Rama, Gajendra Varadaraja, Ranganatha, and Krishna as Parthasarathy. The temple is one of the oldest structures in Chennai. There are shrines for Vedavalli Thayar, Ranganatha, Rama, Gajendra Varadar, Narasimha, Andal, Hanuman, Alvars, Ramanuja, Swami Manavala Mamunigal and Vedanthachariar. The temple subscribes to Vaikhanasa agama and follows Tenkalai tradition.","la":13.0539,"lo":80.2769,"fs":"Panguni Serthi, Pallava Utsavam, Ramanujar Utsavam, Vaikunda Ekadashi, Every Friday Sri Vedavalli Thayar Purappadu","cr":"Pallavas","ia":"Mohan Krishnan (talk)","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Tiruvallikeni1.jpg"},"61":{"t":"Thiruneermalai_(temple_complex)","d":"Brahmanda Purana refers this place Toyatri, meaning a mountain surrounded by water. Thiruneermalai, the modern Tamil name also means a sacred mountain surrounded by water. Among the eight sacred Vishnu temples where he manifested himself called \"Ashtaswayamvakta Kshetra\".","x":"The Thiruneermalai temple complex consists of two temples, the Ranganatha Temple and the Thiruneermalai Neervanna Perumal Temple. Both are Hindu temples in Thiruneermalai, a suburb of Chennai, Tamil Nadu, India. There are two temples, one at the top of the hill and other in the foothills. In all, the temple occupies an area of 15 acres (6.1 ha), with the lower shrine covering 3 acres (1.2 ha). The presiding deity of the temple in the foothills is Neervana Perumal in standing posture. Ranganatha is the presiding deity uphill and the shrine, vimana above the sanctum is called Ranga Vimana. There are images of Trivikrama and Narasimha around the first precinct. The temple tank is called the Kshira Pushkarini and it is believed to feed the waters of Vaikuntha, and the Ocean of Milk. The Karunya Pushkarini is the second tank, which is believed to have formed from the weeping of Narasimha, who was moved by the divine prayers of Prahlada. There are two other tanks called Svarna Pushkarini and Siddha Pushkarini.","la":12.9638,"lo":80.115,"ia":"Simply CVR","il":"CC BY 2.0","ip":"https://commons.wikimedia.org/wiki/File:Thiruneermalai_temple.jpg"},"62":{"t":"Nithyakalyana_Perumal_temple","d":"The sage Kalava had 360 daughters who wished to wed Varaha, and the site derives its name from the belief that Varaha marries a maiden here everyday.","x":"Nithyakalayana Perumal temple in Thiruvidandai, a village in Chennai, Chengalpattu district of the South Indian state of Tamil Nadu, is dedicated to Varaha, the boar avatar of the Hindu god Vishnu. Constructed in the Dravidian architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Nithyakalayana Perumal (Varaha) and his consort Lakshmi as Komalavalli Thayar. The original structure of the temple was built by the Pallavas during the 7th century CE, with later additions from the Cholas during the 11th century. A granite wall surrounds the temple, enclosing all its shrines. The temple tank is located opposite to the temple, outside the main entrance. The temple follows the Tenkalai tradition of worship.","la":12.7632,"lo":80.2425,"tw":"Kalyana Vimanam","tk":"Kalyana Theertham","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thiruvidanthai8.JPG"},"63":{"t":"Thirukadalmallai","d":"The temple is believed to be the birthplace of the Vaishnava Alvar saint Bhoothathalvar. Sthalasayana Perumal is believed to have appeared to sage Pundarika. The temple is one of the 32 Group of Monuments at Mahabalipuram that are declared as UN world heritage sites, but unlike others that are maintained by the Archaeological Survey of India, the temple is maintained and administered by the Hindu Religious and Endowment Board of the Government of Tamil Nadu.","x":"Sthalasayana Perumal Temple, (also called Thirukadalmallai) is located in Mahabalipuram, India. Constructed in the Pallavan style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desam dedicated to Vishnu, who is worshipped as Sthalasayana Perumal and his consort Lakshmi as Nilamangai Thayar. The temple is believed to have been built by the Pallavas, with later contributions from the Medieval Cholas, Vijayanagara kings, and Madurai Nayaks. The temple is believed to be the birthplace of the Vaishnava Alvar saint Bhoothathalvar. Sthalasayana Perumal is believed to have appeared to sage Pundarika. The temple is maintained and administered by the Hindu Religious and Endowment Board of the Government of Tamil Nadu.","la":12.6175,"lo":80.1933,"tw":"GaganaKriti Vimanam","tk":"Pundarika Pushkarni","ia":"Gowrishanker","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Thirukadalmallai_Temple.jpg"},"64":{"t":"Thirukkadigai","d":"The temple has twin hills, with the one of Yoga Narasimha called the Periya malai (big hill) 750 ft (230 m) tall and occupying an area of 1.25 acres (5,100 m2). The top of the hill is approached through a flight of 1,305 steps. The temple is seen as one of the famous temples of Narasimha and a powerful image of Hanuman. Manavala Mamunigal is believed to have performed enunciation of Thirupavai at this place on the request of his disciple Erumbiappa. The town originally was under the control of Shaivites which is substantiated by the temple ruins near Parappan Kulam, in the valley between two hills. This is where original Sholinghur was situated.","x":"Thirukkadigai or Sholingapuram is a temple in Sholinghur, a village in Ranipet district of the South Indian state of Tamil Nadu, dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is mentioned in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Lakshmi Narasimhar, and his consort Lakshmi as Thirumamagal. There are three separate shrines in the form of Narasimha, Bhaktavatsala Perumal and Hanuman (Anjaneya). They are situated on the larger hill, at the base of the larger hill and on the smaller hill, respectively. A granite wall surrounds the temple, enclosing all its shrines uphill. The temple has a five-tiered rajagopuram at the top of hill, while the temple tank is located opposite the temple, outside the main entrance in the foothills. The temple follows Tenkalai tradition of worship.","la":13.0937,"lo":79.4246,"fs":"Vaikuntha Ekadashi, Krishna Janmashtami, Purattasi Saturdays","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Sholingar_(15).JPG"},"65":{"t":"Thirunavaya_Temple","d":"Regarded to be the site where Lakshmi and Gajendra offered worship to Vishnu.","x":"Tirunavaya Temple (in full Tirunavaya Navamukunda Temple) is an ancient Hindu temple at Tirunavaya, central Kerala, India, on the northern bank of the Bharatappuzha (River), dedicated to Navamukundan (Narayana-Vishnu). The temple is glorified in Divya Prabandha, an early medieval Tamil collection of hymns by the Vaishnava Alvars. It is one of the 108 Divya Desams dedicated to god Vishnu, who is worshipped as Navamukunda Perumal at Tirunavaya. The temple has no pond or well, and water from the river is used for all rituals. The presence of Cherutirunavaya Brahma - Siva Temples across the River Ponnani at Tavanur makes it a Trimurti sangama. The river bank in the temple are considered as holy as Kasi and the ritual offering practices for forefathers (bali tarpana/sradha puja) are similar to the ones done there. Ganapati (Adi Ganesa/Gajendra), Lakshmi (\"Malarmangai Nachiyar\") and Ayyappa Swami are the associated pratishthas. Goddess Lakshmi has a separate sri kovil in the temple, unlike most of the other Narayana-Lakshmi temples.","la":10.3607,"lo":76.8365,"ia":"RajeshUnuppally at Malayalam Wikipedia","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Thirunavaya_Navamukunda_Temple.JPG"},"66":{"t":"Abaya_Pradhan_Temple","d":"The temple is regarded to have been built by Parashurama for the veneration of Shiva.","x":"Thirumittakode Anchumoorthi Temple (also called Thiruviththuvakkōdu) is a Hindu temple equally associated with the deities Vishnu and Shiva. Temple is situated on the banks of the Bharathappuzha at Thirumittacode of Palakkad District in Kerala state in India. The five statues - one for Shiva and four Vishnu - are known here as Thirumattikodu five (Anchu) Moorthy Temple. As a Shiva temple, it is regarded as 108 Shivalayam of Shaivas. Constructed in the Kerala style of architecture, It is one of the 108 Divyadesam dedicated to Vishnu, who is worshipped as Uyyavandha Perumal and his consort Lakshmi as Vithuvakootuvalli. The Thiruvonam festival and the Vaikunta Ekadasi during the month of Thai are the major festivals celebrated in the temple. The temple is open from 4 am to 11 am and 5 pm to 8 pm and is administered by Travancore Devaswom Board of the Government of Kerala. The temple contains a rare Chola record of emperor Rajendra I (r. 1012–1044 AD) from Kerala.","la":10.3607,"lo":76.8365,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thiruvithuvakoodu_(3).jpg"},"67":{"t":"Kaatkaraiappan_Temple","d":"Associated with the Vamana avatar and the humbling of Mahabali.","x":"Thrikkakara Vamanamoorthy Temple is one of the major Hindu temples in India dedicated to Vamana, a form of the god Vishnu. It is situated in Thrikkakara, Kochi in the state of Kerala, India. The temple is around two millennia old and is also listed as one of the 108 Divya Desams (divine places). The main temple festival is during the Onam season, which falls on the month of August or September and is the most important event of the religious calendar here. After East India Company and Marthandavarma annexed the territory from Kingdom of Kochi, the Onam festival was jointly organized by the 61 Naduvazhis (local rulers) under the leadership of the Maharaja of Travancore, till India regained independence. Communal harmony continues to be the hallmark of the celebrations, with people belonging to different religions turning out in large numbers for the Onasadya or the Onam feast in keeping with the spirit of the festival. Apart from Onam, the temple also observes important festivals in the Hindu calendar such as Vishu, Makara Sankranti, Navarathri and Saraswati Puja.","la":10.3607,"lo":76.8365,"ia":"Ssriram mt","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Thirukatkarai3.jpg"},"68":{"t":"Moozhikkalattappan_Temple","d":"Rama's brothers Lakshmana and Bharata are believed to have prayed to Vishnu in this temple.","x":"Thirumoozhikulam Sree Lakshmanaperumal Temple is located in Thirumoozhikalam (Moozhikkulam) in Ernakulam district of Kerala, India. The temple finds mention in some of verses of ancient Tamil Vedam (Nalayira Divya Prabhandham) sung by the Sri Vaishnava Alvars, particularly Nammalvar and Tirumangai Alvar and classified as Divya Desams, the 108 holy temples revered in the canon. This belongs to one of the 13 Malai Naatu (Kerala/Chera) Divya Desams, the Divya Desams located in Kerala. The temple is associated with the legend of Ramayana where Rama's brother Lakshmana worshipped Rama along with their other brother Bharatha here. The presiding deity took the form of Lakshmana and worshipped here. The temple is one of the four temples that are part of Nalambalam Yatra - Rama at Thriprayar, Bharata at Irinjalakuda, Lakshmana at Moozhikkulam and Shathrughna at Payammal. The temples are believed to be of significant antiquity with contributions at different times by the ruling empires. Constructed in Kerala style architecture, the temple is enshrined within granite walls.","la":10.3607,"lo":76.8365,"tw":"Soundarya Vimanam","tk":"Poorna Nadi (Sanskrit),, Chalakkudy Puzha, (local name)","fd":"Standing, (Nindra thirukolam), Facing East, (Kizhake thirumuga mandalam)","ia":"Ssriram mt","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Thirumoozhikalam2.jpg"},"69":{"t":"Sree_Vallabha_Temple","d":"Lakshmi, the daughter of the sea, is regarded to have prayed to Vishnu for the boon of marrying him in this site.","x":"The Sreevallabha Temple is an orthodox Hindu temple dedicated to Sreevallabha (Vallabha meaning consort of Sree or Lakshmi), a form of Vishnu. It is located in Thiruvalla, Pathanamthitta district, Kerala state.","la":9.4272,"lo":76.8173,"tw":"Chaturanga Kola Vimanam","tk":"Jalavanthi Theertham","fd":"Sreevallabhan & Sudarshanamoorthy standing; Sreevallabhan facing east, and Sudarshanamoorthy facing west","fs":"Uthra Sree Bali","ws":"http://www.srivallabhatemple.org","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Sree_Vallaba_Temple_5.JPG"},"70":{"t":"Thrikodithanam_Mahavishnu_Temple","d":"Believed to be the temple constructed by the Pandava Sahadeva during a pilgrimage, after the coronation of Parikshit.","x":"Thrikodithanam Mahavishnu Temple is a Hindu temple dedicated to Vishnu and located in Thrikkodithanam, Kottayam District, Kerala, South India. Constructed in the Kerala style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desam dedicated to Krishna, an avatar of Vishnu, who is worshipped as Mahavishnu. The nearest railway station to the temple is located in Changanassery, while the nearest airport is Cochin International Airport. It is one of the five ancient shrines in the Kottayam-Alappuzha-Pathanamthitta area of Kerala, connected with the legend of Mahabharata, where the five Pandavas are believed to have built one temple each; Thrichittatt Maha Vishnu Temple by Yudhishthira, Puliyur Mahavishnu Temple by Bheema, Aranmula Parthasarathy Temple by Arjuna, Thiruvanvandoor Mahavishnu Temple by Nakula and Thrikodithanam Mahavishnu Temple by Sahadeva.","la":9.4272,"lo":76.8173,"ws":"http://www.thrikodithanamtemple.com/","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thrickodithanam_8.JPG"},"71":{"t":"Imayavarappa_Perumal_Temple","d":"It is one of the five ancient shrines in the Chengannur area of Kerala, connected with the legend of Mahabharata, where the five Pandavas are believed to have built one temple each; the temple is believed to have been built by Yudhishthira. The Imayavar (devas) came to this place prior to Yudhishthira, and hence the deity here is referred as Imayavarappar. There is another version that the Pandavas worshipped the idols during their reign, and started installing them in different places during the end of their reign.","x":"The Thrichittatt Mahavishnu Temple (also called Thiruchenkundrur and Imayavarappan temple) is a Hindu temple dedicated to Vishnu, located in Chengannur, Alappuzha District, Kerala, South India. Constructed in the Kerala style of architecture, the temple is glorified in the Nalayira Divya Prabandham, by Nammalvar, one of the Sri Vaishnava saint-poets of the 8th century called the Alvars. It is one of the 108 Divya Desams dedicated to Krishna, an avatar of Vishnu, who is worshipped as Imayavarappan. The nearest railway station to the temple is located in Chengannur, while the nearest airports are Trivandrum International Airport and Cochin International Airport Ernakulam. It is one of the five ancient shrines in the Chengannur area of Kerala, connected with the legend of Mahabharata, where the five Pandavas are believed to have built one temple each; Thrichittatt Maha Vishnu Temple by Yudhishthira, Puliyur Mahavishnu Temple by Bhima, Aranmula Parthasarathy Temple by Arjuna, Thiruvanvandoor Mahavishnu Temple by Nakula and Thrikodithanam Mahavishnu Temple by Sahadeva.","la":9.4272,"lo":76.8173,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thrichittatt_Maha_Vishnu_Temple1.JPG"},"72":{"t":"Mayapiran_Temple","d":"Believed to be the temple constructed by the Pandava prince Bhima during a pilgrimage, after the coronation of his grand-nephew Parikshit.","x":"The Thripuliyoor Mahavishnu Temple (also called Mayapiran temple) is a Hindu temple dedicated to Vishnu and located in Puliyoor, Alappuzha District, Kerala, South India. Constructed in the Kerala style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Mayapiran/Thripuliyoorappan. The nearest railway station to the temple is located at Chengannur, while the nearest airport is Trivandrum International airport. It is one of the five ancient shrines in the Chengannur area of Kerala, connected with the legend of Mahabharata, where the five Pandavas are believed to have built one temple each; Thrichittatt Maha Vishnu Temple by Yudhishthira, Puliyoor Mahavishnu Temple by Bhima, Aranmula Parthasarathy Temple by Arjuna, Thiruvanvandoor Mahavishnu Temple by Nakula and Thrikodithanam Mahavishnu Temple by Sahadeva.","la":9.4272,"lo":76.8173,"fs":"Kavadi maholsavam","ia":"Dvellakat","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Puliyoor.JPG"},"73":{"t":"Aranmula_Parthasarathy_Temple","d":"Believed to be the temple constructed by the Pandava prince Arjuna during a pilgrimage, after the coronation of his grandson Parikshit.","x":"The Aranmula Parthasarathy Temple is a Hindu temple located in Aranmula, a village in Pathanamthitta District, Kerala, South India, on the southern bank of Pamba river, the third longest river in Kerala. It is dedicated to the Lord Krishna, who is worshipped as Parthasarathy (Arjuna's charioteer). Constructed in the Kerala style of architecture, it is one of the \"Divya Desams\", the 108 temples of Vishnu revered by the Alvar saints. It is one of the most important Krishna temples in Kerala and is one of the five ancient shrines in Kerala, connected with the legend of the Mahabharata, where the five Pandavas are believed to have built one temple each; Aranmula is built by the Pandava prince Arjuna. The sacred jewels, called Thiruvabharanam of Ayyappan are taken in procession to Sabarimala each year from Pandalam, and Aranmula Temple is one of the stops on the way. Also, the Thanka Anki, golden attire of Ayyappan, donated by the king of Travancore, is stored here and taken to Sabarimala during the Mandala season of late December.","la":9.3554,"lo":76.7603,"fs":"Aranmula Boat Race","ia":"Sudhirn","il":"CC BY 3.0","ip":"https://commons.wikimedia.org/wiki/File:Aranmula_Temple.JPG"},"74":{"t":"Pambanaiappan_Temple","d":"It is one of the five ancient shrines in the Chengannur area of Kerala, connected with the legend of Mahabharata, where the five Pandavas are believed to have built one temple each; this temple is believed to have been built by Nakula. Earliest references to this temple appear in the verses and hymns composed by the greatest of Alvar saints – Nammalvar, in circa 800 CE. Stone inscriptions in the temple date it back to the Second Chera Empire (800–1102 CE).","x":"The Thiruvanvandoor Mahavishnu Temple is a Hindu temple dedicated to Vishnu and located in Thiruvanvandoor, Alappuzha District, Kerala, South India. Constructed in the Kerala style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Paambanaiappan. The nearest railway station to the temple is located in Chengannur, while the nearest airport is Trivandrum International Airport. It is one of the five ancient shrines in the Chengannur area of Kerala, connected with the legend of Mahabharata, where the five Pandavas are believed to have built one temple each; Thrichittatt Maha Vishnu Temple by Yudhishthira, Puliyur Mahavishnu Temple by Bheema, Aranmula Parthasarathy Temple by Arjuna, Thiruvanvandoor Mahavishnu Temple by Nakula and Thrikodithanam Mahavishnu Temple by Sahadeva. The temple is open from 4 am to 11:00 am and 5 pm to 8 pm and is administered by Travancore Devaswom Board of the Government of Kerala.","la":9.3554,"lo":76.7603,"ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thiruvanvandoor_Pambanaiappan_Temple_1.JPG"},"75":{"t":"Sri_Padmanabhaswamy_temple","d":"It is widely regarded to be the richest shrine in India and is the dynastic deity of Travancore. Here, Vishnu's large idol can be viewed from three doors.","x":"The Padmanabhaswamy Temple (Malayalam: [pɐd̪mɐnaːbʰɐswaːmi]) is a Hindu temple dedicated to Vishnu in Thiruvananthapuram, Kerala, India. It is one of the 108 Divya Desams which are considered the sacred sites of the Sri Vaishnava tradition. The temple's principal deity is Anantha Padmanabhaswamy, a form of Vishnu depicted in yogic sleep, on his serpent mount named Shesha. Padmanabhaswamy is the tutelary deity of the Travancore royal family. The titular Maharaja of Travancore, Moolam Thirunal Rama Varma, is the current trustee of the temple.","la":8.534,"lo":76.9279,"ws":"https://spstt.org/","ia":"Shishirdasika","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Padmanabhaswamy_Temple_Thiruvananthapuram.jpg"},"76":{"t":"Sri_Adikesavaperumal_Temple","d":"The site is associated with the legend of Krishna killing the demon Keshi.","x":"The Adikesava Perumal Temple is a Perumal temple located in Thiruvattar, Kanyakumari district, Tamil Nadu, India and is one of the 108 Divya desams, the holy sites of Hindu Vaishnavism in existing Tamil hymns from the seventh and eighth centuries CE. The temple is one of the historic thirteen Divya Desams of Malai Nadu. The temple is a picturesque setting surrounded on three sides by rivers namely, (River Kothai, River Pahrali and River Thamirabarani) It was the Rajya Temple and Bharadevatha shrine of Erstwhile Travancore. After state reorganisation, the temple was handed over to Tamil Nadu H&RCE Dept. Since Vishnu resides here in a reclining position, and is surrounded by rivers, the temple is called as \"The Srirangam of Chera Kingdom\". The temple was consecrated by Parasurama and is admired by Veda vyasa in the sections which deal with temples in Padma Purana. As per the stone inscriptions which dates back to 779 KE the temple is established in the Treta yuga.","la":8.369,"lo":77.2417,"fs":"Vaikuntha Ekadashi, Krishna Janmashtami","ia":"Infocaster at English Wikipedia","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Thiruvattar_Adhi_Kesava_Temple.JPG"},"77":{"t":"Thiruvazhmarban_temple","d":"Kulashekara Alvar is believed to have constructed the temple after bathing in a nearby water tank.","x":"The Thiruvazhmarban Temple, also known as Sri Kuralappa Perumal Temple in Thiruppathisaram, a village in Kanyakumari district in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Thiruvazhmarban Temple is located about 5 km far, north-easterly to Nagercoil, 20 km far, north-westerly to Kanyakumari and 45 km south-west of Nanguneri Divya Desam. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams of malayala nadu divyadesham dedicated to Vishnu, who is worshipped as Thiruvazhmarban and his consort Lakshmi as Kamalavalli in kerala tantric traditions . The oldest inscription in the temple is from 1139 CE indicating gifts to the temple. A granite wall surrounds the temple, enclosing all its shrines. The temple tank is located opposite to the temple, outside the main entrance.","la":8.2542,"lo":77.4703,"ia":"Ssriram mt","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Thriuppathisaram.jpg"},"78":{"t":"Vaishnava_Nambi_and_Thirukurungudivalli_Nachiar_Temple","d":"Vishnu is regarded to have assumed his Varaha avatar and stayed here with his consort, Bhumi, both assuming a small stature.","x":"Vaishnava Nambi and Thirukurungudivalli Nachiar Temple in Thirukkurungudi, a village in Tirunelveli district in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. It is located 45 km from Tirunelveli. Constructed in the Dravidian style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Vaishnava Nambi and his consort Lakshmi as Thirukurungudivalli. The temple is locally referred as Dakshina Vaikuntam, the holy abode of Vishnu. A granite wall surrounds the temple, enclosing all its shrines and two of its three bodies of water. The rajagopuram, the temple's gateway tower, is 110 ft (34 m) tall. Vaishnava Nambi is believed to have appeared to slay the asura Somuka who abducted the four Vedas. The temple follows Tenkalai tradition of worship.","la":8.4369,"lo":77.5259,"ia":"Donkey.tail","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Thirukarungudi_temple.jpg"},"79":{"t":"Sri_Vanamamalai_Perumal_Temple","d":"Lakshmi is believed to have been born here in one of her earthly incarnations.","x":"The Vanamamalai Perumal Temple, also known as Arulmigu Sree Vanamamalai Totatri Perumal Temple, is a Hindu temple dedicated to the god Vishnu, in Vanamamalai or Totadrikshetram (Nanguneri), Tamil Nadu, India on the banks of Thamiraparani river. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams shrines dedicated to Vishnu. Vishnu is worshipped here as Vanamalai Perumal and his consort Lakshmi as Varamangai. The temple is believed to have been built by the Pandyas, with later contributions from Vijayanagara kings and Madurai Nayaks. The temple covers an area of 5 acres (20,000 m2) and has a five-tiered temple tower. The temple is one of the eight Svayambu Kshetrams, the eight temples associated with Vishnu, that manifested on its own. Vanamamalai is believed to have appeared to Adishesha and Garuda.","la":8.4369,"lo":77.5259,"tw":"Nandhavarthana Vimanam","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Naguneri18.jpg"},"80":{"t":"Srivaikuntanathan_Permual_Temple","d":"Vishnu assumed his Matsya avatar to retrieve the Vedas from a demon and return them to Brahma, after which he resided here for a while.","x":"Srivaikuntanathan Perumal Temple (also called Srivaikuntam temple and Kallapiran temple) in Srivaikuntam, a town in Thoothukudi district in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. It is located 22 km from Tirunelveli. Constructed in the Tamil style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Vaikunthanathar and his consort Lakshmi as Vaikunthavalli. The temple is also classified as a Nava Tirupati, the nine temples revered by Nammalvar located in the banks of Tamiraparani river. The temple is next only to Alwarthirunagari Temple in terms of importance among the nine Navatirupathi temple. The temple is one of the Navagraha temples in Vaishnavism, associated with Surya, the sun god. A granite wall surrounds the temple, enclosing all its shrines and two of its three bodies of water. The rajagopuram, the temple's gateway tower, is 110 ft (34 m) tall.","la":8.6097,"lo":77.976,"tw":"Chandra","tk":"Brighu","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Srivaikuntam6.jpg"},"81":{"t":"ThiruVaragunamangai_Perumal_Temple","d":"A sage named Vedavitha performed penance after the death of his parents. Vishnu appeared in the form of a Brahmin, and advised him to perform a penance at Varagunamangai. After several years of penance and pleased by the devotion of Vedavitha, Vishnu appeared before him. Vedavitha requested Vishnu to appear as Vijayasnar at this place.","x":"Thiruvaragunamangai Perumal Temple (also called Vijayasana Perumal) is one of the Nava Tirupati, the nine Hindu temples dedicated to Vishnu located in the Tiruchendur-Tirunelveli route, Tamil Nadu, India in the banks of Thamiraparani river. All these 9 temples are classified as Divya Desams, the 108 temples of Vishnu revered by the 12 poet-saints of the Sri Vaishnava tradition, called the Alvars. The temple at Natham also known as Chandran Sthalam, the second of the Nava Tirupatis. Constructed in the Dravidian style of architecture, the temple is dedicated to Vishnu who is worshipped as Vijayasana Perumal and Lakshmi as Varagunavalli. A granite wall surrounds the temple, enclosing all its shrines. The rajagopuram, the temple's gateway tower has five tiers. The temple follows Tenkalai tradition of worship.","la":8.6097,"lo":77.976,"tw":"Vijaykotti","tk":"Agni","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Varagunamangai1.jpg"},"82":{"t":"ThiruPulingudi_Perumal_Temple","d":"Regarded to be the site where Vishnu appeased the jealous Bhudevi, the second aspect of Lakshmi, appearing with Sridevi.","x":"The Thirupuliyangudi Perumal Temple is one of the Nava Tirupati, the nine Hindu temples dedicated to Vishnu located in Tiruchendur-Tirunelveli route, Tamil Nadu, India in the banks of Thamiraparani river, in the South Indian state of Tamil Nadu. It is dedicated to the Hindu god Vishnu who is worshipped as Bhumipalar and Lakshmi as Pulingudivalli. It is located 22 km from Tirunelveli. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu. The temple is also classified as a Nava Tirupati, the nine temples revered by Nammalvar located in the banks of Tamiraparani river. The temple is one of the Navagraha temples in the region, associated with Budha. A granite wall surrounds the temple, enclosing all its shrines. The rajagopuram, the temple's gateway tower, is flat in structure. The temple follows Tenkalai tradition of worship.","la":8.6097,"lo":77.976,"tw":"Veda saara","tk":"Varuna","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thirupuliyangudi3.jpg"},"83":{"t":"Irattai_Thiruppathy","d":"Regarded to be the site Vishnu blessed the sage Suprabha.","x":"Irattai Tirupati Temples refer to two temples of the Nava Tirupati, namely, the Devapiran temple and Aravindalochanar temple, which are dedicated to Vishnu. They are part of the nine \"Divya Desams\" located along the Tiruchendur-Tirunelveli route in Tamil Nadu, India on the banks of Thamiraparani river. The two temples are located adjacent to each other. All nine temples are part of the 108 temples of Vishnu revered by the 12 poet saint Alvars. The Irattai Tirupati is a Ketu Sthalam, sacred to the deity Ketu. Constructed in the Dravidian style of architecture, the temples are dedicated to Vishnu who is worshipped as Devapiran and Aravindalochanar and Lakshmi as Varagunavalli and Karuthadankanni. A granite wall surrounds both the temples, enclosing their shrines. The rajagopuram (the temples' gateway tower) has a flat structure. The temples follow the Tenkalai tradition of worship. The ten-day annual Vaikuntha Ekadashi festival held during the Tamil month of Margali (December–January) and the Nammalvar birth celebrations with Garudasevai are the two most prominent.","la":8.6097,"lo":77.976,"tw":"Kumuda","tk":"Varuna","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Aravinda_Lochanar_temple2.jpg"},"84":{"t":"Sri_Srinivasa_Perumal_Temple,_Tirukulandhai","d":"An asura once abducted Kumudhavalli, the wife of a Vaishnava. The asura was vanquished by Vishnu, who danced on his head, and restored Kumudhavalli to her husband.","x":"Sri Srinivasa Perumal Temple or Sri Mayakoothar Permual Temple is one of the Nava Tirupatis, nine Hindu temples dedicated to Vishnu located Perungulam along Tiruchendur-Tirunelveli route, Tamil Nadu, India in the southern bank of Thamiraparani river. It is located 5 km from Alvar Thirunagari. All these 9 temples are classified as Divya Desams, the 108 temples of Vishnu revered by the 12 poet-saints of Sri Vaishnavism called the Alvars. The temple is referred to as Shani sthalam, a location for the planet deity, Shani (Saturn). Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Mayakoothar and his consort Lakshmi as Kulandhaivalli Tayar. A granite wall surrounds the temple, enclosing all its shrines. The rajagopuram, the temple's gateway tower, is three-tiered in structure. The temple follows the Tenkalai tradition of worship.","la":8.607,"lo":77.9505,"tw":"Ananda Nilaya","tk":"Perungulam","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thirukulandhai1.jpg"},"85":{"t":"Vaithamanidhi_Perumal_Temple","d":"Regarded to be the site Vishnu relieved Kubera of his financial misfortune.","x":"Vaithamanidhi Permual Temple (also called Thirukolur) is one of the nine Nava Tirupathi, the Hindu temples dedicated to Vishnu. It is located on the village of Thirukkolur which is located on Thoothukudi district of Tamil Nadu, India. The village is 4 km away from Alwarthirunagari. It is the eighth temple of Nava Tirupathi, and is named after Mars (Sevvai) and also called Kuberasthalam. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Vaithamanidhi Perumal and his consort Lakshmi as Kolurvalli. A granite wall surrounds the temple, enclosing all its shrines. The rajagopuram, the temple's gateway tower, is three-tiered in structure. The temple follows Tenkalai tradition of worship.","la":8.6065,"lo":77.9739,"tw":"Srikara","tk":"Kubera","ws":"http://navathirupathitemples.tnhrce.in/","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thirukkolur3.jpg"},"86":{"t":"Makara_Nedunkuzhai_Kannan_Temple","d":"Believed to be the site where Bhudevi's beauty was restored after being cursed by Durvasa.","x":"The Makara Nedunkuḻaikathar Temple is one of the Nava Tirupathi, nine Hindu temples dedicated to Vishnu located Thenthiruperai along Tiruchendur-Tirunelveli route, Tamil Nadu, India in the southern bank of Thamiraparani river. It is located 5 km from Alvar Thirunagari All these 9 temples are classified as Divya Desams, the 108 temples of Vishnu revered by the 12 poet saints, or Alvars. The temple is referred to as Sukra sthalam, a location for the planet deity, Sukra. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Makara Nedunkuḻaikathar and his consort Lakshmi as Tiruperai Nachiyar. A granite wall surrounds the temple, enclosing all its shrines. The rajagopuram, the temple's gateway tower, is flat in structure. The temple follows Thenkalai tradition of worship.","la":8.6065,"lo":77.9739,"tw":"Bhadra","tk":"Shukra, Shankha","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Then_Thirupperai3.jpg"},"87":{"t":"AlwarThirunagari_Temple","d":"Associated with Nammalvar and Madhurakavi Alvar.","x":"Sri Adinatha Aazhwar Temple, or Adinatha Perumal Temple, is a Hindu temple dedicated to the god Vishnu, situated in the town of Alwarthirunagari, Thoothukudi district, in the Indian state of Tamil Nadu. It is located 26 km from Tirunelveli. Constructed in the Dravidian style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alwar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Adinathar and his consort Lakshmi as Adinathanayaki. The temple is also classified as a Navatirupathi, the nine temples revered by Nammalvar located in the banks of Tamiraparani river. The temple is the most prominent among the nine Navatirupathi temples. The temple is one of the Navagraha temples in Vaishnavism, associated with Jupiter, also known as Brihaspati. A granite wall surrounds the temple, enclosing all its shrines and two of its three bodies of water. The rajagopuram, the temple's gateway tower, is 95 ft (29 m) tall.","la":8.607,"lo":77.9505,"tw":"Govinda Gopuram","tk":"Brahma Theertham","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Azhwar_Thirunagari9.jpg"},"88":{"t":"Srivilliputhur_Andal_Temple","d":"Regarded to be the site where the deity Ranganatha of Srirangam married his ardent devotee and Alvar, Andal.","x":"The Srivilliputhur Andal Temple in Srivilliputhur, a town in Virudhunagar district in the South Indian state of Tamil Nadu, It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Vatapatrasayi and his consort Lakshmi as Andal. It is believed to be the birthplace of two of the Alvars, namely Periyalvar and his foster-daughter, Andal. The temple is located 80 km from Madurai. Constructed in the Tamil Architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. The temple is associated with the life of Andal, who was found under a tulasi plant in the garden inside the temple by Periyalvar. She worn the garland before dedicating it to the presiding deity of the temple. Periyalvar, who later found it, was highly upset and stopped the practice. Vishnu appeared in his dream and asked him to dedicate the garland worn by Andal to him daily, which is a practice followed during the modern times.","la":8.607,"lo":77.9505,"fs":"Aani Alvar Uthsavam (June–July) Thiruvadipooram (August) Purattasi Utsavam (October) Ennaikappu (December–January) Panguni Thirukkalyana Utsavam (March–April)","cr":"Chola, Pandya, and Vijayanagara Kings","ia":"Gauthaman","il":"Public domain","ip":"https://commons.wikimedia.org/wiki/File:Andal_Temple.jpg"},"89":{"t":"Ninra_Narayana_Perumal_temple","d":"The temple in its present form was believed to have been built by Devendra Vallabha, a Pandya king. The temple has three inscriptions in its two rock-cut caves, two dating from the period of the 8th century. Ninra Narayana is believed to have appeared to Sridevi and Bhudevi. Ranganatha from the Srirangam Ranganathaswamy temple is believed to have been enamoured by the devotion of Andal. He started a journey to Srivilliputhur Divya Desam to seek her hand for marriage. While reaching the place, it became dark, and he decided to spend the night in the place. Since he stayed at this place, it came to be known as Thiruthangal and the hillock came to be known as Thalagiri.","x":"Ninra Narayana Perumal Temple (also called Nindra Narayana Perumal Temple) in Thiruthangal, a neighborhood of Sivakasi City Municipal Corporation in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Divya Prabandha, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries AD. It is one of the 108 Divya Desam dedicated to Vishnu, who is worshipped as Ninra Narayana and his consort Lakshmi as Arunakamala Mahadevi. The temple in its present form was believed to have been built by Devendra Vallabha, a Pandya king. The temple has three inscriptions in its two rock-cut caves, two dating from the period of 8th century. The temple is built on a granite hill 100 ft (30 m) tall and a granite wall surrounds the temple, enclosing all its shrines and bodies of water. Unlike other temples, this temple does not have a rajagopuram, the temple's gateway tower. The later Pandya kings, Vijayanagara and Nayak kings in the region made significant additions to the temple.","la":9.0107,"lo":77.8853,"ins":"3","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thiruthankal_temple_(1).jpg"},"90":{"t":"Koodal_Azhagar_Temple","d":"Historians are of the opinion that Koodal Aḻagar temple finds mention in Sangam literature (3 century BCE – 3 century CE) in works like Madurai Kanchi by Mangudi Marudan, Paripāṭal, Kaliththokai and Silappatikaram. Periyalvar obtained the name as he is believed to be an ardent worshipper of Vishnu. While coming out of Madurai, he was taken out in procession to Srivilliputhur and he got the divine vision of Vishnu at the instance. He started reciting his composition, Periya Tirumoḻi, which was compiled in the Naalayira Divya Prabhandam by Manavala Mamunigal.","x":"Koodal Aḻagar Temple or Koodal Azhagar Temple in Madurai, a city in the South Indian state of Tamil Nadu, is a temple dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is mentioned in the Divya Prabandha, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Viyooga Sundarrajan, and his consort Lakshmi as Mathuravalli. A granite wall surrounds the temple, enclosing all its shrines. The temple has a five-tiered rajagopuram, the gateway tower. The temple is originally believed to be built by the Pandyas, with later additions by the Vijayanagara Empire and Madurai Nayaks kings who commissioned pillared halls and major shrines of the temple during the 16th century. The temple follows the Tenkalai tradition of worship. Four daily rituals and three yearly festivals are held at the temple, of which the fourteen-day annual Brahmotsavam during the Tamil month of Vaikasi (May - June) being the most prominent.","la":9.9886,"lo":78.2643,"tw":"Ashtanga Vimanam","tk":"Hema Pushkarani","ws":"http://www.koodalalagartemple.tnhrce.in/","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Koodalazhagar_(15).jpg"},"91":{"t":"Kallazhagar_Temple","d":"Kallaḻagar was worshipped by Yama, the Hindu god of death. He requested Vishnu to stay in the place and built a temple with the help of Vishvakarma, the divine architect. Kallaḻagar is believed to have appeared to redeem sage Suthapava off his curse from sage Durvasa. The temple houses some rare Vijayanagara sculptures.","x":"Kallalagar Temple or Kallazhagar Temple, also known by its own toponym Thirumaliruncholai, is a Hindu temple dedicated to the Hindu protector god Vishnu in Alagar Koyil, a village in Madurai district in the South Indian state of Tamil Nadu. Constructed in the Tamil Style of Architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Azhvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshiped as Kallalagar, and his consort Lakshmi as Thirumagal. This temple is called as Thirumaliruncholai in Sangam literatures and Naalayira Divya Prabandham sung by Tamil Alvar saints. A granite wall surrounds the temple, enclosing all its shrines. The temple has a seven-tiered rajagopuram. The temple is surrounded by a large fort, part of which is dilapidated. The temple is also the shrine for the Tamil village deity Karuppuswami, who is worshipped as 18 granite steps behind a closed door. The door is only opened annually once during the Aadi month (July–August).","la":9.9886,"lo":78.2643,"tw":"Somachandra Vimanam","fs":"Float festival; Chitirai Thiruvila; Navaratri; Vaikunta Ekadashi","ws":"https://alagarkoilkallalagar.hrce.tn.gov.in","ia":"TAMIZHU","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:AzhagarKovil_Madurai.JPG"},"92":{"t":"Kalamegha_Perumal_temple","d":"According to Hindu legend, the presiding deity is believed to have appeared as a female Mohini to lure the asuras to support the devas, the celestial deities. The temple is also known as Mohanapuram and Mohanakshetram.","x":"The Thirumohoor Kalamegaperumal Temple (also known as Thirumohoor or Tirumogoor temple) is a Hindu temple near Melur, Madurai district in the Indian state of Tamil Nadu, to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Kalamega Perumal and his consort Lakshmi as Mohanavalli Thayar. As per Hindu legend, the presiding deity is believed to have appeared as the divine enchantress Mohini to allure the asuras to support the devas, the celestial deities. The temple is also known as Mohanapuram and Mohanakshetram. A granite wall surrounds the temple, enclosing all its shrines and three of its four bodies of water. The temple has a five-tiered rajagopuram, the temple's gateway tower and a huge temple tank in front of it. The temple is believed to have been built by the Pandyas, with later additions from the Madurai Nayaks.","la":9.9886,"lo":78.2643,"tw":"Kethaki Vimanam","tk":"Kshirabtha Pushkarini","fs":"Brahmotsavam; Vaikunta Ekadasi; Gajendra Moksham; Thirukalyanam; Krishna Jayanthi","ws":"http://kalamegaperumaltemple.tnhrce.in/","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Tirumohur_(9).jpg"},"93":{"t":"Sowmya_Narayana_Perumal_temple","d":"The temple is known as the place where Ramanuja, the expounder of Vaishnavadatta philosophy preached the mantra \"Om Namo Narayana\" to all people irrespective of their birth. Sowmyanarayana Perumal is believed to have appeared as Narasimha avatar to the devas, the celestial deities.","x":"Sowmyanarayana Perumal Temple is an ancient temple located in Thirukoshtiyur, a village in the South Indian state of Tamil Nadu, dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Sowmyanarayana Perumal and his consort Lakshmi as Thirumamagal. The temple is known as the place where Ramanuja, the expounder of Vishishtadvaita philosophy preached the holy ashtakshara \"Om Namo Narayanaya\" to all people, irrespective of their varna. A granite wall surrounds the temple, enclosing all its shrines. The temple features a five-tiered rajagopuram or, the gateway tower and an impressive Ashtanga Vimana, which is even taller than the gopuram itself.The temple tank is located opposite to the temple, outside the main entrance. Sowmyanarayana Perumal is believed to have appeared as Narasimha avatar to the devas, the celestial deities.","la":9.9886,"lo":78.2643,"tw":"Ashtanga Vimanam","ia":"Ssriram mt","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Sowmyanarayana_Perumal_(8).jpg"},"94":{"t":"Adi_Jagannatha_Perumal_Temple","d":"The temple is believed to have been built during the late 8th century CE, with later contributions from Medieval Cholas, later Pandyas, Sethupathi Kings of Ramnad. According to Hindu legend, Rama is believed to have done penance to worship Varuna to seek a path to Lanka upon the grass, giving the name Dharbasayanam to the place.","x":"The Adi Jagannatha Temple is a South Indian Hindu temple in Thiruppullani, a village in the outskirts of Ramanathapuram in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. It is believed that Rama used grass ('pul' in Tamil as a pillow (thalai annai in Tamil) to sleep and hence the village attained the name Thiruppullani. Constructed in the Cholan style of architecture, the temple is glorified in the Naalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desam dedicated to Vishnu, who is worshipped as Adi Jagannatha and his consort Lakshmi as Padmasini. The temple is believed to have been built during the late 8th century CE, with later contributions from Medieval Cholas, later Pandyas, Madurai Nayak kings, Sethupathi Palayam of Ramnad. As per Hindu legend, Rama is believed to have done penance to worship the god of ocean to seek way to Lanka in grass, giving the name Dharbasayanam to the place.","la":9.9886,"lo":78.2643,"tk":"Chakra Theertham","ia":"Mohan Krishnan (talk)","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Tirupullani1.jpg"},"95":{"t":"Thirumeyyam","d":"Historians believe that the temple was built during the 9th century by the Pandyas. M.A. Dhaky places the period to be the 7th decade of 9th century. He has also compared the images of the temple to that of Vijayalaya Choleeswaram in Narthamalai, built by Muttaraiyar kings during the same period. Another view is that the temple to have been built by a vassal of Pallavas following the rock-cut architecture of the group of monuments at Mahabalipuram built by Mahendravarman I (590-630 CE) and his son Narasimhavarman I.","x":"Sathyamurthi Perumal Temple in Thirumayam, a panchayat town in the South Indian state of Tamil Nadu, is dedicated to the Hindu god Vishnu. Constructed in the Dravidian style of architecture, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divya Desams dedicated to Vishnu, who is worshipped as Sathyamurthi Perumal and his consort Lakshmi as Ujeevana Thayar. The temple is believed to have been built during the 9th century by the Pallavas. A granite wall surrounds the temple, enclosing all its shrines. The temple has a five-tiered rajagopuram, the gateway tower and is behind a fort built during the 15th century. The temple tank is located inside the premises. The temple is maintained and administered by the Archaeological Survey of India as a protected monument. The temple follows the Tenkalai tradition of worship.","la":9.9886,"lo":78.2643,"ia":"Fxpremji","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Thirumayam_temple.jpg"},"96":{"t":"","d":"Thiruvayodhi is the birthplace and ruling city of Rama. The temple deemed Divya Desam shrine of Thiruvayodhi is the Ammaji Mandir of Ayodhya.","x":"","la":26.8051,"lo":82.1996,"ia":"Bhelki","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Vijayraghav_Mandir,_Ayodhya.jpg"},"97":{"t":"Naimisaranyam","d":"Regarded to be the site where Vishnu offered counsel to the heaven king Indra regarding defeating the demon Vritra. This is believed to be the place where the first Satyanarana Vrata (holy vow of Satyanarayana) was performed","x":"Shri Naimishnath Vishnu Temple, also known as the Naimishnath Devaraja temple or Naimishnarayan Temple or Ramanuj Kot Temple is a Hindu temple to Vishnu and Lakshmi in Uttar Pradesh in Naimisharanya town, Sitapur district. It is one of the Divya Desams, the 108 temples of Vishnu mentioned by Thirumangai Alvar in Nalayira Divya Prabandham. Technically, the whole city is considered a Divya Desam, not just the temple. The temple is counted as one of the eight temples of Vishnu that self-manifested and is classified as Swayamvyaktha Kshetra.","la":27.4363,"lo":80.5705,"tk":"Chakra kund (Chakra Teertha temple) and Gomati river","fs":"Purnima","ia":"T.sujatha","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/wiki/File:Cakratirtham.jpg"},"98":{"t":"Jyotirmath","d":"A pilgrimage site of the Alvars, who venerated Vishnu as Narasimha.","x":"Joshimath, also known as Jyotirmath, is a town and a municipal board in Chamoli District in the state of Uttarakhand. Located at a height of 6,150 feet (1,875 m), it is a gateway to several Himalayan mountain climbing expeditions, trekking trails and pilgrim centres like Badrinath. It is home to one of the four cardinal pīthas believed by tradition to be established by Adi Shankara. Since 7 February 2021, the area was severely affected by the 2021 Uttarakhand flood and its aftermath. The town is confirmed to be sinking due to its geographic location being along a running ridge.","la":29.9298,"lo":79.4224,"ws":"http://chamoli.nic.in","ia":"Rohit Sharma","il":"CC BY-SA 4.0","ip":"https://commons.wikimedia.org/wiki/File:Narsingh_Temple,_Joshimath.jpg"},"99":{"t":"Raghunathji_Temple,_Devprayag","d":"Believed to be the site Rama performed a penance after slaying Ravana, the son of a sage.","x":"Raghunathji Temple (also called Tirukantamenum Kadi Nagar) in Devprayag, a pilgrimage town in Tehri Garhwal district in Himalayas in the North Indian state of Uttarakhand, is dedicated to Vishnu. It is located 73 km from Rishikesh on the Rishikesh–Badrinath highway. Constructed in the Deula style, the temple is glorified in the Nalayira Divya Prabandham, the early medieval Tamil canon of the Alvar saints from the 6th–9th centuries CE. It is one of the 108 Divyadesam dedicated to Vishnu, who is worshipped as Raghunathji (Rama) and his consort Lakshmi as Sita. The temple was originally believed to have been established by Adi Shankara during the 8th century, with later expansions by the Garhwal Kingdom. The temple is located uphill on the confluence of the Alaknanda and Bhagirathi rivers, which becomes the river Ganga subsequently. Raghunathji is believed to have performed penance at this place to relieve himself of the curse committed by killing Ravana. The temple is maintained and administered by the Uttarakhand Tourism Development Board of the Government of Uttarakhand.","la":30.1456,"lo":78.5644,"ia":"Wilson44691","il":"Public domain","ip":"https://commons.wikimedia.org/wiki/File:Devprayag2008.JPG"},"100":{"t":"Badrinath_temple","d":"Lakshmi is believed to have protected and massaged Vishnu's feet at this site. One of the most famous Vaishnavite pilgrimage sites in India, this temple is a part of the Char Dham and Chota Char Dham circuits.","x":"Badarinath Temple, also known as Badarinarayana Temple, is a Hindu temple dedicated to Vishnu. It is located in the town of Badrinath in Chamoli district of Uttarakhand, India. The temple is one of the 108 Divya Desams, sacred to Vaishnavism, where Vishnu is worshipped as Badrinath. Due to extreme weather conditions in the Himalayas, the temple is open for six months each year, from late April to early November. It is one of the most visited pilgrimage centres of India, having recorded 2.8 million (28 lakh) visits in just 2 months in 2022. It is one of the Char Dham pilgrimage sites. The image of the presiding deity worshipped in the temple is a 1 ft (0.30 m), the black granite deity of Vishnu in the form of Badrinarayan. The deity is considered by many Hindus to be one of eight svayam vyakta kshetras, or self-manifested deities of Vishnu. The temple was included in the Uttar Pradesh state government Act No. 30/1948 as Act no. 16,1939, which later came to be known as \"Shri Badarinath and Shri Kedarnath Mandir Act\".","la":30.7447,"lo":79.4912,"ia":"Vishwanath Negi","il":"CC BY 4.0","ip":"https://commons.wikimedia.org/wiki/File:Badrinath_Temple,_Uttarakhand_(Photo-_Vishwanath_Negi).jpg"},"101":{"t":"Muktinath","d":"Praised by Thirumangai Alvar as a sacred site of Vishnu, possibly owing to its proximity to Shaligram stones.","x":"Muktinath (Nepali: मुक्तिनाथ) is an ancient religious complex located in Mustang, Nepal, primarily associated with the cult of Vishnu. The temple of Muktinath, known as 'the lord of salvation' (mukti), is sacred to both Hindus and Buddhists whom they worship as an abode of Hindu deities Vishnu and Shakti, and Buddhist bodhisattva Avalokiteśvara respectively. Located in the Muktinath valley at the foot of the Thorong La mountain pass, it is one of the world's highest temples at an altitude of 3,800 meters. Muktinath is a shrine site. Although the surrounding valley and rural municipality (gaunpalika) bear its name, there are no human settlements called Muktinath. The place sits close to the village of Jharkot, overlooking it. Along the path between this village and the shrine lies the ancient hamlet of Ranipauwa, which nowadays forms a true village of Muktinath. For Buddhists, Muktinath is an abode of dakinis - goddesses known as Sky Dancers and is considered one of the twenty-four Tantric places.","la":28.8167,"lo":83.8713,"tw":"Kanaka Vimanam","tk":"Gandaki River or Chakra Tirtham","ia":"Gaurab Gauchan","il":"CC BY-SA 3.0","ip":"https://commons.wikimedia.org/
